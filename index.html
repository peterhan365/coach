<style>
/* 1+6 커뮤니케이션 진단 — 리포트 화면 CSS (peter-design-system 토큰 · Pretendard 단일) */
:root{
  --ink:#122420; --ink-soft:#24332C; --gray:#5E6A64; --line:#E2EBE4; --paper:#F4F7F4; --white:#fff;
  --green:#1F9E43; --green-dk:#157A34; --blue:#2E6E9E;
  --lv1:#F4F8F5; --lv2:#DDF0E2; --lv3:#BCE3C6; --lv4:#9FD5AC;
  --plate:#EAF2EC;
  --r-sm:12px; --r-md:18px; --shadow-sm:0 2px 10px rgba(18,36,32,.06);
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink-soft);background:var(--paper);line-height:1.6;font-size:15px;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 56px}
h1,h2,h3,h4{color:var(--ink);margin:0;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* 머리 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.topbar img{height:40px;width:auto;display:block}
.sample-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--gray);background:#fff;border:1px solid var(--line);border-radius:50px;padding:5px 12px;white-space:nowrap}
.sample-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gray)}
.hero{padding:18px 0 22px}
.eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-dk);margin-bottom:8px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.025em}
.hero .lead{margin-top:10px;color:var(--ink-soft);font-size:16px;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:50px;padding:3px 10px;white-space:nowrap}

/* 카드 · 섹션 */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:26px}
.sec{margin-top:36px}
.sec-head{margin-bottom:14px}
.sec-head .eyebrow{margin-bottom:4px}
.sec-head h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sec-head p{color:var(--gray);margin-top:4px;font-size:14px}
.muted{color:var(--gray)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--gray);margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* 라벨 */
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 7px;line-height:18px;white-space:nowrap}
.tag-fail{background:var(--ink);color:#fff}
.tag-caution{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag-soft{background:var(--paper);color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--line)}
.tag-green{background:var(--green-dk);color:#fff}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:var(--green-dk);color:#fff;font-size:12px;font-weight:800;flex:none}
.legend{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 18px;font-size:13px;color:var(--ink-soft);margin:0 0 4px}
.legend .k{display:inline-flex;align-items:center;gap:7px}
.key-area{width:18px;height:12px;border-radius:3px;background:rgba(31,158,67,.18);box-shadow:inset 0 0 0 1.5px var(--green)}
.key-line{width:20px;height:2px;background:var(--blue);position:relative}
.key-line::after{content:"";position:absolute;left:6px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.key-line.gray{background:var(--gray)}.key-line.gray::after{background:var(--gray)}
.key-dot{width:10px;height:10px;border-radius:50%}

/* 요약 — 1+6 */
.summary{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px;align-items:start}
.onesix{padding:0;overflow:hidden}
.onesix-top{padding:22px 22px 0}
.label-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.part-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--ink)}
.part-label b{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;
  background:var(--green);color:#fff;font-size:14px;letter-spacing:0;padding:0 5px}
.hex{display:block;width:100%;height:auto}
.hex-mob{display:none}
.hx-ring{fill:none;stroke:#E2EBE4;stroke-width:1}
.hx-ring.mid{stroke:#9DB4A4;stroke-width:1.6}
.hx-spoke{stroke:#E2EBE4;stroke-width:1}
.hx-tick{font-size:10px;fill:#8A968F;font-weight:600}
.hx-name{font-weight:700;fill:var(--ink)}
.hx-score{font-weight:800;fill:var(--ink)}
.hx-sub{font-weight:600;fill:var(--gray)}
.hx-chip rect{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.hx-chip text{font-weight:700;fill:var(--ink)}
.hx-shadow{fill:rgba(18,36,32,.07)}

/* 핵심 요약 카드 — 영역마다 강점 먼저, 보완 다음 */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.picks-floor{grid-template-columns:1fr;margin-bottom:14px}
.card.pk{padding:18px 20px 16px;display:flex;flex-direction:column;gap:0}
.card.pk-floor{padding:18px 0 0;overflow:hidden}
.card.pk-floor .pk-head,.card.pk-floor .pk-one,.card.pk-floor .pk-line,.card.pk-floor .pk-flat{padding-left:22px;padding-right:22px}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pk-name{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em;min-width:0}
.pk-score{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1;flex:none;
  font-variant-numeric:tabular-nums}
.pk-caution .pk-score{color:var(--ink)}
.pk-one{font-size:13px;color:var(--gray);margin:4px 0 12px;line-height:1.5}
.pk-line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;
  padding:9px 0;border-top:1px solid var(--line)}
.pk-k{font-size:11.5px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 0;text-align:center;
  line-height:18px;margin-top:1px}
.is-strong .pk-k{background:var(--green-dk);color:#fff}
.is-weak .pk-k{background:var(--ink);color:#fff}
.pk-v{display:flex;flex-wrap:wrap;gap:6px 10px}
.pk-i{display:inline-flex;align-items:baseline;gap:5px;font-size:14.5px;font-weight:700;color:var(--ink)}
.pk-i b{font-size:14px;font-weight:800;color:var(--green-dk);font-variant-numeric:tabular-nums}
.is-weak .pk-i b{color:var(--ink)}
.pk-i i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--gray)}
.pk-flat{font-size:13.5px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px;margin:0}
.card.pk-floor .floor{margin-top:12px}
.floor-bare{padding-top:14px}

/* 기반 판 */
.floor{background:var(--plate);border-top:4px solid var(--green);padding:16px 22px 20px;position:relative}
.floor-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}
.floor-head .phrase{font-size:14px;color:var(--ink-soft);margin-top:4px}
.floor-big{text-align:right;line-height:1}
.floor-big .v{font-size:44px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.floor-big .u{font-size:12px;color:var(--gray);font-weight:600;display:block;margin-top:5px}
.floor-big .pair{display:flex;gap:16px;justify-content:flex-end;align-items:flex-end}
.floor-big .pair .v{font-size:36px}
.floor-big .pair .who{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:12px;color:var(--gray);font-weight:600;margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{position:relative;border-radius:10px;padding:9px 10px 10px;min-height:94px;display:flex;flex-direction:column;
  background:var(--lv1);box-shadow:inset 0 0 0 1px rgba(18,36,32,.08)}
.tile.lv2{background:var(--lv2)}.tile.lv3{background:var(--lv3)}.tile.lv4{background:var(--lv4)}
.tile.fail{box-shadow:inset 0 0 0 2px var(--ink)}
.tile .t-top{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:20px}
.tile .code{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.tile .badges{display:flex;gap:3px;align-items:center}
.tile .rank{width:20px;height:20px;font-size:11px}
.tile .name{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25;margin-top:2px;flex:1}
.tile .score{font-size:21px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:4px}
.tile .score small{font-size:11px;font-weight:600;color:var(--ink-soft);margin-left:2px}
.bar{height:5px;border-radius:3px;background:rgba(18,36,32,.12);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green-dk)}
.bar.self i{background:var(--blue)}
.bar.thin{height:4px;margin-top:4px}
.tile .pairvals{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink);margin-top:5px}
.tile .pairvals span{display:inline-flex;align-items:center;gap:4px}
.dots{display:block;width:100%;height:auto;margin-top:5px}
.floor-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;font-size:12px;color:var(--ink-soft)}
.floor-legend .sw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(18,36,32,.12)}
.floor-legend .fl{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-shadow:inset 0 0 0 2px var(--ink)}

/* 요약 옆 */
.side h3{font-size:15px;font-weight:800;margin-bottom:8px}
.side .interp{font-size:15.5px;color:var(--ink);line-height:1.65}
.side .interp b{font-weight:800}
.side hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.dlist li{display:grid;grid-template-columns:minmax(0,1fr) 38px;align-items:center;gap:4px 10px}
.dlist .dn{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.dlist .dv{font-size:15px;font-weight:800;color:var(--ink);text-align:right}
.dlist .bar{grid-column:1 / -1;margin-top:0}
.minirank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.minirank li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--ink)}
.minirank .sc{margin-left:auto;font-weight:800}

/* 공통 상세 */
.rows{display:grid;gap:0}
.row{display:grid;grid-template-columns:56px minmax(0,190px) 110px minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .code{font-size:12px;font-weight:700;color:var(--gray)}
.row .nm{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .val{display:flex;flex-direction:column}
.row .val b{font-size:16px;font-weight:800;color:var(--ink)}
.row .txt{font-size:14px;color:var(--ink-soft)}

/* 처방 카드 */
.rx{display:flex;flex-direction:column;gap:10px;height:100%}
.rx-head{display:flex;align-items:flex-start;gap:10px}
.rx-head .rank{width:30px;height:30px;font-size:15px}
.rx-head h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.rx-head .meta{font-size:12.5px;color:var(--gray);margin-top:2px}
.rx .score-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.rx .score-line b{font-size:15px;color:var(--ink)}
.rx dl{margin:0;display:grid;gap:9px}
.rx dt{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--green-dk)}
.rx dd{margin:2px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.rx .practice{background:var(--paper);border-radius:10px;padding:10px 12px}
.decks{display:flex;flex-wrap:wrap;gap:6px}
.deck{font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.deck b{color:var(--green-dk);margin-right:4px}
.str h3{font-size:16px}
.str .def{font-size:14px;color:var(--ink-soft);margin-top:6px}

/* 영역별 문항 */
details.dom{border-top:1px solid var(--line)}
details.dom:first-of-type{border-top:0}
details.dom summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 150px 44px 18px;gap:14px;align-items:center;padding:14px 2px}
details.dom summary::-webkit-details-marker{display:none}
details.dom summary .t{font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.dom summary .t small{font-weight:600;color:var(--gray);font-size:13px}
details.dom summary .v{font-size:18px;font-weight:800;color:var(--ink);text-align:right}
details.dom summary .chev{width:10px;height:10px;border-right:2px solid var(--gray);border-bottom:2px solid var(--gray);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details.dom[open] summary .chev{transform:rotate(-135deg);margin-top:4px}
details.dom summary:focus-visible{outline:3px solid #7CB342;outline-offset:2px;border-radius:8px}
.items{padding:0 2px 16px}
.irow{display:grid;grid-template-columns:48px minmax(0,1fr) 210px;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed transparent}
.irow + .irow{border-top:1px solid #EEF3EF}
.irow .code{font-size:12px;font-weight:700;color:var(--gray)}
.irow .q b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--ink)}
.irow .q span{display:block;font-size:13px;color:var(--gray)}
.scale5{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:10px}
.scale5 .lab{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-align:right;white-space:nowrap}
.scale5 .bar{margin-top:0;height:8px}

/* 표 */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--gray);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-soft)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td b{color:var(--ink)}
table.t tr:last-child td{border-bottom:0}
table.t .sub{display:block;font-size:12.5px;color:var(--gray)}
.tbl-wrap{overflow-x:auto}

/* 요약 인용 */
.voice{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.voice li{position:relative;padding:10px 14px 10px 16px;background:var(--paper);border-radius:10px;font-size:14.5px;color:var(--ink)}
.voice li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--green)}
.voice-q{font-size:13px;font-weight:700;color:var(--gray);margin:0 0 8px}

/* 팀·대시보드 */
.dist{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dist:first-child{border-top:0}
.dist .dn{font-weight:700;color:var(--ink);font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:#fff}
.stack span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink)}
.stack .s1{background:var(--lv1);box-shadow:inset 0 0 0 1px rgba(18,36,32,.1)}.stack .s2{background:var(--lv2)}.stack .s3{background:var(--lv3)}.stack .s4{background:var(--lv4)}.stack .s5{background:var(--green-dk);color:#fff}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-soft);margin-top:10px}
.stack-legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dumb{display:block;width:100%;height:24px}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.dash .card.wide{grid-column:1 / -1}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.panel-h .pn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;flex:none}
.panel-h h3{font-size:17px;font-weight:800}
.panel-d{font-size:13px;color:var(--gray);margin-bottom:12px}
.hexpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.privacy{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.flag{font-weight:800;color:var(--ink)}

/* 하단 */
.foot{margin-top:40px}
.foot .card{display:grid;gap:12px}
.foot p{font-size:13.5px;color:var(--ink-soft)}
.foot .kakao{display:inline-flex;align-items:center;gap:8px;align-self:start;background:var(--green-dk);color:#fff;text-decoration:none;
  font-weight:700;font-size:15px;border-radius:50px;padding:11px 22px;transition:transform .2s,box-shadow .2s}
.foot .kakao:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,122,52,.28)}
.foot .kakao:focus-visible{outline:3px solid #7CB342;outline-offset:2px}
.foot .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;color:var(--gray);font-size:12.5px}
.foot .brand img{height:34px;width:auto}

/* 모바일 */
@media (max-width:860px){
  .summary{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .dash{grid-template-columns:1fr}
  .hexpair{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:14.5px}
  .wrap{padding:0 14px 40px}
  .topbar img{height:32px}
  .hero h1{font-size:25px}
  .hero .lead{font-size:15px}
  .card{padding:18px}
  .onesix-top{padding:16px 14px 0}
  .floor{padding:14px 14px 16px}
  .hex-desk{display:none}
  .hex-mob{display:block}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .floor-big .v{font-size:38px}
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:44px minmax(0,1fr) 70px;gap:8px 10px}
  .row .txt{grid-column:2 / -1}
  details.dom summary{grid-template-columns:minmax(0,1fr) 40px 16px}
  details.dom summary .bar{display:none}
  .irow{grid-template-columns:40px minmax(0,1fr)}
  .irow .scale5{grid-column:2 / -1}
  .dist{grid-template-columns:minmax(0,1fr) 40px}
  .dist .stack{grid-column:1 / -1;order:3}
  .sec-head h2{font-size:20px}
}

/* 인쇄 — A4 첫 쪽에 육각형과 핵심 요약을 함께 */
@page{size:A4;margin:11mm 10mm}

/* ── 팀 360 라이트 — 본인 · 동료 · 리더 (설계 5장) ───────── */
.peer-mini{display:flex;align-items:baseline;justify-content:space-between;gap:4px;margin-top:5px;
  padding-top:5px;border-top:1px dashed rgba(18,36,32,.16)}
.bar.peer i{background:var(--blue)}
.bar.peer{margin-top:3px}
.peer-mini .pm-k{font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
.peer-mini .pm-v{font-size:14px;font-weight:800;color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.three-i{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff}
.three-i.is-self{background:var(--paper);border-color:#CFE0D4}
.three-i .who{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
.three-i .who small{font-weight:600;color:var(--gray);letter-spacing:0}
.three-i .v{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.1;margin:2px 0 6px}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}.three-i .v{font-size:24px}}

@media print{
  body{background:#fff;font-size:11.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;padding:0}
  .topbar{padding-top:0}
  .topbar img{height:30px}
  .hero{padding:8px 0 10px}
  .hero h1{font-size:22px}
  .hero .lead{font-size:12.5px;margin-top:6px}
  .card{box-shadow:none;padding:14px}
  .summary{grid-template-columns:1fr;gap:10px}
  .side{display:none}
  .onesix{break-inside:avoid}
  .onesix-top{padding:10px 14px 0}
  .summary{margin-top:6px}
  .sec-head{margin-bottom:6px}
  .sec-head p{font-size:10.5px;margin-top:2px}
  .sec-head h2{font-size:17px}
  .hex-desk{display:block;max-width:80mm;margin:0 auto}   /* 첫 쪽에 핵심 요약까지 들어가게 줄인다 */
  .hex-mob{display:none}
  .floor{padding:8px 12px 10px}
  .floor-big .v{font-size:32px}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .tile{min-height:0;padding:4px 7px 5px}
  .tile .t-top{min-height:0}
  .tile .code{font-size:9.5px}
  .tile .rank{width:15px;height:15px;font-size:9.5px}
  .tile .name{font-size:10.5px;margin:1px 0 0}
  .tile .score{font-size:14px}
  .tile .score-row{margin-top:2px}
  .tile .bar{margin-top:3px}
  .floor-legend{font-size:9.5px;gap:4px 10px;margin-top:7px}
  .sec{margin-top:18px}
  .sec.pb{break-before:page}
  .rx,.str,.dist,.row,.irow,tr{break-inside:avoid}
  /* 첫 쪽에 육각형 + 핵심 요약이 함께 오게 한다 */
  .picks{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .picks-floor{grid-template-columns:1fr;margin-bottom:8px}
  .card.pk{padding:10px 12px 9px;break-inside:avoid}
  .card.pk-floor{padding:10px 0 0}
  .card.pk-floor .pk-head,.card.pk-floor .pk-one,.card.pk-floor .pk-line,.card.pk-floor .pk-flat{padding-left:14px;padding-right:14px}
  .pk-name{font-size:12.5px}
  .pk-score{font-size:20px}
  .pk-one{font-size:10.5px;margin:2px 0 7px}
  .pk-line{padding:5px 0;grid-template-columns:38px minmax(0,1fr);gap:7px}
  .pk-k{font-size:9.5px;line-height:15px}
  .pk-i{font-size:11.5px;gap:4px}
  .pk-i b{font-size:11px}
  .pk-i i{font-size:9.5px}
  .pk-flat{font-size:10.5px;padding-top:6px}
  .foot .kakao{border:1px solid var(--green-dk)}
  details.dom summary .chev{display:none}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 검수 1차 보정 ─────────────────────────────── */
/* 로고: 원본 PNG의 투명 여백을 화면에서만 잘라 보인다 (파일은 그대로) */
.logo{display:block;width:auto;aspect-ratio:1038 / 533;object-fit:cover;object-view-box:inset(28.5% 27.2% 38.2% 24.1%)}
.topbar img.logo{height:50px}
.foot .brand img.logo{height:40px}
/* 타일: 코드 한 줄 · 보완 라벨은 점수 줄 오른쪽 */
.tile .code{white-space:nowrap}
.tile .t-top .rank{margin-left:auto}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.tile .score-row .score{margin-top:0}
.tile .pairvals{justify-content:flex-start;gap:9px;align-items:center}
.tile .pairvals .tag{margin-left:auto}
.pv{display:inline-flex;align-items:center;gap:4px}
.mk-self{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.mk-obs{display:inline-block;width:9px;height:9px;border-radius:2px;background:rgba(31,158,67,.25);box-shadow:inset 0 0 0 1.5px var(--green)}
/* 육각형 눈금 글자가 데이터 선 위에서도 읽히게 */
.hx-tick{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
/* 하단 버튼은 글자 폭만 */
.foot .kakao{justify-self:start}
/* 표 안의 분포 점 */
.tdots{display:inline-block;vertical-align:middle}
/* 회기 제안이 하나일 때 한 줄 전체 */
.session-one{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px;align-items:start}
.session-one .voice{gap:8px}
.voice .sub{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px}
.chg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chg span{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--paper);border-radius:8px;padding:3px 9px}
.chg b{font-weight:800;margin-left:3px}
.side .legend{justify-content:flex-start;margin:-2px 0 8px;font-size:12px}
@media (max-width:860px){.session-one{grid-template-columns:1fr}}
@media (max-width:600px){.topbar img.logo{height:40px}}
@media print{.topbar img.logo{height:36px}}

/* ── 검수 2차 보정 ─────────────────────────────── */
.irow .q b .tag{display:inline-flex;font-size:11px}
.irow .q b .tag-fail,.irow .q b .tag-green{color:#fff}
table.t td.nw{white-space:nowrap}
@media (max-width:600px){table.t .hide-m{display:none}table.t td,table.t th{padding:9px 6px}}

*{-webkit-tap-highlight-color:transparent}
body{font-size:16px;line-height:1.65;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid #7CB342;outline-offset:2px;border-radius:6px}
.a-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#a-app{min-height:100dvh}
.a-screen{display:none}
.a-screen.a-on{display:block}
.a-shell{max-width:600px;margin:0 auto;padding:0 20px;width:100%}

/* 버튼 */
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:52px;padding:.8rem 1.5rem;border-radius:var(--pill);border:1px solid transparent;
  font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.3;
  transition:transform .18s var(--a-ease),background .18s,border-color .18s,box-shadow .18s}
.a-primary{background:var(--green-dk);color:#fff}
.a-primary:hover{background:#0F5F27;transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,158,67,.28)}
.a-line{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:var(--a-sh-sm)}
.a-line:hover{border-color:var(--green);color:var(--green-dk);transform:translateY(-2px)}
.a-kakao{background:#FEE500;color:#191919}
.a-block{width:100%}
.a-btn:active{transform:translateY(0) scale(.99)}
.a-btn[disabled]{opacity:.55;cursor:default;transform:none}

.a-logo{display:block;width:136px;height:70px;margin:0 auto;background:var(--a-logo) center/contain no-repeat}
.a-eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green-dk)}

/* 시작 */
#a-start .a-hero{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:36px 20px 30px;max-width:600px;margin:0 auto}
#a-start h1{font-size:clamp(28px,7.6vw,36px);margin:16px 0 8px;letter-spacing:-.03em;font-weight:800}
#a-start .a-sub{font-size:17px;color:var(--gray);margin:0 0 18px}
.a-meta{display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1px solid var(--line);
  border-radius:var(--pill);padding:.5rem 1.05rem;font-size:13.5px;font-weight:700;letter-spacing:.04em;
  color:var(--ink);box-shadow:var(--a-sh-sm);margin-bottom:8px}
.a-meta .a-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.a-strip{display:flex;gap:5px;justify-content:center;margin:6px 0 20px;width:100%;max-width:340px}
.a-strip span{flex:1;height:6px;border-radius:3px;background:var(--lv3)}
.a-strip span:nth-child(2){background:var(--lv4)}
.a-strip span:nth-child(4){background:var(--lv2)}
.a-guide{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--a-sh-sm);
  padding:18px 20px;text-align:left;font-size:15px;line-height:1.7;margin:4px 0 20px;width:100%}
.a-guide p{margin:0 0 .6em}
.a-guide p:last-child{margin:0}
.a-guide .a-small{font-size:13.5px;color:var(--gray)}
.a-actions{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.a-note{font-size:13px;color:var(--gray);margin-top:20px;line-height:1.7;max-width:430px}
.a-qr{margin:22px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.a-qr[hidden],.a-screen[hidden]{display:none!important}
.a-qr img{width:108px;height:108px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:6px}
.a-qr figcaption{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.a-warn{background:#FFF6E0;border:1px solid #F0DFAE;color:#6A5312;border-radius:var(--r-sm);
  padding:11px 14px;font-size:13.5px;line-height:1.6;margin:0 0 16px;text-align:left;width:100%}

/* 가운데 정렬 낱장 화면 (이름 · 이끄는 자리 · 서술형 · 보내는 중 · 완료) */
.a-mid{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 20px;
  max-width:600px;margin:0 auto}
.a-mid h2{font-size:25px;margin:6px 0 8px;letter-spacing:-.025em}
.a-mid .a-hint{color:var(--gray);font-size:15px;margin:0 0 20px;line-height:1.65}
.a-field{width:100%;height:56px;padding:0 18px;font-size:17px;font-family:inherit;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--a-sh-sm);margin-bottom:14px}
.a-area{width:100%;min-height:104px;padding:14px 16px;font-size:16px;font-family:inherit;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--a-sh-sm);
  margin-bottom:18px;line-height:1.6;resize:vertical}
.a-field:focus,.a-area:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,158,67,.14)}
.a-openq{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 8px;line-height:1.55}

/* 문항 */
#a-quiz.a-on{display:flex;flex-direction:column;min-height:100dvh}
.a-prog{height:6px;background:var(--line);flex:0 0 auto}
.a-prog i{display:block;height:100%;width:0;background:var(--green);border-radius:0 3px 3px 0;transition:width .3s var(--a-ease)}
.a-qtop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:48px;padding:4px 14px;max-width:600px;margin:0 auto;width:100%}
.a-ghost{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:.4rem .7rem;
  background:none;border:0;color:var(--gray);font-size:15px;font-weight:600;cursor:pointer;border-radius:var(--pill)}
.a-ghost:hover{color:var(--green-dk);background:rgba(31,158,67,.07)}
.a-ghost[hidden]{visibility:hidden;display:inline-flex}
.a-where{font-size:12.5px;font-weight:700;color:var(--gray);letter-spacing:.04em;white-space:nowrap}
.a-qbody{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;width:100%}
.a-qtag{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--green-dk);margin-bottom:8px}
.a-qtext{font-size:clamp(20px,5.4vw,24px);font-weight:800;color:var(--ink);letter-spacing:-.025em;
  line-height:1.42;margin:0 0 20px}
.a-opts{display:flex;flex-direction:column;gap:9px}
.a-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:11px 14px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--a-sh-sm);
  font-size:16.5px;font-weight:600;color:var(--ink-soft);text-align:left;cursor:pointer;line-height:1.4;
  transition:border-color .15s var(--a-ease),box-shadow .15s var(--a-ease),background .15s}
.a-opt .a-num{flex:0 0 26px;height:26px;border-radius:8px;background:var(--paper);color:var(--gray);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:.15s}
.a-opt .a-tx{flex:1 1 auto}
.a-opt:hover{border-color:#bcd9c5}
.a-opt[aria-pressed="true"]{border-color:var(--green);background:#F2FBF4;box-shadow:0 0 0 2px rgba(31,158,67,.18)}
.a-opt[aria-pressed="true"] .a-num{background:var(--green-dk);color:#fff}
.a-opt.a-na{font-weight:500;color:var(--gray);font-size:15px;min-height:48px}
.a-sect{text-align:left}
.a-sect h2{font-size:clamp(24px,6.4vw,30px);letter-spacing:-.03em;margin:8px 0 6px}
.a-sect .a-line1{font-size:17px;color:var(--gray);margin:0 0 14px}
.a-sect .a-restnote{font-size:14.5px;color:var(--ink-soft);background:var(--plate);border-radius:var(--r-sm);
  padding:13px 15px;margin:0 0 20px;line-height:1.6}
.a-sect .a-count{font-size:13px;color:var(--gray);margin:0 0 20px;font-weight:600;letter-spacing:.04em}
.a-fade{animation:aIn .22s var(--a-ease)}
@keyframes aIn{from{opacity:0;transform:translateX(18px)}}

/* 리더 예측 — 0~100 슬라이더 */
.a-slwrap{margin:0 0 24px}
.a-slval{display:block;text-align:center;font-size:52px;font-weight:800;color:var(--green-dk);
  letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.a-slval::after{content:attr(data-unit);font-size:17px;font-weight:700;color:var(--gray);margin-left:6px}
.a-slider{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:6px 0 2px}
.a-slider::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--lv2);border:1px solid var(--line)}
.a-slider::-moz-range-track{height:10px;border-radius:5px;background:var(--lv2);border:1px solid var(--line)}
.a-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--green-dk);border:4px solid #fff;box-shadow:var(--a-sh-md);margin-top:-13px;cursor:pointer}
.a-slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--green-dk);
  border:4px solid #fff;box-shadow:var(--a-sh-md);cursor:pointer}
.a-slticks{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gray);
  letter-spacing:.04em;padding:0 2px}
.a-slhint{font-size:14px;color:var(--ink-soft);background:var(--plate);border-radius:var(--r-sm);
  padding:12px 14px;margin:16px 0 0;line-height:1.6}

/* 코치 입력 모드 */
.a-cshell{max-width:900px;margin:0 auto;padding:18px 18px 48px}
.a-chead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding-bottom:12px;border-bottom:2px solid var(--green);margin-bottom:18px}
.a-chead h2{font-size:22px;letter-spacing:-.025em;margin-top:4px}

    minRelationGroup: 1, // 관계 묶음(상사·동료·부하 직원)은 1명이어도 따로 보인다
    mergeSmallGroups: false, // 동료·부하 직원 합치기 — 기본 꺼짐
    minObsItems: 6,      // 관찰자 영역 응답 문항 6개 미만이면 영역 점수 미표시 …
    minObsBase: 10,      // … 영역 10문항 기준. 문항 수가 다르면 같은 비율(60%)로 올림
    topN: 3,             // 시급 TOP 3 · 강점 TOP 3
    listN: 5,            // 팀 과락 TOP 5 · 의견 갈림 TOP 5
    levels: [25, 50, 75] // 바닥 판 명도 네 단계: ≤25 · 25~50 미만 · 50~75 미만 · 75 이상
  };
  var EPS = 1e-9;

  /* ── 기본 계산 ─────────────────────────────────────────── */
  function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function r3(x) { return x === null ? null : Math.round(x * 1000) / 1000; }
  function vals(arr) { return arr.map(num).filter(function (v) { return v !== null; }); }
  function mean(arr) {
    var v = vals(arr); if (!v.length) return null;
    return v.reduce(function (s, x) { return s + x; }, 0) / v.length;
  }
  function sd(arr) {
    var v = vals(arr); if (!v.length) return null;
    var m = mean(v);
    return Math.sqrt(v.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / v.length);
  }
  function to100(avg) { return avg === null || avg === undefined ? null : (avg - 1) / 4 * 100; }
  function ge(a, b) { return a !== null && a >= b - EPS; }
  function le(a, b) { return a !== null && a <= b + EPS; }
  function lt(a, b) { return a !== null && a < b - EPS; }
  function level(s100) {
    if (s100 === null || s100 === undefined) return 0;
    var L = RULES.levels;
    if (le(s100, L[0])) return 1;
    if (lt(s100, L[1])) return 2;
    if (lt(s100, L[2])) return 3;
    return 4;
  }
  /* 화면 표시용 정수. 기준선 바로 아래 값이 반올림으로 기준선 위처럼 보이지 않게 한다. */
  function display100(s) {
    if (s === null || s === undefined) return null;
    var d = Math.round(s);
    if (lt(s, RULES.cautionDomain) && d >= RULES.cautionDomain) d = RULES.cautionDomain - 1;
    return d;
  }
  function dist(arr, scale) {
    var out = {}; scale.forEach(function (s) { out[s.v] = 0; });
    vals(arr).forEach(function (v) { if (out[v] !== undefined) out[v] += 1; });
    return out;
  }
  function minObsFor(nItems) { return Math.ceil(nItems * RULES.minObsItems / RULES.minObsBase - EPS); }

  /* ── 모델 읽기 ─────────────────────────────────────────── */
  function axisDomains(model) { return model.domains.filter(function (d) { return !d.floor; }); }
  function floorDomain(model) { return model.domains.filter(function (d) { return d.floor; })[0] || null; }
  function itemRows(model) {
    var out = [];
    model.domains.forEach(function (d, di) {
      d.items.forEach(function (it, ii) {
        out.push({ code: it.code, domainNo: d.no, floor: !!d.floor, order: di * 1000 + ii });
      });
    });
    return out;
  }
  function itemByCode(model, code) {
    for (var i = 0; i < model.domains.length; i++) {
      var its = model.domains[i].items;
      for (var j = 0; j < its.length; j++) if (its[j].code === code) return its[j];
    }
    return null;
  }
  /* 이끄는 자리 '아니요'면 -실무 판 문장을 쓴다 (원고 '시작 질문'). */
  function textFor(item, leads) {
    var alt = (!leads && item.alt) ? item.alt : {};
    return { self: alt.self || item.self, obs: alt.obs || item.obs, low: alt.low || item.low,
             practice: alt.practice || item.practice, alt: !!(!leads && item.alt) };
  }
  function domainOrder(model, no) {
    for (var i = 0; i < model.domains.length; i++) if (model.domains[i].no === no) return i;
    return 999;
  }

  /* ── 순위 ─────────────────────────────────────────────── */
  function keyVal(r, key) {
    if (key === 'obs') return r.obs !== null && r.obs !== undefined ? r.obs : r.self;
    return r[key];
  }
  function ascBy(key) {
    return function (a, b) {
      var d = keyVal(a, key) - keyVal(b, key);
      return Math.abs(d) > EPS ? d : a.order - b.order;   // 같으면 왼쪽 영역 먼저 (원인은 한 칸 왼쪽)
    };
  }
  function descBy(key) {
    return function (a, b) {
      var d = keyVal(b, key) - keyVal(a, key);
      return Math.abs(d) > EPS ? d : a.order - b.order;
    };
  }
  /* 시급 TOP 3 — PRD 4.5
     1 과락 문항 중 공통 역량 먼저 → 2 (360이면 관찰자, 아니면 본인) 점수 낮은 순
     → 3 같으면 왼쪽 영역 → 4 과락이 모자라면 가장 낮은 문항으로 채움 */
  function urgentTop(rows, key, n) {
    n = n || RULES.topN;
    var valid = rows.filter(function (r) { return keyVal(r, key) !== null; });
    var fails = valid.filter(function (r) { return r.fail; });
    var first = fails.filter(function (r) { return r.floor; }).sort(ascBy(key));
    var second = fails.filter(function (r) { return !r.floor; }).sort(ascBy(key));
    var picked = first.concat(second).slice(0, n);
    if (picked.length < n) {
      var rest = valid.filter(function (r) { return picked.indexOf(r) < 0; }).sort(ascBy(key));
      picked = picked.concat(rest.slice(0, n - picked.length));
    }
    return picked.map(function (r, i) { return { code: r.code, rank: i + 1, fromFail: !!r.fail }; });
  }
  /* 강점 TOP 3 — 4.5 이상 중 높은 순. 셋이 안 되면 다음으로 높은 문항으로 채우고 filled 표시 */
  function strengthTop(rows, key, n) {
    n = n || RULES.topN;
    var valid = rows.filter(function (r) { return keyVal(r, key) !== null; });
    var strong = valid.filter(function (r) { return ge(keyVal(r, key), RULES.strength); }).sort(descBy(key));
    var picked = strong.slice(0, n).map(function (r) { return { code: r.code, filled: false }; });
    if (picked.length < n) {
      valid.filter(function (r) { return strong.indexOf(r) < 0; }).sort(descBy(key))
        .slice(0, n - picked.length).forEach(function (r) { picked.push({ code: r.code, filled: true }); });
    }
    return picked.map(function (p, i) { p.rank = i + 1; return p; });
  }

  /* ── 영역 카드 — 리포트 '핵심 요약'이 쓰는 영역별 강점·보완 ────────
     영역 안에서 점수 높은 문항 n개(강점)와 낮은 문항 n개(보완)를 고른다.
     · 점수가 같으면 코드 순(앞 영역·앞 문항 먼저)
     · 보완은 보완 문항(기준선 아래)을 먼저 채우고 모자라면 낮은 순으로 잇는다
     · 보완 문항과 영역 최저점 문항은 강점으로, 영역 최고점 문항은 보완으로 고르지 않는다
     · 영역 안의 값이 모두 같으면 어느 쪽도 고르지 않는다(보완 문항만 남긴다) */
  function domainPicks(model, rows, key, opts) {
    opts = opts || {};
    var n = opts.n || 2, failKey = opts.failKey || 'fail';
    var byCode = {};
    rows.forEach(function (r) { byCode[r.code] = r; });
    var out = {};
    model.domains.forEach(function (d) {
      var list = d.items.map(function (it) { return byCode[it.code]; })
        .filter(function (r) { return r && keyVal(r, key) !== null && keyVal(r, key) !== undefined; });
      var pick = { no: d.no, floor: !!d.floor, strong: [], weak: [], flat: false, answered: list.length };
      out[d.no] = pick;
      if (!list.length) return;
      var hi = list.slice().sort(descBy(key)), lo = list.slice().sort(ascBy(key));
      var fails = lo.filter(function (r) { return !!r[failKey]; });
      pick.flat = Math.abs(keyVal(hi[0], key) - keyVal(lo[0], key)) < EPS;
      if (pick.flat) {
        pick.weak = fails.slice(0, n).map(codeOf);
        return;
      }
      var maxV = keyVal(hi[0], key), minV = keyVal(lo[0], key);
      /* 영역에서 가장 높은 값과 같은 문항은 보완으로, 가장 낮은 값과 같은 문항은 강점으로 고르지 않는다 */
      var weak = fails.concat(lo.filter(function (r) {
        return fails.indexOf(r) < 0 && keyVal(r, key) < maxV - EPS;
      })).slice(0, n);
      pick.weak = weak.map(codeOf);
      pick.strong = hi.filter(function (r) {
        return weak.indexOf(r) < 0 && !r[failKey] && keyVal(r, key) > minV + EPS;
      }).slice(0, n).map(codeOf);
    });
    return out;
  }
  function codeOf(r) { return r.code; }

  /* ── 개인 리포트 ───────────────────────────────────────── */
  function individual(model, answers, opts) {
    opts = opts || {};
    var rows = itemRows(model).map(function (r) {
      r.self = num(answers[r.code]);
      r.fail = le(r.self, RULES.failItem);
      r.strength = ge(r.self, RULES.strength);
      r.level = level(to100(r.self));
      return r;
    });
    var domains = model.domains.map(function (d) {
      var s = to100(mean(rows.filter(function (r) { return r.domainNo === d.no; }).map(function (r) { return r.self; })));
      return { no: d.no, floor: !!d.floor, self: r3(s), caution: lt(s, RULES.cautionDomain), level: level(s) };
    });
    return {
      kind: 'individual', leads: opts.leads !== false,
      domains: domains, items: strip(rows, ['self', 'fail', 'strength', 'level']),
      picks: domainPicks(model, rows, 'self'),
      urgent: urgentTop(rows, 'self'), strengths: strengthTop(rows, 'self'),
      fails: rows.filter(function (r) { return r.fail; }).sort(ascBy('self')).map(function (r) { return r.code; })
    };
  }

  /* ── 팀 360 라이트 — 기반(공통) 역량을 서로 본 값 (설계 5장) ────
     한 사람의 응답이 드러나지 않게 두 가지만 지킨다.
     ① 동료 묶음은 3명 이상일 때만 따로 보인다. 모자라면 '평가자 전체 평균' 한 줄로 합친다.
     ② 합친 줄을 보일 때는 관계별 줄을 함께 보이지 않는다 — 빼기로 한 사람 값이 나오기 때문이다.
     리더 한 사람의 평가만 예외로 따로 보이되 '1인 응답'이라고 적는다(설계 확정). */
  function peerStat(model, list, key, single) {
    var codes = floorDomain(model).items.map(function (it) { return it.code; });
    var items = {};
    codes.forEach(function (c) {
      var v = list.map(function (x) { return num(x.answers[c]); });
      items[c] = { avg: r3(mean(v)), n: vals(v).length };
    });
    var score = to100(mean(codes.map(function (c) { return items[c].avg; })));
    return { key: key, n: list.length, single: !!single, items: items, score: r3(score) };
  }
  /* peer 탭의 relation 은 '평가자가 본 상대의 자리'다 (설계 5장 — 리더→팀원 = report).
     리포트에서 필요한 것은 그 반대, '나를 본 사람이 누구인가'라서 한 번 뒤집어 읽는다. */
  function viewerOf(rel) { return rel === 'report' ? 'leader' : rel === 'leader' ? 'report' : 'peer'; }
  function peerLite(model, rows, opts) {
    opts = opts || {};
    var n = rows.length;
    if (n < RULES.minGroup) return { kind: 'peerLite', private: true, n: n, lines: [] };
    function of(rel) { return rows.filter(function (x) { return viewerOf(x.relation) === rel; }); }
    var peers = of('peer'), leaders = of('leader'), reports = of('report');
    var lines = [], merged = false;
    var big = [];
    if (peers.length >= RULES.minGroup) big.push(peerStat(model, peers, 'peer'));
    if (reports.length >= RULES.minGroup) big.push(peerStat(model, reports, 'report'));
    var shortN = (peers.length < RULES.minGroup ? peers.length : 0) +
                 (reports.length < RULES.minGroup ? reports.length : 0);
    if (shortN > 0 || !big.length) {
      lines = [peerStat(model, rows, 'all')];      // 한 줄로 합친다
      merged = true;
    } else {
      lines = big;
      if (leaders.length) lines.push(peerStat(model, leaders, 'leader', leaders.length === 1));
    }
    var codes = floorDomain(model).items.map(function (it) { return it.code; });
    var items = {};
    codes.forEach(function (c) {
      items[c] = {};
      lines.forEach(function (g) { items[c][g.key] = g.items[c].avg; });
    });
    return { kind: 'peerLite', private: false, n: n, merged: merged, lines: lines, items: items };
  }
  /** 대시보드 — 팀원이 서로를 본 값을 문항별로 모은다. 누가 누구를 봤는지는 남기지 않는다. */
  function peerTeam(model, rows) {
    var n = rows.length;
    if (n < RULES.minGroup) return { kind: 'peerTeam', private: true, n: n };
    var codes = floorDomain(model).items.map(function (it) { return it.code; });
    var items = {};
    codes.forEach(function (c) {
      var v = rows.map(function (x) { return num(x.answers[c]); });
      var st = teamStat(model, rows, function (x) { return num(x.answers[c]); });
      items[c] = { avg: st.avg, sd: st.sd, n: st.n, dist: st.dist,
                   teamFail: st.teamFail, failBy: st.failBy, split: st.split };
    });
    var score = to100(mean(codes.map(function (c) { return items[c].avg; })));
    var raters = {}, subjects = {};
    rows.forEach(function (x) { raters[x.rater] = 1; subjects[x.subject] = 1; });
    return { kind: 'peerTeam', private: false, n: n, score: r3(score), items: items,
             raterCount: Object.keys(raters).length, subjectCount: Object.keys(subjects).length };
  }

  /* ── 360 ─────────────────────────────────────────────── */
  function groupDomains(model, observers) {
    return model.domains.map(function (d) {
      var avgs = d.items.map(function (it) {
        return mean(observers.map(function (o) { return o.answers[it.code]; }));
      });
      var answered = avgs.filter(function (v) { return v !== null; }).length;
      var enough = answered >= minObsFor(d.items.length);
      return { no: d.no, score: enough ? r3(to100(mean(avgs))) : null, answered: answered,
               reason: enough ? null : 'few-items' };
    });
  }
  /* 관계별 묶음 — 상사(leader) · 동료(peer) · 부하 직원(report)
     2026-09-18 피터 확정: 360은 관계별 1명씩 · 합계 3명이면 연다.
     관계 묶음은 1명이어도 따로 보이고, 1명뿐이면 '1인 응답'을 적는다.
     동료·부하 직원 합치기는 기본으로 쓰지 않는다(RULES.mergeSmallGroups). */
  function relationGroups(model, observers) {
    var minG = RULES.minRelationGroup;
    function of(role) { return observers.filter(function (o) { return o.role === role; }); }
    var leader = of('leader'), peer = of('peer'), report = of('report');
    var groups = [];
    function push(key, list, extra) {
      var g = { key: key, n: list.length, private: list.length < minG, single: list.length === 1 };
      Object.keys(extra || {}).forEach(function (k) { g[k] = extra[k]; });
      g.domains = g.private
        ? model.domains.map(function (d) { return { no: d.no, score: null, reason: 'private' }; })
        : groupDomains(model, list);
      groups.push(g);
    }
    if (leader.length) push('leader', leader);
    if (RULES.mergeSmallGroups && !(peer.length >= RULES.minGroup && report.length >= RULES.minGroup)
        && peer.length + report.length > 0) {
      push('peer+report', peer.concat(report), { merged: true, parts: { peer: peer.length, report: report.length } });
    } else {
      if (peer.length) push('peer', peer);
      if (report.length) push('report', report);
    }
    push('all', observers);
    return groups;
  }
  function threeSixty(model, selfAnswers, observers, opts) {
    opts = opts || {};
    var total = observers.length;
    var hide = total < RULES.min360Total;
    var rows = itemRows(model).map(function (r) {
      var ov = observers.map(function (o) { return o.answers[r.code]; });
      r.self = num(selfAnswers[r.code]);
      r.obs = hide ? null : r3(mean(ov));
      r.obsN = vals(ov).length;
      r.delta = (r.self !== null && r.obs !== null) ? r3(r.self - r.obs) : null;
      r.blind = ge(r.delta, RULES.gap);
      r.hidden = r.delta !== null && ge(-r.delta, RULES.gap);
      r.fail = le(r.self, RULES.failItem) || le(r.obs, RULES.failItem);
      r.strength = ge(keyVal(r, 'obs'), RULES.strength);
      r.level = level(to100(keyVal(r, 'obs')));
      return r;
    });
    var self = individual(model, selfAnswers, opts).domains;
    var groups = relationGroups(model, observers);
    var all = groups.filter(function (g) { return g.key === 'all'; })[0];
    var domains = model.domains.map(function (d, i) {
      var o = all.domains[i];
      return { no: d.no, floor: !!d.floor, self: self[i].self, obs: o.score, obsReason: o.reason,
               caution: lt(o.score, RULES.cautionDomain), selfCaution: self[i].caution, level: level(o.score) };
    });
    return {
      kind: '360', leads: opts.leads !== false, observerCount: total, private: hide,
      domains: domains, groups: groups,
      items: strip(rows, ['self', 'obs', 'obsN', 'delta', 'blind', 'hidden', 'fail', 'strength', 'level']),
      picks: domainPicks(model, rows, 'obs'),
      blindSpots: rows.filter(function (r) { return r.blind; }).sort(function (a, b) { return (b.delta - a.delta) || a.order - b.order; }).map(function (r) { return r.code; }),
      hiddenStrengths: rows.filter(function (r) { return r.hidden; }).sort(function (a, b) { return (a.delta - b.delta) || a.order - b.order; }).map(function (r) { return r.code; }),
      urgent: urgentTop(rows, 'obs'),
      strengths: strengthTop(rows, 'obs'),
      fails: rows.filter(function (r) { return r.fail; }).sort(ascBy('obs')).map(function (r) { return r.code; })
    };
  }

  /* ── 팀 ─────────────────────────────────────────────── */
  function teamStat(model, list, pick) {
    var v = list.map(pick);
    var n = vals(v).length;
    if (n < RULES.minGroup) return { n: n, private: true, avg: null, sd: null, dist: null, teamFail: false, split: false };
    var avg = mean(v), s = sd(v);
    var low = vals(v).filter(function (x) { return x <= RULES.teamFailLow; }).length;
    return { n: n, private: false, avg: r3(avg), sd: r3(s), dist: dist(v, model.scale),
             teamFail: le(avg, RULES.teamFailAvg) || low > n / 2,
             failBy: le(avg, RULES.teamFailAvg) ? 'avg' : (low > n / 2 ? 'majority' : null),
             split: ge(s, RULES.splitSD) };
  }
  function team(model, members, opts) {
    opts = opts || {};
    var n = members.length;
    if (n < RULES.minGroup) return { kind: 'team', private: true, memberCount: n };
    var aRows = itemRows(model).map(function (r) {
      var st = teamStat(model, members, function (m) { return m.A[r.code]; });
      Object.keys(st).forEach(function (k) { r[k] = st[k]; });
      r.part = 'A'; r.level = level(to100(r.avg));
      return r;
    });
    var domainsA = model.domains.map(function (d) {
      var its = aRows.filter(function (r) { return r.domainNo === d.no; });
      var s = to100(mean(its.map(function (r) { return r.avg; })));
      // 영역별 분포 — 팀원 한 사람의 영역 평균을 1~5점 칸에 넣어 '몇 명'을 센다
      var persons = members.map(function (m) {
        var pm = mean(d.items.map(function (it) { return m.A[it.code]; }));
        return pm === null ? null : Math.round(pm);
      });
      return { no: d.no, floor: !!d.floor, score: r3(s), caution: lt(s, RULES.cautionDomain),
               level: level(s), dist: dist(persons, model.scale) };
    });
    var bRows = (model.teamB ? model.teamB.items : []).map(function (b, i) {
      var r = { code: b.code, link: b.link, domainNo: b.domainNo, floor: b.domainNo === (floorDomain(model) || {}).no,
                order: domainOrder(model, b.domainNo) * 1000 + 500 + i, part: 'B' };
      var st = teamStat(model, members, function (m) { return m.B ? m.B[b.code] : null; });
      Object.keys(st).forEach(function (k) { r[k] = st[k]; });
      return r;
    });
    var domainsB = model.domains.map(function (d) {
      var its = bRows.filter(function (r) { return r.domainNo === d.no; });
      var s = its.length ? to100(mean(its.map(function (r) { return r.avg; }))) : null;
      return { no: d.no, floor: !!d.floor, score: r3(s), caution: lt(s, RULES.cautionDomain), items: its.length };
    });
    var both = aRows.concat(bRows).filter(function (r) { return !r.private; });
    var failRows = both.filter(function (r) { return r.teamFail; }).sort(ascBy('avg'));
    var splitRows = both.filter(function (r) { return r.split; }).sort(descBy('sd'));
    // 팀 코칭 회기 제안 — 팀 과락이 몰린 영역 1~2개 (공통 역량은 모든 회기의 바닥이라 제외)
    var counts = axisDomains(model).map(function (d) {
      return { no: d.no, count: failRows.filter(function (r) { return r.domainNo === d.no; }).length, order: domainOrder(model, d.no) };
    }).filter(function (c) { return c.count > 0; }).sort(function (a, b) { return (b.count - a.count) || a.order - b.order; });
    var sessions = counts.slice(0, 2).filter(function (c, i) { return i === 0 || c.count >= 2; })
      .map(function (c) {
        return { no: c.no, count: c.count,
                 codes: failRows.filter(function (r) { return r.domainNo === c.no; }).map(function (r) { return r.code; }) };
      });
    return {
      kind: 'team', private: false, memberCount: n,
      domainsA: domainsA, domainsB: domainsB,
      itemsA: strip(aRows, ['avg', 'sd', 'n', 'dist', 'teamFail', 'failBy', 'split', 'private', 'level']),
      picks: domainPicks(model, aRows, 'avg', { failKey: 'teamFail' }),
      itemsB: strip(bRows, ['link', 'avg', 'sd', 'n', 'dist', 'teamFail', 'failBy', 'split', 'private']),
      teamFails: failRows.slice(0, RULES.listN).map(ref), teamFailCount: failRows.length,
      splits: splitRows.slice(0, RULES.listN).map(ref), splitCount: splitRows.length,
      sessions: sessions
    };
  }
  function ref(r) { return { code: r.code, part: r.part }; }

  /* ── 과정 (기업 강의용) ─────────────────────────────────
     수강생이 각자 A 70문항만 답한다. 집계는 팀의 A파트와 같은 규칙을 쓴다.
     결과 이름을 팀과 같게 두어 리포트가 같은 표·같은 함수를 쓴다(설계 4장). */
  function cohort(model, members, opts) {
    opts = opts || {};
    var n = members.length;
    if (n < RULES.minGroup) return { kind: 'cohort', private: true, memberCount: n };
    var aRows = itemRows(model).map(function (r) {
      var st = teamStat(model, members, function (m) { return m.A[r.code]; });
      Object.keys(st).forEach(function (k) { r[k] = st[k]; });
      r.part = 'A'; r.level = level(to100(r.avg));
      return r;
    });
    var domainsA = model.domains.map(function (d) {
      var its = aRows.filter(function (r) { return r.domainNo === d.no; });
      var s = to100(mean(its.map(function (r) { return r.avg; })));
      /* 영역별 분포 — 수강생 한 사람의 영역 평균을 1~5점 칸에 넣어 '몇 명'을 센다 */
      var persons = members.map(function (m) {
        var pm = mean(d.items.map(function (it) { return m.A[it.code]; }));
        return pm === null ? null : Math.round(pm);
      });
      return { no: d.no, floor: !!d.floor, score: r3(s), caution: lt(s, RULES.cautionDomain),
               level: level(s), dist: dist(persons, model.scale) };
    });
    var live = aRows.filter(function (r) { return !r.private; });
    var failRows = live.filter(function (r) { return r.teamFail; }).sort(ascBy('avg'));
    var splitRows = live.filter(function (r) { return r.split; }).sort(descBy('sd'));
    /* 강의 설계 제안 — 보완이 몰린 영역 1~2개 (공통 역량은 모든 칸의 기반이라 축에서 제외) */
    var counts = axisDomains(model).map(function (d) {
      return { no: d.no, count: failRows.filter(function (r) { return r.domainNo === d.no; }).length,
               order: domainOrder(model, d.no) };
    }).filter(function (c) { return c.count > 0; }).sort(function (a, b) { return (b.count - a.count) || a.order - b.order; });
    var sessions = counts.slice(0, 2).filter(function (c, i) { return i === 0 || c.count >= 2; })
      .map(function (c) {
        return { no: c.no, count: c.count,
                 codes: failRows.filter(function (r) { return r.domainNo === c.no; }).map(function (r) { return r.code; }) };
      });
    return {
      kind: 'cohort', private: false, memberCount: n,
      domainsA: domainsA,
      itemsA: strip(aRows, ['avg', 'sd', 'n', 'dist', 'teamFail', 'failBy', 'split', 'private', 'level']),
      itemsB: {},
      picks: domainPicks(model, aRows, 'avg', { failKey: 'teamFail' }),
      teamFails: failRows.slice(0, RULES.listN).map(ref), teamFailCount: failRows.length,
      splits: splitRows.slice(0, RULES.listN).map(ref), splitCount: splitRows.length,
      sessions: sessions
    };
  }

  /* ── 리더 대시보드 ─────────────────────────────────────── */
  function dashboard(model, leader, members, opts) {
    opts = opts || {};
    var t = team(model, members);
    if (t.private) return { kind: 'dashboard', private: true, memberCount: members.length };
    var c = (model.teamC ? model.teamC.items : []).map(function (ci) {
      var st = teamStat(model, members, function (m) { return m.C ? m.C[ci.code] : null; });
      var lv = num(leader.A[ci.leaderFrom || ci.link]);
      var diff = (st.avg === null || lv === null) ? null : r3(lv - st.avg);
      return { code: ci.code, link: ci.link, leader: lv, avg: st.avg, n: st.n, private: st.private,
               dist: st.dist, diff: diff, gap: ge(diff, RULES.leaderGap) };
    });
    var d = (model.teamD ? model.teamD.items : []).map(function (di) {
      var actual = null;
      t.domainsB.forEach(function (x) { if (x.no === di.domainNo) actual = x.score; });
      var pred = num(leader.D ? leader.D[di.code] : null);
      var diff = (pred === null || actual === null) ? null : r3(pred - actual);
      return { code: di.code, domainNo: di.domainNo, predicted: pred, actual: actual, diff: diff,
               gap: ge(diff, RULES.predictGap) };
    });
    var b = (model.teamB ? model.teamB.items : []).map(function (bi) {
      var x = t.itemsB[bi.code];
      return { code: x.code, domainNo: x.domainNo, leader: num(leader.B ? leader.B[x.code] : null),
               avg: x.avg, sd: x.sd, dist: x.dist, n: x.n, private: x.private, teamFail: x.teamFail, split: x.split,
               diff: (x.avg === null || !leader.B) ? null : r3(num(leader.B[x.code]) - x.avg) };
    });
    var out = {
      kind: 'dashboard', private: false, memberCount: members.length,
      selfVsTeam: c, predicted: d, sameQuestion: b,
      teamFails: t.teamFails, splits: t.splits, teamFailCount: t.teamFailCount, splitCount: t.splitCount,
      itemsA: (function () {
        var o = {};
        Object.keys(t.itemsA).forEach(function (k) { if (t.itemsA[k].teamFail || t.itemsA[k].split) o[k] = t.itemsA[k]; });
        return o;
      }()),
      retest: null
    };
    if (opts.retestMembers && opts.retestMembers.length) {
      var t2 = team(model, opts.retestMembers);
      if (!t2.private) {
        out.retest = { memberCount: opts.retestMembers.length,
          domains: t.domainsA.map(function (x, i) {
            return { no: x.no, floor: x.floor, before: x.score, after: t2.domainsA[i].score,
                     diff: r3(t2.domainsA[i].score - x.score) };
          }) };
      }
    }
    return out;
  }

  /* ── 익명 점검 — 리더·담당자 화면 데이터에 개인 행이 있으면 멈춘다 (PRD 1.3 · 2.2 · 6.3) ── */
  var RAW_KEYS = ['answers', 'members', 'observers', 'retestMembers', 'responses'];
  function assertAggregateOnly(obj, path) {
    path = path || '$';
    if (Array.isArray(obj)) { obj.forEach(function (x, i) { assertAggregateOnly(x, path + '[' + i + ']'); }); return true; }
    if (obj && typeof obj === 'object') {
      Object.keys(obj).forEach(function (k) {
        if (RAW_KEYS.indexOf(k) >= 0) throw new Error('개인 응답 행이 섞였습니다: ' + path + '.' + k);
        assertAggregateOnly(obj[k], path + '.' + k);
      });
    }
    return true;
  }

  function strip(rows, keys) {
    var out = {};
    rows.forEach(function (r) {
      var o = { code: r.code, domainNo: r.domainNo, floor: r.floor };
      keys.forEach(function (k) { if (r[k] !== undefined) o[k] = r[k]; });
      out[r.code] = o;
    });
    return out;
  }

  return {
    RULES: RULES, num: num, mean: mean, sd: sd, to100: to100, level: level, display100: display100,
    dist: dist, minObsFor: minObsFor, axisDomains: axisDomains, floorDomain: floorDomain,
    itemByCode: itemByCode, textFor: textFor, urgentTop: urgentTop, strengthTop: strengthTop,
    domainPicks: domainPicks,
    individual: individual, threeSixty: threeSixty, relationGroups: relationGroups,
    team: team, cohort: cohort, dashboard: dashboard,
    peerLite: peerLite, peerTeam: peerTeam, assertAggregateOnly: assertAggregateOnly
  };
}));
</script>
<script>/* 1+6 커뮤니케이션 진단 — 리포트 렌더 모듈

   payload = { kind: 'individual'|'360'|'team'|'dashboard', model, result, meta, summaries, logo }
   영역 수·문항 수는 model에서 읽는다. 문장은 원고(model)에서 가져오고, 아래 UI 는 화면 틀 문구만 둔다. */

    kakao: '카카오톡 채널로 문의하기',
    /* 과정 리포트 (설계 4장) */
    cohort: '과정 리포트', cohortN: '명의 응답', cohortAvg: '수강생 응답의 평균입니다',
    cohortLead: '수강생이 각자 답한 70문항을 모은 값입니다. 한 사람의 응답은 보이지 않고, 평균과 몇 명이 몇 점을 줬는지만 보입니다.',

    cohortDot: '점 = 그 점수를 준 수강생 수',
    cohortFailDesc: '과정 보완은 평균 2.5 이하이거나 수강생 과반이 2점 이하인 문항, 의견이 갈린 문항은 표준편차 1.2 이상인 문항입니다.',
    cohortPlan: '강의 설계 제안', cohortPlanDesc: '보완이 몰린 영역을 강의의 중심으로 둡니다. 그 영역의 보완 문항과 연결 덱을 함께 적었습니다.',
    cohortPlanNone: '보완 기준에 걸린 문항이 없습니다. 영역별 분포를 보고 강의의 무게를 정하십시오.',
    /* 팀 360 라이트 (설계 5장) */
    peerSec: '기반 역량 — 나와 동료가 본 것',
    peerDesc: '같은 팀 사람들이 공통 역량 열 가지를 보고 답한 값입니다. 누가 어떻게 답했는지는 나오지 않고, 모인 평균만 보입니다.',
    peerMine: '본인', peerPeers: '동료 평균', peerLeader: '리더', peerReports: '팀원 평균',
    peerAll: '평가자 전체 평균', peerOne: '1인 응답', peerN: '명',
    peerMerged: '동료가 세 명이 되지 않아 리더를 포함한 평가자 전체 평균 한 줄로 보여 드립니다.',
    peerFew: '서로 본 값은 평가자가 3명 이상 모이면 열립니다.',
    peerScale: '숫자는 본인 점수와 같은 0~100 환산값입니다. 칸에 마우스를 올리면 1~5 평균이 보입니다.',
    peerPanel: '기반 역량 — 팀원이 서로를 본 평균',
    peerPanelDesc: '팀원들이 서로의 공통 역량을 보고 답한 값을 문항마다 모았습니다. 누가 누구를 봤는지는 남지 않습니다.'
  };
  function applyUI(model) {
    var src = (model && model.ui) || {};
    Object.keys(src).forEach(function (k) { if (typeof UI[k] === 'string') UI[k] = src[k]; });
  }
  var CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
  var KAKAO = 'http://pf.kakao.com/_wftPX';

  /* ── 기본 ─────────────────────────────────────────── */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function d100(s) {   // 기준선 아래 값이 반올림으로 기준선에 붙지 않게 (logic.display100 과 같은 규칙)
    if (s === null || s === undefined) return null;
    var v = Math.round(s);
    if (s < 50 - 1e-9 && v >= 50) v = 49;
    return v;
  }
  function f1(v) { return v === null || v === undefined ? '—' : (Math.round(v * 10) / 10).toFixed(1); }
  function sign1(v) { if (v === null || v === undefined) return '—'; var r = Math.round(v * 10) / 10; return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1); }
  function sign0(v) { if (v === null || v === undefined) return '—'; var r = Math.round(v); return r === 0 ? '±0' : (r > 0 ? '+' : '−') + Math.abs(r); }
  function pct(s) { return Math.max(0, Math.min(100, s || 0)); }
  function p5(v) { return v === null || v === undefined ? 0 : (v - 1) / 4 * 100; }
  /* 1~5 평균을 본인 점수와 같은 축(0~100)으로 옮긴다. 기반 판의 값은 모두 이 규칙을 쓴다. */
  function d5(v) { return v === null || v === undefined ? null : d100(p5(v)); }
  function lvOf(s) { if (s === null || s === undefined) return 0; if (s <= 25 + 1e-9) return 1; if (s < 50 - 1e-9) return 2; if (s < 75 - 1e-9) return 3; return 4; }

  function axes(model) { return model.domains.filter(function (d) { return !d.floor; }); }
  function floorDom(model) { return model.domains.filter(function (d) { return d.floor; })[0]; }
  function dom(model, no) { return model.domains.filter(function (d) { return d.no === no; })[0]; }
  function item(model, code) {
    for (var i = 0; i < model.domains.length; i++) {
      var its = model.domains[i].items;
      for (var j = 0; j < its.length; j++) if (its[j].code === code) return { item: its[j], domain: model.domains[i] };
    }
    return null;
  }
  function dname(d) { return (d.floor ? '' : (d.mark || CIRC[d.no - 1] || d.no) + ' ') + d.name; }
  function textFor(it, leads) {
    var alt = (!leads && it.alt) ? it.alt : {};
    return { self: alt.self || it.self, obs: alt.obs || it.obs, low: alt.low || it.low, practice: alt.practice || it.practice };
  }
  function firstSentence(s) { var m = String(s).match(/^.*?[.?!](\s|$)/); return m ? m[0].trim() : s; }
  function scaleLabel(model, v) {
    var r = Math.round(v); var s = model.scale.filter(function (x) { return x.v === r; })[0];
    return s ? s.label : '';
  }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }
  function rank(n) { return '<span class="rank" aria-label="시급 ' + n + '위">' + n + '</span>'; }
  function bar(score, cls) { return '<div class="bar ' + (cls || '') + '"><i style="width:' + pct(score).toFixed(1) + '%"></i></div>'; }
  function secHead(no, title, desc) {
    return '<div class="sec-head"><span class="eyebrow">' + esc(no) + '</span><h2>' + esc(title) + '</h2>' +
      (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div>';
  }

  /* ── 육각형 (축 개수는 모델에서) ─────────────────────────
     series: [{ kind:'area'|'line', color, values:{domainNo:score|null}, label }]
     labels: { domainNo: { score:'60', sub:'본인 60', caution:bool } } */
  function hexagon(model, series, labels, geo) {
    var ax = axes(model), n = ax.length;
    var W = geo.w, H = geo.h, cx = geo.cx, cy = geo.cy, R = geo.r;
    function pt(i, s) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n, rr = R * pct(s) / 100;
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    }
    function poly(s) {
      var p = []; for (var i = 0; i < n; i++) p.push(pt(i, s).map(function (x) { return x.toFixed(1); }).join(','));
      return p.join(' ');
    }
    var o = ['<svg class="hex ' + geo.cls + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      esc(ax.map(function (d) { var l = labels[d.no] || {}; return dname(d) + ' ' + (l.aria || l.score || ''); }).join(', ')) + '">'];
    if (geo.shadow) o.push('<ellipse class="hx-shadow" cx="' + cx + '" cy="' + (H - 5) + '" rx="' + (R * 0.72) + '" ry="7"/>');
    [25, 50, 75, 100].forEach(function (s) { o.push('<polygon class="hx-ring' + (s === 50 ? ' mid' : '') + '" points="' + poly(s) + '"/>'); });
    for (var i = 0; i < n; i++) { var e = pt(i, 100); o.push('<line class="hx-spoke" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>'); }
    [25, 50, 75, 100].forEach(function (s) {
      var p = pt(0, s); o.push('<text class="hx-tick" x="' + (p[0] + 5) + '" y="' + (p[1] + 11) + '">' + s + '</text>');
    });
    series.forEach(function (se) {
      var pts = [];
      ax.forEach(function (d, i) { var v = se.values[d.no]; pts.push(pt(i, v === null || v === undefined ? 0 : v)); });
      var ps = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      if (se.kind === 'area') {
        o.push('<polygon points="' + ps + '" fill="' + se.color + '" fill-opacity="' + (se.fillOpacity || 0.16) + '" stroke="' + se.color + '" stroke-width="' + (se.stroke || 1.5) + '" stroke-linejoin="round"/>');
      } else {
        o.push('<polygon points="' + ps + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round"/>');
      }
      if (se.dots !== false) {
        ax.forEach(function (d, i) {
          var v = se.values[d.no]; if (v === null || v === undefined) return;
          o.push('<circle cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="' + (geo.dot || 4.5) + '" fill="' + se.color + '" stroke="#fff" stroke-width="2"><title>' +
            esc(dname(d) + ' · ' + se.label + ' ' + d100(v)) + '</title></circle>');
        });
      }
    });
    ax.forEach(function (d, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;

      var c = Math.cos(a), s = Math.sin(a);
      var anchor = Math.abs(c) < 0.2 ? 'middle' : (c > 0 ? 'start' : 'end');
      var lab = labels[d.no] || {};
      var name = (d.mark || CIRC[d.no - 1]) + ' ' + d.name;
      var lines = [name];
      if (geo.split && anchor !== 'middle' && d.name.indexOf(' ') > 0) {
        var sp = d.name.indexOf(' ');
        lines = [(d.mark || CIRC[d.no - 1]) + ' ' + d.name.slice(0, sp), d.name.slice(sp + 1)];
      }
      var fsN = geo.fName, fsS = geo.fScore, lh = fsN * 1.25;
      var blockH = lines.length * lh + fsS * 1.15 + (lab.sub ? geo.fSub * 1.3 : 0);
      var top;
      if (anchor === 'middle') top = s < 0 ? ly - blockH : ly + 4;
      else top = ly - blockH / 2 + (s > 0.2 ? 8 : s < -0.2 ? -8 : 0);
      var y = top + fsN;

        o.push('<text class="hx-name" x="' + lx.toFixed(1) + '" y="' + (y + k * lh).toFixed(1) + '" text-anchor="' + anchor + '" font-size="' + fsN + '">' + esc(ln) + '</text>');

        o.push('<text class="hx-score" x="' + startX.toFixed(1) + '" y="' + yS.toFixed(1) + '" text-anchor="start" font-size="' + fsS + '">' + esc(lab.score) + '</text>');

          '<text x="' + (chx + chipW / 2).toFixed(1) + '" y="' + (chy + chipH / 2 + geo.fChip * 0.36).toFixed(1) + '" text-anchor="middle" font-size="' + geo.fChip + '">' + UI.caution + '</text></g>');
      } else {
        o.push('<text class="hx-score" x="' + sx.toFixed(1) + '" y="' + yS.toFixed(1) + '" text-anchor="' + anchor + '" font-size="' + fsS + '">' + esc(lab.score === null || lab.score === undefined ? '—' : lab.score) + '</text>');
      }
      if (lab.sub) o.push('<text class="hx-sub" x="' + lx.toFixed(1) + '" y="' + (yS + geo.fSub * 1.35).toFixed(1) + '" text-anchor="' + anchor + '" font-size="' + geo.fSub + '">' + esc(lab.sub) + '</text>');

  var GEO_DESK = { cls: 'hex-desk', w: 640, h: 540, cx: 320, cy: 262, r: 158, gap: 20, fName: 16, fScore: 24, fSub: 13, fChip: 12, dot: 4.5, split: true, shadow: true };
  var GEO_MOB = { cls: 'hex-mob', w: 360, h: 392, cx: 180, cy: 190, r: 84, gap: 12, fName: 13.5, fScore: 19, fSub: 11.5, fChip: 11, dot: 4, split: true, shadow: true };
  function hexBoth(model, series, labels, opt) {

    return hexagon(model, series, labels, gd) + hexagon(model, series, labels, gm);

  /* ── 1 · 공통 역량 기반 판 ─────────────────────────────
     mode: 'single' | 'pair' | 'team'
     cells: { code: { score(0~100), fail, rank, self, obs(0~100), avg(1~5), dist } } */
  function dotsSvg(model, dist) {
    var sc = model.scale, W = 100, H = 42, colW = W / sc.length, r = 2.6, step = 6.2;
    var o = ['<svg class="dots" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'];
    o.push('<line x1="0" y1="' + (H - 7.5) + '" x2="' + W + '" y2="' + (H - 7.5) + '" stroke="rgba(18,36,32,.18)" stroke-width=".8"/>');
    sc.forEach(function (s, i) {
      var x = colW * i + colW / 2, c = dist ? dist[s.v] || 0 : 0;
      for (var k = 0; k < c; k++) o.push('<circle cx="' + x.toFixed(1) + '" cy="' + (H - 11 - k * step).toFixed(1) + '" r="' + r + '" fill="#157A34"/>');
      o.push('<text x="' + x.toFixed(1) + '" y="' + (H - 0.5) + '" text-anchor="middle" font-size="6.5" font-weight="600" fill="#5E6A64">' + s.v + '</text>');
    });
    o.push('</svg>');
    return o.join('');
  }
  /* 개인 리포트의 기반 타일에 붙일 동료 값 — 첫 줄(동료 평균 또는 전체 평균) 하나만 */
  function peerCell(pl, code) {
    var p = pl.peer;
    if (!p || p.private || !p.lines.length) return null;
    var g = p.lines[0];

    if (v === null || v === undefined) return null;

  }
  function floorPlate(model, mode, cells, head) {
    var fd = floorDom(model), ph = model.phrases || {};
    var o = ['<div class="floor' + (head.bare ? ' floor-bare' : '') + '">'];
    /* 핵심 요약 카드 안에 들어갈 때(bare)는 카드 머리가 이미 이름·점수를 보이므로 판 머리를 뺀다 */
    if (!head.bare) o.push('<div class="floor-head"><div><div class="part-label"><b>1</b>' + esc(fd.name) + '</div>' +

    } else if (mode === 'pair') {

        '<div><span class="v">' + (head.obs === null ? '—' : d100(head.obs)) + '</span><span class="who"><span class="key-area"></span>' + UI.obs + '</span></div>' +
        '</div><span class="u">' + UI.floorAvg + ' ' + UI.of100 + '</span></div>');

    }

      o.push('<div class="tile lv' + lv + (c.fail ? ' fail' : '') + '" title="' + esc(it.def) + '" aria-label="' + esc(aria) + '">');

      o.push('<div class="t-top"><span class="code">' + esc(it.code) + '</span>' + (c.rank ? rank(c.rank) : '') + '</div>');
      o.push('<div class="name">' + esc(it.name) + '</div>');
      if (mode === 'pair') {
        o.push('<div class="pairvals"><span class="pv" title="' + UI.self + '"><i class="mk-self"></i>' + d100(c.self) + '</span>' +
          '<span class="pv" title="' + UI.obs + '"><i class="mk-obs"></i>' + (c.obs === null ? '—' : d100(c.obs)) + '</span>' + failTag + '</div>');
        o.push(bar(c.self, 'self thin') + bar(c.obs, 'thin'));
      } else if (mode === 'team') {
        o.push('<div class="score-row"><span class="score">' + f1(c.avg) + '<small>평균</small></span>' + failTag + '</div>');

      } else {
        o.push('<div class="score-row"><span class="score">' + d100(c.score) + '</span>' + failTag + '</div>');
        o.push(bar(c.score));
        /* 팀 360 라이트 — 동료가 본 값을 본인과 같은 축(0~100)으로 바로 아래 덧붙인다 */
        if (c.peer) {
          o.push('<div class="peer-mini" title="' + esc(c.peer.label + ' ' + f1(c.peer.value) + ' / 5') + '">' +
            '<span class="pm-k">' + esc(c.peer.label) + '</span><span class="pm-v">' + d5(c.peer.value) + '</span></div>');

      }
      o.push('</div>');
    });
    o.push('</div>');
    var lvLeg = UI.lv.map(function (t, i) { return '<span><span class="sw" style="background:var(--lv' + (i + 1) + ')"></span>' + t + '</span>'; }).join('');
    o.push('<div class="floor-legend">' + lvLeg + '<span><span class="fl"></span>' + (head.failKey || UI.failKey) + '</span>' +
      (head.noRank ? '' : '<span style="display:inline-flex;align-items:center;gap:5px"><span class="rank" style="width:16px;height:16px;font-size:10px">1</span>' + UI.rankKey + '</span>') +
      (mode === 'team' ? '<span>' + (head.dotKey || '점 = 그 점수를 준 팀원 수') + '</span>' : '') + '</div>');

  }

  /* ── 공용 블록 ─────────────────────────────────────── */
  function header(pl, kindLabel, title, lead, chips) {
    return '<header class="topbar"><img class="logo" src="' + pl.logo + '" alt="피터의 커뮤니케이션">' +
      (pl.meta && pl.meta.sample ? '<span class="sample-tag">' + esc(UI.sample) + '</span>' : '') + '</header>' +

      '</section>';

  function footer(pl, no, ctaKey) {

  /* ── 핵심 요약 카드 ─────────────────────────────────────

  function summaryCards(pl, picks, domains, cfg) {
    var m = pl.model;
    function line(cls, label, codes, mark) {
      if (!codes || !codes.length) return '';

  /* ── 개인 리포트 (PRD 5.1 · 2026-09-16 구조 개편) ─────────── */
  function renderIndividual(pl) {
    var m = pl.model, r = pl.result, leads = r.leads, fd = floorDom(m);
    var ranks = rankMap(r.urgent);
    var dScore = {}; r.domains.forEach(function (d) { dScore[d.no] = d; });
    var o = [];
    o.push(header(pl, '개인 리포트', (pl.meta.name ? pl.meta.name + ' 님의' : '나의') + ' 커뮤니케이션 주소',
      esc('여섯 영역을 육각형으로 먼저 보고, 바로 아래 핵심 요약에서 영역마다 강점과 보완을 봅니다.'),
      [pl.meta.position, '이끄는 자리: ' + (leads ? '예' : '아니요'), '응답 ' + Object.keys(r.items).length + '문항', '점수 0~100 · 50 = ' + scaleLabel(m, 3)]));

    // 1 육각형 — 여섯 영역
    var labels = {};
    axes(m).forEach(function (d) { var x = dScore[d.no]; labels[d.no] = { score: d100(x.self), caution: x.caution }; });
    o.push('<section class="summary"><div class="card onesix"><div class="onesix-top"><div class="label-row"><span class="part-label"><b>6</b>' + UI.six + '</span></div>' +
      hexBoth(m, [{ kind: 'area', color: '#1F9E43', label: UI.self, values: vals(r.domains, 'self'), fillOpacity: 0.16, stroke: 2 }], labels) + '</div></div>');
    o.push('<aside class="card side"><h3>한 줄 해석</h3><p class="interp">' + interp(pl, r.domains, 'self') + '</p><hr>' +
      '<h3>여섯 영역</h3>' + domainList(pl, r.domains, ['self']) + '</aside></section>');

    // 2 핵심 요약 — 영역마다 강점 먼저, 보완 다음 (공통 역량 카드 안에 기반 판)
    var cells = {};
    fd.items.forEach(function (it) {
      var x = r.items[it.code];
      cells[it.code] = { score: p5(x.self), raw: x.self, fail: x.fail, rank: ranks[it.code],
                         peer: peerCell(pl, it.code) };
    });
    /* 절 번호는 세어서 붙인다 — 팀 360 라이트에서 절이 하나 늘기 때문이다 */

    o.push(summarySection(pl, nx(), r.picks, r.domains, {
      score: function (dd) { return dd.self; },

    }, '영역마다 지금 잘 하고 있는 행동을 먼저, 손이 덜 간 행동을 다음에 적었습니다. 숫자는 문항 응답(1~5)이고, 오른쪽 큰 숫자가 영역 점수(0~100)입니다.'));

    // 3 기반 역량 — 나와 동료가 본 것 (명단으로 받은 팀 건에서만)
    if (pl.peer) o.push(peerSection(pl, nx(), pl.peer, cells));

    // 4 시급 TOP 3
    o.push('<section class="sec">' + secHead(nx(), '시급 TOP 3', '보완 문항 가운데 공통 역량을 먼저, 그다음 점수가 낮은 순으로 골랐습니다. 점수가 같으면 왼쪽 영역을 먼저 둡니다.') +
      rxCards(pl, r.urgent, function (code) {
        var x = r.items[code];
        return '<b>' + x.self + '</b> ' + esc(scaleLabel(m, x.self)) + (x.fail ? ' ' + tag('tag-fail', UI.fail) : '');
      }) + '</section>');

    // 4 강점 TOP 3

  function vals(domains, key) { var o = {}; domains.forEach(function (d) { o[d.no] = d[key]; }); return o; }

  /* ── 360 비교 (PRD 5.2) ────────────────────────────── */
  var ROLE = { leader: '상사', peer: '동료', report: '부하 직원', 'peer+report': '동료·부하 직원', all: '관찰자 전체' };
  /* '상사 1인의 응답입니다.' 를 관계 이름만 바꿔 다시 쓴다. 원고 문구는 건드리지 않는다. */
  function singleNote(ph, key) {
    var base = String(ph['상사표기'] || '');
    var name = ROLE[key] || '';
    if (base && base.indexOf('상사') === 0) return name + base.slice('상사'.length);
    return name + ' 1인의 응답입니다.';
  }
  function render360(pl) {
    var m = pl.model, r = pl.result, fd = floorDom(m), ph = m.phrases, roles = pl.meta.observerRoles || {};
    var ranks = rankMap(r.urgent);

      esc('같은 문항을 본인과 주변 사람이 답했습니다. 선은 본인, 면은 관찰자 평균이고, 핵심 요약은 관찰자 기준입니다.'),
      [pl.meta.position, '상사 ' + (roles.leader || 0) + ' · 동료 ' + (roles.peer || 0) + ' · 부하 직원 ' + (roles.report || 0), '이끄는 자리: ' + (r.leads ? '예' : '아니요'), '코치 해석 회기에서 함께 엽니다']));

    var labels = {};

    });

    o.push('<aside class="card side"><h3>한 줄 해석</h3><p class="interp">' + interp(pl, r.domains, 'obs') + '</p><hr>' +

      r.urgent.map(function (u) { var x = r.items[u.code]; return '<li>' + rank(u.rank) + esc(item(m, u.code).item.name) + '<span class="sc">' + f1(x.obs) + '</span></li>'; }).join('') +

    // 맹점 · 숨은 강점
    function gapRows(list, label) {

        }).join('') + '</tr>';

      notes.push('— 는 그 영역에서 답한 문항이 ' + 6 + '개 미만이라 점수를 표시하지 않은 칸입니다. (관찰할 기회가 없었다는 응답은 점수에서 뺍니다)');
    o.push('<section class="sec">' + secHead('04', '관계별 영역 점수', '관찰자를 관계별로 나눠 봅니다. 3명이 되지 않는 묶음은 합치거나 가립니다.') +

  /* ── 팀 공용 ──────────────────────────────────────── */

  /* ── 팀 리포트 (PRD 5.3) ───────────────────────────── */

      r.domainsA.map(function (d) {

  /* ── 리더 대시보드 (PRD 5.4) ───────────────────────── */
  function dumbbell(a, b, lo, hi, ticks, tip) {
    var W = 220, H = 26, pad = 8;
    function x(v) { return pad + (v - lo) / (hi - lo) * (W - pad * 2); }
    var o = ['<svg class="dumb" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(tip) + '"><title>' + esc(tip) + '</title>'];
    o.push('<line x1="' + pad + '" y1="13" x2="' + (W - pad) + '" y2="13" stroke="#E2EBE4" stroke-width="1"/>');
    ticks.forEach(function (t) { o.push('<line x1="' + x(t).toFixed(1) + '" y1="9" x2="' + x(t).toFixed(1) + '" y2="17" stroke="#D3DED6" stroke-width="1"/>'); });
    if (a !== null && b !== null) o.push('<line x1="' + x(a).toFixed(1) + '" y1="13" x2="' + x(b).toFixed(1) + '" y2="13" stroke="#5E6A64" stroke-width="2"/>');
    if (b !== null) o.push('<circle cx="' + x(b).toFixed(1) + '" cy="13" r="5.5" fill="#1F9E43" stroke="#fff" stroke-width="2"/>');
    if (a !== null) o.push('<circle cx="' + x(a).toFixed(1) + '" cy="13" r="5.5" fill="#2E6E9E" stroke="#fff" stroke-width="2"/>');
    o.push('</svg>');
    return o.join('');
  }
  /* 팀 360 라이트 — 본인 · 동료 평균 · 리더 세 줄 비교 (설계 5장) */

         : key === 'report' ? UI.peerReports : UI.peerAll;

      return o.join('');

        '<span class="v">' + d100(h.score) + '</span>' + bar(h.score, h.self ? 'self thin' : 'thin') + '</div>';
    }).join('') + '</div>');
    if (peer.merged) o.push('<p class="panel-d">' + esc(UI.peerMerged) + '</p>');

    o.push('<p class="panel-d">' + esc(UI.peerScale) + '</p>');

    o.push('<div class="tbl-wrap"><table class="t"><thead><tr><th>문항</th><th class="n">' + UI.peerMine + '</th>' +
      cols.map(function (g) { return '<th class="n">' + esc(peerLabel(g.key)) + '</th>'; }).join('') +

      r.predicted.map(function (d) {

          '<td class="n">' + d.predicted + '</td><td class="n">' + (d.actual === null ? '—' : d100(d.actual)) + '</td><td class="n">' + (d.gap ? '<b>' + sign0(d.diff) + '</b>' : sign0(d.diff)) + '</td></tr>';
      }).join('') + '</tbody></table><p class="note">' + esc(firstSentence(m.teamD.guide)) + ' 예측이 실제보다 15점 이상 높으면 예측 차이입니다.</p>' + (function () {
