      return '<div class="legend" style="margin-top:14px"><span class="k"><span class="key-line"></span>리더 예측</span><span class="k"><span class="key-area"></span>팀원 실제</span><span class="k muted">큰 숫자 = 실제</span></div>' +
        hexBoth(m, [{ kind: 'area', color: '#1F9E43', label: '실제', values: av, dots: false }, { kind: 'line', color: '#2E6E9E', label: '예측', values: pv }], lb,
          { desk: { w: 600, h: 510, cx: 300, cy: 250, r: 140, fName: 15, fScore: 22, shadow: false }, mob: { shadow: false } });
    }());

    // ③ 같은 질문, 다른 답
    var p3 = legendLT + '<div class="tbl-wrap"><table class="t"><thead><tr><th>우리 팀은 ~한다</th><th style="width:22%">1 ─ 5</th><th class="n">리더</th><th class="n">팀원</th><th>분포</th></tr></thead><tbody>' +
      r.sameQuestion.map(function (b) {
        var bi = m.teamB.items.filter(function (x) { return x.code === b.code; })[0], dd = dom(m, b.domainNo);
        return '<tr><td><b>' + esc(bi.text.replace(/^우리 팀은 /, '')) + '</b>' + (b.teamFail ? ' ' + tag('tag-fail', '팀 ' + UI.fail) : '') + (b.split ? ' ' + tag('tag-caution', '갈림') : '') +
          '<span class="sub">' + esc((dd.floor ? '1 · ' + dd.name : dname(dd)) + ' · ' + b.code) + '</span></td>' +
          '<td>' + (b.private ? '' : dumbbell(b.leader, b.avg, 1, 5, t15, bi.name + ' 리더 ' + b.leader + ' · 팀원 ' + f1(b.avg))) + '</td>' +
          '<td class="n">' + b.leader + '</td><td class="n"><b>' + (b.private ? '—' : f1(b.avg)) + '</b></td><td>' + (b.private ? '' : miniDots(m, b.dist, 104)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    // ④ 팀 보완 · 갈린 문항
    var p4 = '<div class="grid2"><div class="tbl-wrap"><h4 style="font-size:14px;margin-bottom:4px">팀 보완 TOP ' + r.teamFails.length + ' <span class="muted small">전체 ' + r.teamFailCount + '개</span></h4>' + refTable(pl, r.teamFails, t, 'fail') + '</div>' +
      '<div class="tbl-wrap"><h4 style="font-size:14px;margin-bottom:4px">의견이 갈린 문항 TOP ' + r.splits.length + ' <span class="muted small">전체 ' + r.splitCount + '개</span></h4>' + refTable(pl, r.splits, t, 'split') + '</div></div>';

    // ⑤ 팀원의 목소리
    var sm = pl.summaries || {};
    var p5b = ['팀2', '팀3'].map(function (k) {
      return '<p class="voice-q"' + (k === '팀3' ? ' style="margin-top:14px"' : '') + '>' + esc(m.open[k]) + '</p><ul class="voice">' + (sm[k] || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
    }).join('');

    // ⑥ 전후 비교
    var p6;
    if (r.retest) {
      var before = {}, after = {}, labels = {};
      r.retest.domains.forEach(function (d) { before[d.no] = d.before; after[d.no] = d.after; if (!d.floor) labels[d.no] = { score: d100(d.after), sub: '1차 ' + d100(d.before), caution: d.after < 50 }; });
      var fl = r.retest.domains.filter(function (d) { return d.floor; })[0];
      p6 = '<div class="legend"><span class="k"><span class="key-line gray"></span>1차</span><span class="k"><span class="key-area"></span>재진단</span><span class="k muted">큰 숫자 = 재진단</span></div>' +
        hexBoth(m, [{ kind: 'area', color: '#1F9E43', label: '재진단', values: after, dots: false }, { kind: 'line', color: '#5E6A64', label: '1차', values: before }], labels,
          { desk: { w: 600, h: 440, cx: 300, cy: 218, r: 118, fName: 14, fScore: 20, fSub: 12, shadow: false }, mob: { shadow: false } }) +
        '<div class="chg">' + r.retest.domains.map(function (d) { var dd = dom(m, d.no); return '<span>' + esc(d.floor ? '1 공통' : dd.mark + ' ' + dd.name) + ' ' + d100(d.before) + ' → ' + d100(d.after) + '<b>' + sign0(d.diff) + '</b></span>'; }).join('') + '</div>' +
        '<p class="note">팀원 개인 역량 평균(A · 나)의 1차와 재진단입니다. 공통 평균 ' + d100(fl.before) + ' → ' + d100(fl.after) + '</p>';
    } else {
      p6 = '<p class="muted">재진단 뒤에 열립니다.</p>';
    }

    /* ⑦ 기반 역량 — 팀원이 서로를 본 평균 (명단으로 받은 건에서만) */
    var p7 = null;
    if (pl.peerTeam) {
      var pt = pl.peerTeam, fdD = floorDom(m);
      if (pt.private) {
        p7 = '<p class="muted">' + esc(UI.peerFew) + '</p>';
      } else {
        p7 = '<p class="note" style="margin-top:0">평가 ' + pt.n + '건 · 받은 사람 ' + pt.subjectCount + '명 · 기반 평균 <b>' + d100(pt.score) + '</b> ' + UI.of100 + '</p>' +
          '<div class="tbl-wrap"><table class="t"><thead><tr><th>문항</th><th class="n">평균 0~100</th><th class="n">2점 이하</th><th>분포 1~5</th></tr></thead><tbody>' +
          fdD.items.map(function (it) {
            var x = pt.items[it.code];
            var low = x.dist ? Object.keys(x.dist).filter(function (k) { return +k <= 2; }).reduce(function (a, k) { return a + x.dist[k]; }, 0) : 0;
            return '<tr><td><b>' + esc(it.name) + '</b>' + (x.teamFail ? ' ' + tag('tag-fail', '팀 ' + UI.fail) : '') + (x.split ? ' ' + tag('tag-caution', '갈림') : '') +
              '<span class="sub">' + esc(it.code + ' · ' + firstSentence(it.def)) + '</span></td>' +
              '<td class="n" title="' + f1(x.avg) + ' / 5"><b>' + d5(x.avg) + '</b></td><td class="n">' + low + '건</td>' +
              '<td>' + miniDots(m, x.dist, 104) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
    }
    o.push('<section class="dash">' +
      panel('1', '나 vs 팀원', '우리 리더 ' + r.selfVsTeam.length + '문항 — 리더의 자기 평가와 팀원이 본 리더', p1) +
      panel('2', '예측 vs 실제', '리더가 예측한 우리 팀 점수와 팀원이 실제로 준 점수', p2) +
      panel('3', '같은 질문, 다른 답', '우리 팀 ' + r.sameQuestion.length + '문항 — 리더의 답 · 팀원 평균 · 몇 명이 몇 점', p3, 'wide') +
      panel('4', '팀 보완 · 의견이 갈린 문항', '팀원 개인 역량(나)과 우리 팀 문항을 함께 봅니다.', p4, 'wide') +
      panel('5', '팀원의 목소리 — 코치 요약', '원문은 코치만 읽습니다. 주제별로 묶은 요약입니다.', p5b) +
      panel('6', '전후 비교', '1회차와 재진단의 육각형을 겹쳐 봅니다.', p6) +
      (p7 ? panel('7', UI.peerPanel, UI.peerPanelDesc, p7, 'wide') : '') +
      '</section>');
    o.push(footer(pl, '07'));
    return o.join('');
  }

  function render(rootEl, pl) {
    var html;
    applyUI(pl.model);
    if (pl.kind === 'individual') html = renderIndividual(pl);
    else if (pl.kind === '360') html = render360(pl);
    else if (pl.kind === 'team') html = renderTeam(pl);
    else if (pl.kind === 'cohort') html = renderCohort(pl);
    else if (pl.kind === 'dashboard') html = renderDashboard(pl);
    else throw new Error('알 수 없는 리포트 종류: ' + pl.kind);
    rootEl.innerHTML = '<div class="wrap">' + html + '</div>';
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('beforeprint', function () {
        Array.prototype.forEach.call(rootEl.querySelectorAll('details'), function (d) { d.open = true; });
      });
    }
  }

  root.CoachReport = { render: render, hexagon: hexagon, hexBoth: hexBoth, floorPlate: floorPlate,
                       applyUI: applyUI, UI: UI };
}(typeof self !== 'undefined' ? self : this));
</script>
<script>
window.__MODEL__ = {"title":"1+6 커뮤니케이션 진단 — 원고 v1.2","scale":[{"v":1,"label":"거의 하지 않는다"},{"v":2,"label":"가끔 한다"},{"v":3,"label":"절반쯤 한다"},{"v":4,"label":"자주 한다"},{"v":5,"label":"거의 항상 한다"}],"na":"관찰할 기회가 없었다","start":{"이끄는 자리":"지금 팀이나 파트, 후배를 이끄는 자리에 있습니까? (예 / 아니요)","규칙":"'아니요'면 영역 6의 본인·관찰자 문항과 낮을 때·이번 주 연습을 `-실무` 필드로 바꿔 쓴다. 행동은 같고 대상만 '팀원'에서 '동료'로 바뀐다. '해당 없음'은 두지 않는다 — 육각형이 늘 온전하게 나와야 한다.","팀":"리더는 늘 '예'. 팀원은 시작 화면에서 직접 고른다."},"domains":[{"no":0,"name":"공통 역량","floor":true,"mark":"1","oneLine":"여섯 칸 모두의 기반","situation":null,"altGuide":null,"items":[{"code":"0-01","name":"경청","def":"상대의 말이 끝날 때까지 기다리고, 다 들은 뒤에 말한다.","self":"나는 상대의 말이 길어져도 끝날 때까지 기다렸다가 말한다","obs":"이분은 상대의 말이 길어져도 끝날 때까지 기다렸다가 말한다","low":"상대의 말이 끝나기 전에 답을 준비하거나 말을 이어받는 일이 잦을 수 있습니다. 받은 재료가 적으면 뒤에 나오는 말도 얇아질 수 있습니다.","practice":"이번 주 회의나 통화 한 번에서 노트에 선을 긋고, 상대가 쓴 표현을 왼쪽 칸에 그대로 받아 적어 보십시오. 내 말은 적기를 마친 뒤에 꺼냅니다.","coaching":"최근 대화 한 장면을 재연하며 끼어든 지점과 그때 머릿속에 있던 말을 함께 찾는다.","decks":[{"no":"26","title":"받은 만큼만 나옵니다","lv":"Lv3 2.7"}]},{"code":"0-02","name":"질문","def":"판단을 내리기 전에 상대의 사정과 근거를 먼저 묻는다.","self":"나는 동료의 실수를 들으면 판단하기 전에 사정부터 묻는다","obs":"이분은 동료의 실수를 들으면 판단하기 전에 사정부터 묻는다","low":"일이 틀어졌다는 말을 들으면 결론이 먼저 서는 경향이 있을 수 있습니다. 먼저 묻지 않은 만큼 나중에 다시 확인하고 바로잡는 일이 늘어날 수 있습니다.","practice":"이번 주에 누군가의 실수나 지연 소식을 들으면 첫마디를 \"어떤 사정이 있었어요?\"로 정해 두고 한 번 써 보십시오.","coaching":"판단이 먼저 나온 장면을 골라 그때 던질 수 있었던 첫 질문을 함께 만든다.","decks":[{"no":"30","title":"그 질문은 이미 정해져 있습니다","lv":"Lv3 2.3"},{"no":"22","title":"많이 묻지 마십시오","lv":"Lv3 6.3"}]},{"code":"0-03","name":"결론 먼저","def":"내가 먼저 꺼내는 보고와 설명에서 핵심을 첫 문장에 둔다.","self":"나는 보고나 설명을 시작할 때 첫 문장에 결론을 말한다","obs":"이분은 보고나 설명을 시작할 때 첫 문장에 결론을 말한다","low":"자료를 만든 순서대로 배경부터 설명하는 습관이 남아 있을 수 있습니다. 듣는 사람은 결론을 기다리는 동안 앞의 설명을 흘려들을 수 있습니다.","practice":"오늘 보고 하나를 앞두고 \"이래서 → 이렇게 됐고 → 그래서 이걸 하려고 합니다\" 세 마디를 적은 뒤, 마지막 마디를 첫 문장으로 옮겨 말해 보십시오.","coaching":"실제 보고 한 건의 첫 문장만 세 가지로 바꿔 말해 보고 듣는 쪽의 반응을 비교한다.","decks":[{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"},{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"}]},{"code":"0-04","name":"간결함","def":"요점을 말한 뒤에는 덧붙이는 말을 줄이고 말을 마친다.","self":"나는 요점을 말한 뒤에는 그 자리에서 말을 끝낸다","obs":"이분은 요점을 말한 뒤에는 그 자리에서 말을 끝낸다","low":"빠뜨릴까 걱정되어 설명을 한 겹 더 얹는 경향이 있을 수 있습니다. 덧붙인 말이 늘면 정작 남아야 할 요점이 묻힐 수 있습니다.","practice":"스톱워치를 켜고 화면을 엎어 둔 채 요즘 하는 일을 삼십 초로 말해 보십시오. 끝나면 시계를 보기 전에 몇 초였을지 먼저 예측하고 차이를 적습니다.","coaching":"말하는 영상을 함께 보며 요점 뒤에 붙은 문장을 세고, 뺄 문장의 기준을 정한다.","decks":[{"no":"06","title":"빼는 기술 다섯","lv":"Lv3 기본기QUICK5"},{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"}]},{"code":"0-05","name":"맥락 읽기","def":"이야기의 무게와 때에 맞춰 대면·전화·메신저 중 전할 길을 고른다.","self":"나는 민감한 이야기는 메신저보다 직접 만나거나 전화로 전한다","obs":"이분은 민감한 이야기는 메신저보다 직접 만나거나 전화로 전한다","low":"편한 채널 하나로 모든 이야기를 전하는 경향이 있을 수 있습니다. 같은 문장도 글로 받으면 더 차갑게 읽힐 수 있습니다.","practice":"이번 주에 보내려던 메시지 중 받는 사람이 서운할 수 있는 것 하나를 골라, 전화나 짧은 대면으로 바꿔 전해 보십시오.","coaching":"최근 어긋난 대화를 여섯 칸 지도에 놓고 채널과 시점이 원인이었는지 함께 가려 본다.","decks":[{"no":"01","title":"비즈니스 커뮤니케이션 지도","lv":"Lv1"},{"no":"21","title":"같은 말이 다르게 도착합니다","lv":"Lv3 2.1"}]},{"code":"0-06","name":"비언어 일치","def":"표정과 목소리를 말의 내용과 같은 방향으로 맞춘다.","self":"나는 진지한 이야기를 할 때는 표정과 목소리도 그에 맞춘다","obs":"이분은 진지한 이야기를 할 때는 표정과 목소리도 그에 맞춘다","low":"어색함을 풀려고 웃음이나 가벼운 말투가 먼저 나올 수 있습니다. 말과 표정이 엇갈리면 듣는 사람은 표정 쪽으로 받아들일 수 있습니다.","practice":"이번 주에 중요한 말을 할 자리가 생기면, 들어가기 전에 그 말의 첫 문장을 휴대폰 카메라 앞에서 한 번 소리 내어 해 보고 표정을 확인하십시오.","coaching":"촬영한 대화 장면을 소리 없이 먼저 보고, 표정만으로 읽히는 메시지를 함께 적는다.","decks":[{"no":"37","title":"같은 리듬에 들어갑니다","lv":"Lv3 2.4"}]},{"code":"0-07","name":"감정 조절","def":"기분이 상하거나 긴장된 순간에도 평소의 말투를 지킨다.","self":"나는 대화 중 기분이 상해도 일관성 있는 평소 말투로 말한다","obs":"이분은 대화 중 기분이 상해도 일관성 있는 평소 말투로 말한다","low":"중요하게 여기는 것이 건드려지는 순간 말투가 먼저 반응할 수 있습니다. 그 반응은 성격의 문제라기보다 무엇을 먼저 두는지 알려 주는 신호일 수 있습니다.","practice":"이번 주에 걸리는 자리가 생기면 말하기 전에 '내가 지키려던 것'과 '상대가 지키려던 것'을 한 단어씩 적어 보십시오.","coaching":"말투가 달라진 장면 두세 개를 모아 공통으로 건드려진 가치를 찾는다.","decks":[{"no":"36","title":"다르다고 틀린 것은 아닙니다","lv":"Lv3 6.7"},{"no":"44","title":"마음보다 몸이 빠릅니다","lv":"Lv3 1.7"}]},{"code":"0-08","name":"존중","def":"그 자리에 있든 없든 사람을 같은 말과 같은 태도로 대한다.","self":"나는 뒤에서 사람을 말할 때도 그 사람 앞에서와 같은 말로 한다","obs":"이분은 뒤에서 사람을 말할 때도 그 사람 앞에서와 같은 말로 한다","low":"답답함이 쌓이면 당사자가 없는 자리에서 평가의 말이 먼저 나올 수 있습니다. 그 말은 돌고 돌아 다음 대화의 신뢰를 먼저 깎을 수 있습니다.","practice":"이번 주에 누군가를 두고 한 말 하나를 떠올려, 그 사람이 옆에서 들었어도 같은 문장이었을지 확인해 보십시오. 다르면 앞에서 할 문장으로 고쳐 적습니다.","coaching":"불편한 상대 한 사람을 두고 평가의 말과 본 장면의 말을 나란히 적어 본다.","decks":[{"no":"29","title":"'항상'은 사실이 아닙니다","lv":"Lv3 5.7"}]},{"code":"0-09","name":"피드백 수용","def":"지적을 받으면 사정을 설명하기 전에 맞는 부분부터 받아들인다.","self":"나는 지적을 받으면 사정을 설명하기 전에 맞는 부분부터 인정한다","obs":"이분은 지적을 받으면 사정을 설명하기 전에 맞는 부분부터 인정한다","low":"지적을 받는 순간 사정부터 설명하게 되는 경향이 있을 수 있습니다. 설명이 먼저 나오면 상대가 다음 지적을 아끼게 될 수 있습니다.","practice":"이번 주에 지적이나 다른 의견을 들으면 첫마디를 \"그 부분은 맞습니다\"로 시작하고, 사정 설명은 그다음에 해 보십시오.","coaching":"받기 어려웠던 피드백 한 문장을 가져와 받는 자리에서 다시 읽고 첫 반응을 연습한다.","decks":[{"no":"15","title":"말해 주지 않으면 모릅니다","lv":"Lv3 6.4"},{"no":"35","title":"열심히 할수록 멀어질 때가 있습니다","lv":"Lv3 6.6"}]},{"code":"0-10","name":"신뢰","def":"아는 만큼만 말하고, 모르는 것은 모른다고 밝힌다.","self":"나는 모르는 것을 질문받으면 짐작 대신 모른다고 말한다","obs":"이분은 모르는 것을 질문받으면 짐작 대신 모른다고 말한다","low":"모른다고 하면 부족해 보일까 봐 짐작으로 답을 채울 수 있습니다. 짐작이 나중에 틀리면 맞았던 다른 말까지 함께 의심받을 수 있습니다.","practice":"이번 주에 확실하지 않은 질문을 받으면 \"확인해서 오늘 안에 알려 드리겠습니다\"로 답하고, 그날 실제로 알려 주십시오.","coaching":"짐작으로 답했던 장면을 떠올려 '아는 것 · 짐작 · 모르는 것'으로 나눠 다시 답해 본다.","decks":[{"no":"39","title":"조용한 팀이 좋은 팀은 아닙니다","lv":"Lv3 5.5"},{"no":"30","title":"그 질문은 이미 정해져 있습니다","lv":"Lv3 2.3"}]}]},{"no":1,"name":"위닝마인드셋","floor":false,"mark":"①","oneLine":"나와의 커뮤니케이션","situation":null,"altGuide":null,"items":[{"code":"1-01","name":"리프레이밍","def":"사실은 그대로 두고, 그 사실을 담는 말을 바꿔 다시 본다.","self":"나는 막힌 일을 '위기' 대신 '훈련' 같은 다른 말로 불러 본다","obs":"이분은 막힌 일을 '위기' 대신 '훈련' 같은 다른 말로 불러 본다","low":"처음 붙인 이름이 그 일을 대하는 태도까지 정하고 있을 수 있습니다. 이름이 그대로면 같은 일을 같은 방식으로만 대하게 될 수 있습니다.","practice":"지금 걸려 있는 일 하나를 \"이 일은 ○○ 같다\"로 적어 보십시오. 마음에 들지 않으면 사실은 두고 비유만 바꿔 다시 적은 뒤, 바꾼 문장에서 오늘 할 일 하나가 나오는지 확인합니다.","coaching":"요즘 일에 붙인 비유 세 개를 모아, 그 비유가 나에게 준 역할을 함께 읽는다.","decks":[{"no":"24","title":"사실은 그대로 둡니다","lv":"Lv3 1.1"}]},{"code":"1-02","name":"생각 되묻기","def":"사실처럼 느껴지는 생각을 한 번 멈추고 근거를 되묻는다.","self":"나는 '다들 그렇지'라는 생각이 들면 그 근거를 스스로 되묻는다","obs":"이분은 '다들 그렇지'라는 생각이 들면 그 근거를 스스로 되묻는다","low":"또렷하게 떠오른 생각을 그대로 사실로 받아들이는 경향이 있을 수 있습니다. 한 번 굳은 해석은 이후에 보이는 장면까지 그 방향으로 골라 보게 할 수 있습니다.","practice":"오늘 한 말 중 '항상', '절대', '다들'이 들어간 문장 하나를 꺼내 \"무엇을 보고 그렇게 생각했지?\"라고 한 번 되물어 보십시오. 답이 안 나와도 문장이 한 번 움직이면 충분합니다.","coaching":"반복해서 떠오르는 판단 문장 하나를 골라 넘겨짚기·골라보기 같은 말투 이름을 붙이고 되묻는다.","decks":[{"no":"42","title":"한 번 되물으면 됩니다","lv":"Lv3 1.2"}]},{"code":"1-03","name":"스스로에게 거는 말","def":"나에게 하는 다짐을 피하려는 것이 아니라 바라는 쪽의 말로 한다.","self":"나는 다짐할 때 '하지 말자'보다 '하자'는 말로 한다","obs":"이분은 다짐할 때 '하지 말자'보다 '하자'는 말로 한다","low":"\"실수하지 말자\"처럼 피하고 싶은 쪽의 말을 자주 쓰고 있을 수 있습니다. 그런 문장은 부정하려던 바로 그 낱말을 가장 크게 남길 수 있습니다.","practice":"요즘 자주 쓰는 부정 낱말 하나를 메모장에 적고, 정말 좋았던 장면에서 한 낱말을 뽑아 오늘 좋은 일이 생길 때 소리 내어 붙여 보십시오.","coaching":"중요한 자리 직전에 머릿속에서 도는 문장을 받아 적고, 바라는 쪽의 문장으로 함께 고친다.","decks":[{"no":"19","title":"그 말이 그 상태를 부릅니다","lv":"Lv3 1.3"}]},{"code":"1-04","name":"모델링","def":"잘하는 사람을 통째로 흉내 내지 않고 판단 하나를 빌려 온다.","self":"나는 잘하는 사람을 보면 그가 먼저 한 행동 하나를 따라 해 본다","obs":"이분은 잘하는 사람을 보면 그가 먼저 한 행동 하나를 따라 해 본다","low":"잘하는 사람을 보면 감탄이나 비교에서 멈추는 경향이 있을 수 있습니다. 통째로 따라 하려다 아무것도 남지 않은 경험이 있었을 수도 있습니다.","practice":"이번 주에 본 사람 한 명의 이름을 적고, 그 사람이 무엇을 보고 무엇을 먼저 했는지 한 줄로 적어 보십시오. 그중 한 가지를 다음에 같은 자리에서 한 번 해 봅니다.","coaching":"닮고 싶은 사람 한 명을 정해 그 사람의 시선·순서·기준 중 빌려 올 한 가지를 고른다.","decks":[{"no":"31","title":"한 가지만 빌립니다","lv":"Lv3 1.4"}]},{"code":"1-05","name":"우선순위와 실행 목표","def":"급한 일에 밀리는 중요한 일에 쓸 시간을 먼저 정해 둔다.","self":"나는 긴급하지는 않지만 중요한 일에 시간을 먼저 떼어 둔다","obs":"이분은 긴급하지는 않지만 중요한 일에 시간을 먼저 떼어 둔다","low":"찾아오는 급한 일에 하루가 먼저 채워지고 있을 수 있습니다. 급하지 않은 중요한 일은 그렇게 매주 다음 주로 넘어갈 수 있습니다.","practice":"일정표를 열고, 급하지 않은데 중요한 일 하나를 이번 주에 할 행동 한 문장으로 고쳐 요일과 시각을 정해 넣어 보십시오. 한 칸이면 됩니다.","coaching":"지난 2주 일정을 네 칸으로 나눠 보고, 비어 있는 칸에 들어갈 행동 하나를 정한다.","decks":[{"no":"27","title":"급한 일은 찾아옵니다","lv":"Lv3 1.5"}]},{"code":"1-06","name":"습관 설계","def":"결심에 기대지 않고 그 행동이 나오기 쉬운 환경을 먼저 만든다.","self":"나는 새로 만들려는 습관이 있으면 필요한 환경부터 만든다","obs":"이분은 새로 만들려는 습관이 있으면 필요한 환경부터 만든다","low":"새 습관을 결심과 기억력으로 붙이려는 경향이 있을 수 있습니다. 환경이 그대로면 결심은 매일 처음부터 다시 해야 할 수 있습니다.","practice":"이번 주에 들이려는 습관 하나를 정하고, 그것을 막는 것 하나를 치운 뒤 필요한 것 하나를 손 닿는 자리에 놓아 두십시오. 치운 것 하나, 놓은 것 하나입니다.","coaching":"붙이고 싶은 말하기 습관 하나를 정해 그 행동이 저절로 나오게 할 환경을 함께 설계한다.","decks":[{"no":"34","title":"기억하려 애쓰지 마십시오","lv":"Lv3 1.6"}]},{"code":"1-07","name":"몸 상태 알아채기","def":"긴장이 말로 새기 전에 몸의 신호를 먼저 알아채고 가라앉힌다.","self":"나는 긴장되는 자리 전에 어깨와 숨부터 가라앉힌다","obs":"이분은 긴장되는 자리 전에 어깨와 숨부터 가라앉힌다","low":"긴장을 마음으로만 다스리려는 경향이 있을 수 있습니다. 상태는 마음보다 어깨·숨·턱 같은 몸에서 먼저 흔들릴 수 있습니다.","practice":"이번 주 중요한 자리에 들어가기 전에 일 분 세트를 해 보십시오. 등을 세워 앉고, 길게 세 번 내쉬고, 어깨를 살짝 내립니다. 셋을 한 세트로 합니다.","coaching":"긴장되는 장면을 떠올리며 몸에서 먼저 달라지는 자리를 찾고 들어가기 전 루틴을 정한다.","decks":[{"no":"44","title":"마음보다 몸이 빠릅니다","lv":"Lv3 1.7"}]},{"code":"1-08","name":"할 수 있다는 근거 찾기","def":"낯선 일 앞에서 이미 해낸 경험을 근거로 꺼내 쓴다.","self":"나는 낯선 일을 앞두면 전에 해낸 비슷한 경험을 떠올려 본다","obs":"이분은 낯선 일을 앞두면 전에 해낸 비슷한 경험을 떠올려 본다","low":"새 일을 만나면 \"원래 이런 건 못 한다\"는 판단이 먼저 설 수 있습니다. 이미 가진 경험이 있어도 꺼내 세어 보지 않아 근거로 쓰이지 않을 수 있습니다.","practice":"메모장에 \"나는 아직 ○○을 안 배웠다\" 한 문장을 적어 보십시오. '말하기'처럼 크게 쓰지 말고 '핵심을 한 문장으로 줄이는 법'처럼 구체적으로 적습니다.","coaching":"지금 두려운 일과 닮은 과거의 성공 장면 세 개를 함께 찾아 공통 행동을 뽑는다.","decks":[{"no":"05","title":"배부터 세웁니다","lv":"Lv2.1"},{"no":"03","title":"내향형은 핸디캡이 아닙니다","lv":"Lv3 내향형"}]},{"code":"1-09","name":"실패 뒤 다시 하기","def":"결과가 나빴던 일을 접지 않고 방법 하나를 바꿔 다시 한다.","self":"나는 결과가 나빴던 일도 방법 하나를 바꿔 다시 해 본다","obs":"이분은 결과가 나빴던 일도 방법 하나를 바꿔 다시 해 본다","low":"한 번 결과가 나쁘면 그 일 자체를 피하게 되는 경향이 있을 수 있습니다. 바꿀 것이 방법이었는지 사람이었는지 가려 보지 못한 채 넘어갔을 수 있습니다.","practice":"최근 아쉬웠던 일 하나를 적고 그 옆에 \"다음에는 이것 하나만 바꾼다\"를 한 줄로 적어 보십시오. 이번 주 안에 같은 종류의 자리에서 그 한 가지를 해 봅니다.","coaching":"실패로 기억하는 장면을 과정 단위로 쪼개, 그대로 둘 것과 바꿀 것 하나를 가른다.","decks":[{"no":"05","title":"배부터 세웁니다","lv":"Lv2.1"}]},{"code":"1-10","name":"원하는 모습을 장면으로 그리기","def":"목표를 문장이 아니라 이미 이룬 날의 장면으로 구체화한다.","self":"나는 목표를 세울 때 이미 이룬 날의 장면을 구체적으로 그려 본다","obs":"이분은 목표를 세울 때 이미 이룬 날의 장면을 구체적으로 그려 본다","low":"목표가 \"더 잘하자\" 같은 방향 문장에 머물러 있을 수 있습니다. 장면이 없으면 무엇부터 해야 할지 첫 행동이 잘 떠오르지 않을 수 있습니다.","practice":"동료 한 사람과 이번 주 목표를 이미 이룬 것으로 두고 서로 \"어떻게 하신 거예요?\"라고 과거형으로 물어 보십시오. 대답에서 나온 첫 행동 하나를 적습니다.","coaching":"코칭이 끝난 뒤의 한 장면을 과거형 인터뷰로 그려 보고, 그 장면에서 거꾸로 첫 행동을 뽑는다.","decks":[{"no":"05","title":"배부터 세웁니다","lv":"Lv2.1"}]}]},{"no":2,"name":"비즈니스 커뮤니케이션","floor":false,"mark":"②","oneLine":"일의 말 — 키워드와 구조","situation":null,"altGuide":null,"items":[{"code":"2-01","name":"상황에 맞는 말의 꼴","def":"듣는 사람과 상황에 따라 결론의 자리와 말의 꼴을 고른다.","self":"나는 듣는 사람과 상황을 보고 결론을 앞에 둘지 뒤에 둘지 정한다","obs":"이분은 듣는 사람과 상황을 보고 결론을 앞에 둘지 뒤에 둘지 정한다","low":"어떤 자리에서든 익숙한 한 가지 꼴로 말하고 있을 수 있습니다. 결론이 앞에 와야 할 자리와 뒤에 와야 할 자리를 가르지 못하면 같은 내용도 다르게 도착할 수 있습니다.","practice":"이번 주 안건 하나를 두괄·미괄·추정·대안 네 꼴로 한 줄씩 적어 보고, 오늘 만날 상대에게 맞는 꼴 하나에 동그라미를 치십시오.","coaching":"최근 안 통했던 설명을 네 꼴로 다시 말해 보고, 막힌 것이 논리·감성·문화·이미지 중 어느 겹이었는지 가린다.","decks":[{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"},{"no":"21","title":"같은 말이 다르게 도착합니다","lv":"Lv3 2.1"}]},{"code":"2-02","name":"상대 스타일에 맞추기","def":"유형을 맞히기보다 그 사람이 먼저 묻는 것에 말의 첫머리를 맞춘다.","self":"나는 상대가 늘 먼저 묻는 것에 맞춰 설명의 첫머리를 정한다","obs":"이분은 상대가 늘 먼저 묻는 것에 맞춰 설명의 첫머리를 정한다","low":"누구에게나 내가 편한 순서로 설명을 시작하고 있을 수 있습니다. 상대가 기다리는 것이 뒤에 있으면 앞의 설명은 길게만 느껴질 수 있습니다.","practice":"지금 가장 어려운 상대 한 사람을 떠올려 세 줄을 적어 보십시오. 그 사람이 가장 먼저 묻는 말, 특히 힘들어하는 것, 다음 대화의 첫 문장입니다. 유형 이름은 적지 않습니다.","coaching":"자주 부딪히는 상대 두 사람의 첫 질문을 비교하고, DISC 협업 스타일 진단 결과가 있으면 함께 본다.","decks":[{"no":"16","title":"유형이 아니라 사람입니다","lv":"Lv3 2.2"}]},{"code":"2-03","name":"질문에 답부터","def":"받은 질문에는 배경 설명보다 묻는 말의 답을 먼저 준다.","self":"나는 질문을 받으면 배경보다 답을 첫마디로 한다","obs":"이분은 질문을 받으면 배경보다 답을 첫마디로 한다","low":"질문을 받으면 오해를 막으려고 경위부터 설명하는 경향이 있을 수 있습니다. 묻는 사람은 답이 나올 때까지 질문이 제대로 전해졌는지 불안해할 수 있습니다.","practice":"다음 보고를 앞두고 받을 만한 질문 열 개를 적은 뒤 답하기 싫은 세 개에 표시하십시오. 그 셋에 대해 첫마디로 할 답만 한 문장씩 써 둡니다.","coaching":"예상 질문 세 개로 짧은 Q&A 롤플레이를 하고, 첫마디가 답이었는지 영상으로 확인한다.","decks":[{"no":"30","title":"그 질문은 이미 정해져 있습니다","lv":"Lv3 2.3"}]},{"code":"2-04","name":"목소리와 미러링","def":"대화 초반에는 상대의 속도와 크기에 맞추고, 남길 대목만 다르게 한다.","self":"나는 대화를 시작하면 한동안 상대의 말 속도에 맞춰 말한다","obs":"이분은 대화를 시작하면 한동안 상대의 말 속도에 맞춰 말한다","low":"상대와 상관없이 내 평소 속도와 크기로 말하고 있을 수 있습니다. 리듬이 어긋나면 내용이 맞아도 말이 상대 안으로 잘 들어가지 않을 수 있습니다.","practice":"오늘 남은 대화 하나에서 처음 한동안은 상대의 속도에 맞추고, 꼭 남기고 싶은 문장 하나만 평소보다 느리고 낮게 말해 보십시오.","coaching":"녹음한 대화를 들으며 상대와 속도·크기가 어긋난 구간과 강조가 사라진 구간을 찾는다.","decks":[{"no":"37","title":"같은 리듬에 들어갑니다","lv":"Lv3 2.4"}]},{"code":"2-05","name":"다음 행동으로 끝내기","def":"제안과 메일의 마지막 문장을 다음 행동과 시점으로 닫는다.","self":"나는 제안이나 메일의 마지막 문장에 다음 행동과 시점을 넣는다","obs":"이분은 제안이나 메일의 마지막 문장에 다음 행동과 시점을 넣는다","low":"\"검토 부탁드립니다\"처럼 열어 둔 채 끝내는 경향이 있을 수 있습니다. 좋게 끝난 자리도 다음 행동이 없으면 같은 안건이 다시 올라올 수 있습니다.","practice":"오늘 보낼 메일 하나의 마지막 문장만 보십시오. 누구에게와 언제까지가 없으면 그 한 줄만 고쳐 씁니다. 앞은 그대로 둡니다.","coaching":"최근 제안 세 건의 마지막 문장을 모아 내 몫·시점·다음 자리가 들어갔는지 점검한다.","decks":[{"no":"45","title":"마지막 한 줄이 남습니다","lv":"Lv3 2.5"}]},{"code":"2-06","name":"곤란한 말 피하지 않기","def":"거절과 나쁜 소식처럼 꺼내기 어려운 말을 미루지 않고 먼저 꺼낸다.","self":"나는 거절이나 나쁜 소식을 전할 일이 생기면 그날 먼저 꺼낸다","obs":"이분은 거절이나 나쁜 소식을 전할 일이 생기면 그날 먼저 꺼낸다","low":"곤란한 말은 좋은 때를 기다리며 며칠씩 미뤄지고 있을 수 있습니다. 미룬 만큼 같은 소식도 더 크게 도착할 수 있습니다.","practice":"이번 주에 미루고 있는 말 하나를 골라 첫 문장만 써 보십시오. 사정이 아니라 결론을 쓰고, 뒤에 \"대신 이건 됩니다\" 한 줄을 붙여 소리 내어 읽습니다.","coaching":"거절·나쁜 소식·내 실수 중 가장 어려운 장면 하나를 골라 첫 문장을 미리 쓰고 롤플레이한다.","decks":[{"no":"38","title":"먼저 꺼내면 작아집니다","lv":"Lv3 2.6"}]},{"code":"2-07","name":"일을 받을 때 목적·기한·기준 확인","def":"요청을 받는 순간 목적·기한·완성 기준 중 빈 것을 확인한다.","self":"나는 일을 받으면 목적·기한·기준 중 빈 칸을 그 자리에서 묻는다","obs":"이분은 일을 받으면 목적·기한·기준 중 빈 칸을 그 자리에서 묻는다","low":"일을 받을 때 되묻는 것이 부담스러워 짐작으로 채우고 시작할 수 있습니다. 받는 순간 빈 칸이 절반을 정하기 때문에 나중에 다시 하는 일이 생길 수 있습니다.","practice":"이번 주에 일을 받을 때 노트에 목적·기한·기준 세 칸을 그어 두고, 끝나기 전에 비어 있는 칸 하나만 물어보십시오.","coaching":"최근 다시 하게 된 일 하나를 되짚어 받는 순간 빠졌던 칸을 찾고 확인 문장을 만든다.","decks":[{"no":"26","title":"받은 만큼만 나옵니다","lv":"Lv3 2.7"}]},{"code":"2-08","name":"사실·판단·요청을 나눠 보고","def":"보고에서 확인된 사실과 나의 판단, 상대에게 바라는 것을 나눠 말한다.","self":"나는 보고할 때 확인된 사실과 개인 의견을 구분해 말한다","obs":"이분은 보고할 때 확인된 사실과 개인 의견을 구분해 말한다","low":"사실과 해석이 한 문장 안에 섞여 전달되고 있을 수 있습니다. 듣는 사람은 어디까지가 확인된 것인지 몰라 판단을 미룰 수 있습니다.","practice":"이번 주 보고 하나를 '사실 / 제 판단 / 요청' 세 줄로 나눠 적은 뒤 그 순서대로 말해 보십시오.","coaching":"실제 보고서 한 장에서 사실·판단·요청 문장에 색을 나눠 표시하고 섞인 문장을 고친다.","decks":[{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"}]},{"code":"2-09","name":"다시 묻지 않게 쓰는 메일·메신저","def":"받는 사람이 되묻지 않아도 되도록 제목과 첫 줄에 용건을 담는다.","self":"나는 메일 제목만 보고도 무슨 일인지 알 수 있게 쓴다","obs":"이분은 메일 제목만 보고도 무슨 일인지 알 수 있게 쓴다","low":"제목이 \"문의드립니다\", \"자료 공유\"처럼 이름표로만 붙어 있을 수 있습니다. 받는 사람이 열어 봐야 용건을 알면 답이 늦어지거나 되묻는 메시지가 오갈 수 있습니다.","practice":"이번 주에 보내는 메일 세 통의 제목을 [요청]·[공유]·[결정 필요] 같은 말머리와 용건 한 줄로 바꿔 보십시오.","coaching":"최근 보낸 메일 다섯 통을 받는 사람 입장에서 제목만 읽고 무엇이 필요한지 맞혀 본다.","decks":[{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"}]},{"code":"2-10","name":"핵심 키워드 먼저 뽑기","def":"말하기 전에 전할 핵심을 명사형 키워드로 먼저 뽑아 둔다.","self":"나는 말할 때 핵심을 명사 키워드로 미리 정리하거나 적는다","obs":"이분은 말할 때 핵심을 명사 키워드로 미리 정리하거나 적는다","low":"떠오르는 문장부터 이어 붙이며 말하고 있을 수 있습니다. 키워드가 서술형이면 순서를 잘 짜도 듣는 사람에게 남는 것이 적을 수 있습니다.","practice":"준비 중인 안건 하나에 명사형 키워드 세 개를 적고, 겹치거나 빠진 것이 없는지 한 번 점검한 뒤 \"세 가지로 말씀드리면\"으로 시작해 삼십 초 안에 말해 보십시오.","coaching":"같은 안건을 키워드 셋으로 네 번 돌려 말해 보며 가장 오래 남는 조합을 고른다.","decks":[{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"}]}]},{"no":3,"name":"프레젠테이션","floor":false,"mark":"③","oneLine":"무대와 자료 — 청중 앞에서 전하는 힘","situation":"영어 발표 → 08 · 적정영어, Make myself understood (Lv3 영어) / 투자·평가 발표 → 09 · 평가자 앞에서 (Lv3 IR)","altGuide":null,"items":[{"code":"3-01","name":"청중 분석","def":"자료를 만들기 전에 청중이 누구이고 무엇을 먼저 궁금해할지 정한다.","self":"나는 발표를 준비할 때 청중이 누구이고 무엇이 궁금한지부터 적는다","obs":"이분은 발표를 준비할 때 청중이 누구이고 무엇이 궁금한지부터 적는다","low":"발표 준비가 슬라이드 만들기부터 시작되고 있을 수 있습니다. 청중을 정하지 않은 채 시간을 쓰면 연습을 많이 해도 결과가 잘 달라지지 않을 수 있습니다.","practice":"다음 발표 한 건을 한 줄로 적고, 그 옆에 \"이 자리에서 가장 결정권이 큰 사람은 무엇을 책임지는가\"를 한 줄로 적어 보십시오. 첫 장은 그 사람의 첫 질문에서 시작합니다.","coaching":"실제 발표 한 건의 청중을 두세 부류로 나누고 부류마다 첫 질문을 예측해 자료의 입구를 정한다.","decks":[{"no":"02","title":"발표의 지도","lv":"Lv2.3"},{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"}]},{"code":"3-02","name":"청중이 얻는 것 말하기","def":"이 발표를 들으면 청중에게 무엇이 남는지를 짧게 밝힌다.","self":"나는 청중이 발표를 들으면 얻게 될 유익을 간결하게 말한다","obs":"이분은 청중이 발표를 들으면 얻게 될 유익을 간결하게 말한다","low":"발표가 내가 준비한 내용을 전하는 쪽으로만 짜여 있을 수 있습니다. 듣는 사람은 이 시간이 자기에게 무엇을 남기는지 모른 채 앉아 있을 수 있습니다.","practice":"준비 중인 발표 하나를 두고 \"이 이야기를 들으시면 ○○ 하실 수 있습니다\" 한 줄을 적어 첫머리에 넣어 보십시오. 한 줄이면 됩니다.","coaching":"발표 한 건의 첫머리를 청중이 얻는 것으로 바꿔 말해 보고, 자료의 각 장이 그 문장을 받치는지 점검한다.","decks":[{"no":"02","title":"발표의 지도","lv":"Lv2.3"},{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"}]},{"code":"3-03","name":"목소리의 높낮이와 완급","def":"같은 내용도 높낮이·강약·속도를 바꿔 가며 말한다.","self":"나는 고저·강약·완급을 활용한 다양한 표현 방식을 쓴다","obs":"이분은 고저·강약·완급을 활용한 다양한 표현 방식을 쓴다","low":"발표가 처음부터 끝까지 같은 높이와 같은 속도로 흐르고 있을 수 있습니다. 소리가 평평하면 가장 중요한 대목도 다른 문장과 같은 무게로 들릴 수 있습니다.","practice":"다음 발표에서 가장 남기고 싶은 문장 하나를 골라, 그 앞에서 한 박자 쉬고 평소보다 느리고 낮게 말해 보십시오. 한 문장이면 됩니다.","coaching":"발표 녹음을 들으며 높낮이와 속도가 평평해지는 구간을 찾고, 힘을 실을 자리를 다시 정한다.","decks":[{"no":"37","title":"같은 리듬에 들어갑니다","lv":"Lv3 2.4"},{"no":"02","title":"발표의 지도","lv":"Lv2.3"}]},{"code":"3-04","name":"핵심만 뽑아 말하기","def":"화면에 여럿이 올라와 있어도 말로는 핵심 하나만 짚는다.","self":"나는 슬라이드가 복잡해도 핵심 포인트만을 뽑아서 말한다","obs":"이분은 슬라이드가 복잡해도 핵심 포인트만을 뽑아서 말한다","low":"화면에 있는 것을 빠뜨리지 않고 차례로 읽어 가는 흐름일 수 있습니다. 청중은 말을 듣기 전에 화면을 먼저 읽기 때문에 전부 설명하면 남는 것이 적을 수 있습니다.","practice":"준비 중인 자료에서 가장 복잡한 장 하나를 골라, 그 장에서 말할 한 가지에만 표시하고 나머지는 말하지 않기로 정해 보십시오.","coaching":"실제 자료의 복잡한 장 몇 개를 놓고 장마다 말할 한 가지만 골라 다시 말해 본다.","decks":[{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"},{"no":"06","title":"빼는 기술 다섯","lv":"Lv3 기본기QUICK5"}]},{"code":"3-05","name":"넘기기 전의 한마디","def":"다음 장으로 넘어가기 전에 잇는 한마디로 궁금증을 만든다.","self":"나는 슬라이드 넘김 전에 연결어를 말하며 호기심을 이끈다","obs":"이분은 슬라이드 넘김 전에 연결어를 말하며 호기심을 이끈다","low":"한 장의 설명이 끝나면 곧바로 다음 장으로 넘어가고 있을 수 있습니다. 장과 장이 끊기면 청중은 넘어갈 때마다 새로 따라붙어야 할 수 있습니다.","practice":"다음 발표에서 넘기는 자리 두 곳을 골라 \"그러면 이건 어떻게 하느냐\" 같은 한마디를 적어 두고, 말한 뒤에 넘겨 보십시오.","coaching":"발표 영상에서 장이 바뀌는 지점을 표시하고, 빠진 연결어를 채워 다시 말해 본다.","decks":[{"no":"02","title":"발표의 지도","lv":"Lv2.3"},{"no":"07","title":"지어내지 마십시오","lv":"Lv3 스토리텔링"}]},{"code":"3-06","name":"전문 내용을 청중 수준으로","def":"전문 용어와 방법론을 청중이 이미 아는 말로 옮겨 설명한다.","self":"나는 전문 용어가 나오면 청중이 아는 말로 바꿔 설명한다","obs":"이분은 전문 용어가 나오면 청중이 아는 말로 바꿔 설명한다","low":"정확하게 말하려는 마음이 커서 늘 쓰는 용어가 그대로 나오고 있을 수 있습니다. 정확성과 전달력이 부딪히는 자리에서는 청중이 중간에 따라오기를 멈출 수 있습니다.","practice":"다음 발표 자료에서 청중이 모를 수 있는 용어 세 개에 표시하고, 각각 옆에 일상어 한 줄 풀이를 적어 보십시오.","coaching":"비전문가 역할의 코치 앞에서 3분 설명을 하고, 멈칫한 지점의 용어를 함께 바꾼다.","decks":[{"no":"04","title":"아는 만큼 짧아집니다","lv":"Lv3 전문가"}]},{"code":"3-07","name":"주어진 시간에 맞춰 줄이고 늘리기","def":"발표 시간이 바뀌어도 그 자리에서 말할 분량을 조절한다.","self":"나는 발표 시간이 줄어도 유연하게 말하는 분량을 조절한다","obs":"이분은 발표 시간이 줄어도 유연하게 말하는 분량을 조절한다","low":"발표가 한 가지 길이로만 외워져 있을 수 있습니다. 시간이 갑자기 줄면 말이 빨라지거나 결론 앞에서 끊길 수 있습니다.","practice":"준비 중인 발표에서 먼저 버릴 것 넷(곁가지 사례·배경 설명·방법론 과정·둘째 근거)과 끝까지 남길 것 넷(예고·결론과 숫자·리캡·상대가 할 일)을 적어 두십시오.","coaching":"같은 발표를 30초·5분·20분 세 벌로 말해 보고 시간 감각의 오차를 기록한다.","decks":[{"no":"06","title":"빼는 기술 다섯","lv":"Lv3 기본기QUICK5"}]},{"code":"3-08","name":"청중을 고루 보는 시선","def":"발표하는 동안 시선을 화면이 아니라 청중에게 고루 둔다.","self":"나는 발표를 하며 슬라이드보다는 청중을 골고루 본다","obs":"이분은 발표를 하며 슬라이드보다는 청중을 골고루 본다","low":"시선이 화면이나 원고 쪽에 오래 머물고 있을 수 있습니다. 화면을 보고 말하면 같은 내용도 청중에게 건네지지 않은 것처럼 들릴 수 있습니다.","practice":"다음 발표에서 화면을 보는 것은 넘길 때 한 번으로 정하고, 말하는 동안에는 왼쪽·가운데·오른쪽을 차례로 보십시오. 막히면 시선을 살짝 아래로 내립니다.","coaching":"발표 영상을 보며 화면을 본 시간과 청중을 본 시간을 나눠 세고, 고르게 볼 자리를 정한다.","decks":[{"no":"37","title":"같은 리듬에 들어갑니다","lv":"Lv3 2.4"},{"no":"02","title":"발표의 지도","lv":"Lv2.3"}]},{"code":"3-09","name":"군더더기 대신 침묵","def":"말 사이를 '어, 음'으로 채우지 않고 잠깐의 침묵으로 둔다.","self":"나는 불필요한 말(어, 음)을 빼고 침묵을 써 가며 말한다","obs":"이분은 불필요한 말(어, 음)을 빼고 침묵을 써 가며 말한다","low":"말이 잠깐 끊기는 순간을 소리로 채우고 있을 수 있습니다. 군더더기 소리가 잦으면 내용이 좋아도 준비가 덜 된 것처럼 들릴 수 있습니다.","practice":"다음 발표나 회의 발언의 첫 1분을 녹음해 '어, 음'이 몇 번 나오는지 세어 보십시오. 그 자리를 한 박자 쉬는 것으로 바꿔 한 번 더 말해 봅니다.","coaching":"발표 녹음에서 군더더기 소리가 나오는 자리를 세고, 그 자리를 침묵으로 바꿔 다시 말해 본다.","decks":[{"no":"06","title":"빼는 기술 다섯","lv":"Lv3 기본기QUICK5"},{"no":"02","title":"발표의 지도","lv":"Lv2.3"}]},{"code":"3-10","name":"자세와 제스처","def":"발표할 때 몸을 세우고 손짓으로 말을 받친다.","self":"나는 자신감 있는 자세와 효과적인 제스처를 활용한다","obs":"이분은 자신감 있는 자세와 효과적인 제스처를 활용한다","low":"긴장하면 몸이 작아지고 손 둘 자리를 찾지 못할 수 있습니다. 자세와 손이 흔들리면 같은 내용도 확신이 덜한 말로 들릴 수 있습니다.","practice":"다음 발표 전에 서서 첫 1분을 녹화해 보십시오. 발은 어깨너비로 두고 손은 배꼽 위에서 시작합니다. 영상에서 고칠 것 하나만 고릅니다.","coaching":"촬영한 발표에서 자세가 무너지는 지점과 손이 멈추는 지점을 찾아 먼저 바꿀 하나를 정한다.","decks":[{"no":"03","title":"내향형은 핸디캡이 아닙니다","lv":"Lv3 내향형"},{"no":"37","title":"같은 리듬에 들어갑니다","lv":"Lv3 2.4"}]}]},{"no":4,"name":"설득","floor":false,"mark":"④","oneLine":"반대하는 사람을 움직이는 일","situation":null,"altGuide":null,"items":[{"code":"4-01","name":"반대의 이유 먼저 듣기","def":"반대에 부딪히면 근거를 더하기 전에 상대가 걸린 지점을 먼저 듣는다.","self":"나는 반대 의견이 나오면 반박하기 전에 어디가 걸리는지 묻는다","obs":"이분은 반대 의견이 나오면 반박하기 전에 어디가 걸리는지 묻는다","low":"반대를 만나면 자료와 근거를 더 얹는 쪽으로 먼저 움직일 수 있습니다. 상대가 막힌 곳이 내용이 아니라 받아들이는 상태라면 근거를 더할수록 방어가 단단해질 수 있습니다.","practice":"최근 통과하지 못한 보고 하나를 떠올려 상대가 실제로 쓴 표현을 말투까지 그대로 적어 보십시오. 그리고 상대의 표정이 바뀐 시점에 표시합니다.","coaching":"반려된 제안 한 건을 재연하며 상대가 닫힌 관문을 찾고 다음 보고의 첫 문장을 바꾼다.","decks":[{"no":"18","title":"옳은 말이 튕겨 나옵니다","lv":"Lv3 4.1"}]},{"code":"4-02","name":"논의의 틀 먼저 정하기","def":"의견이 갈릴 자리에서 무엇을 어디까지 다룰지 먼저 정하고 시작한다.","self":"나는 의견이 갈릴 안건은 논의할 범위부터 정하고 시작한다","obs":"이분은 의견이 갈릴 안건은 논의할 범위부터 정하고 시작한다","low":"논의가 시작된 뒤에야 서로 다른 전제로 말하고 있었음을 알게 될 수 있습니다. 틀이 늦게 정해질수록 그 틀을 바꾸는 데 더 많은 시간이 들 수 있습니다.","practice":"다음 주 회의 하나를 두고 세 문장을 적어 보십시오. 오늘 다룰 것과 다루지 않을 것(규정), \"이렇게 진행해도 될까요\"(동의), 첫 항목 안내(진행)입니다.","coaching":"자주 공전하는 회의 하나를 골라 첫 세 문장을 설계하고 반대가 예상되는 참석자 역할로 연습한다.","decks":[{"no":"25","title":"자리를 먼저 정합니다","lv":"Lv3 4.2"}]},{"code":"4-03","name":"허락을 구하는 문장","def":"설득이 필요한 말 앞에 상대의 허락을 구하는 반 문장을 붙인다.","self":"나는 설득이 필요한 말은 '말씀드려도 될까요'로 먼저 연다","obs":"이분은 설득이 필요한 말은 '말씀드려도 될까요'로 먼저 연다","low":"옳다고 생각하는 말일수록 곧바로 밀어붙이는 문장으로 나올 수 있습니다. 그러면 상대는 내용을 검토하기 전에 태도부터 처리하게 될 수 있습니다.","practice":"오늘 삼킨 말 하나를 그대로 적고 그 앞에 \"○○ 관련해서 한 가지 말씀드려도 될까요\" 반 칸을 붙여 보십시오. 소리 내어 읽어 3초 안에 끝나는지 봅니다.","coaching":"윗사람에게 꺼내기 어려운 제안 하나를 사실·해석·결론으로 나누고 반 칸이 붙을 자리를 정한다.","decks":[{"no":"40","title":"말씀드려도 될까요","lv":"Lv3 4.3"}]},{"code":"4-04","name":"쟁점 나누기","def":"통째로 맞서지 않고 안건을 쟁점으로 나눈 뒤 갈리는 한 곳에서 논의한다.","self":"나는 의견이 부딪히면 어느 부분에서 갈리는지 먼저 나눠 짚는다","obs":"이분은 의견이 부딪히면 어느 부분에서 갈리는지 먼저 나눠 짚는다","low":"반대 의견을 안건 전체에 대한 반대로 받아들이는 경향이 있을 수 있습니다. 덩어리째 맞서면 한 시간 뒤에도 처음 자리로 돌아올 수 있습니다.","practice":"이번 주 회의 안건 하나를 한 줄로 적고 중요한가·계속될 문제인가·실행할 수 있는가·관련 있는가·이익이 큰가 다섯 물음을 던져, 생각이 다른 곳 하나만 남겨 보십시오.","coaching":"실제로 부딪히는 안건 하나를 다섯 물음으로 나눠 같은 곳·갈리는 곳·엇갈린 곳을 표시한다.","decks":[{"no":"46","title":"대개 하나만 다릅니다","lv":"Lv3 4.4"}]},{"code":"4-05","name":"협상 전 원하는 것·물러설 선·대안 적기","def":"협상 테이블에 앉기 전에 목표·한계선·결렬 시 대안을 적어 둔다.","self":"나는 협의 전에 원하는 것·물러설 선·대안을 적어 둔다","obs":"이분은 협의 전에 원하는 것·물러설 선·대안을 적어 둔다","low":"협의를 현장의 대응력으로 풀려는 경향이 있을 수 있습니다. 준비가 비어 있으면 상대의 속도에 끌려가 물러설 선을 그 자리에서 정하게 될 수 있습니다.","practice":"다음 협의 하나를 떠올려 상황 넷과 사람 넷, 여덟 줄을 세로로 적어 보십시오. 30초 안에 못 적는 칸에 동그라미를 치고 그 칸 하나만 오늘 채웁니다.","coaching":"다가오는 협의 한 건의 준비표를 함께 채우고 상대의 요구 뒤에 있는 욕구를 추정해 본다.","decks":[{"no":"33","title":"앉기 전에 끝나 있습니다","lv":"Lv3 4.5"}]},{"code":"4-06","name":"다음이 있는 합의","def":"합의를 이긴 것으로 끝내지 않고 다음 자리를 위한 기록으로 닫는다.","self":"나는 협의가 끝나면 얻은 것·준 것·다음에 바꿀 것을 적는다","obs":"이분은 협의가 끝나면 얻은 것·준 것·다음에 바꿀 것을 적는다","low":"협의가 끝나면 결과만 기억하고 과정은 흘려보내고 있을 수 있습니다. 무엇을 주고 무엇을 받았는지 남기지 않으면 다음 자리에서 같은 곳에서 막힐 수 있습니다.","practice":"최근 끝난 협의 하나를 두고 세 줄을 적어 보십시오. 얻은 것(조건·기한까지), 준 것(무엇과 바꿨는지), 다음에 바꿀 것(다짐 말고 행동)입니다.","coaching":"끝난 협상 한 건을 세 줄로 복기하고 막혔던 자리가 말·감정·신뢰 중 어디였는지 가린다.","decks":[{"no":"41","title":"다음에 또 만납니다","lv":"Lv3 4.6"}]},{"code":"4-07","name":"반대편 논거 먼저 세워 보기","def":"내 주장을 펴기 전에 반대편의 가장 강한 논거를 먼저 세워 본다.","self":"나는 주장을 펴기 전에 반대편이 쓸 가장 센 논거를 적어 본다","obs":"이분은 주장을 펴기 전에 반대편이 쓸 가장 센 논거를 적어 본다","low":"내 편을 먼저 정하고 그 편에 맞는 논거를 모아 오는 경향이 있을 수 있습니다. 반대편의 센 논거를 모른 채 들어가면 그 한마디에 준비가 무너질 수 있습니다.","practice":"다음 주 회의 하나를 떠올려 반대편이 쓸 표현 그대로 한 줄을 적고, 그중 가장 답하기 싫은 것에 내가 답할 수 있는지 확인해 보십시오.","coaching":"코치가 반대편을 맡는 짧은 찬반 토론을 하고, 입장을 바꿔 한 번 더 한다.","decks":[{"no":"47","title":"뽑기로 정합니다","lv":"Lv3 4.7"}]},{"code":"4-08","name":"주장에 사실·숫자·사례 붙이기","def":"주장마다 출처 있는 숫자나 구체적 사례를 근거로 붙인다.","self":"나는 주장을 할 때 숫자나 사례 같은 근거를 하나 이상 붙인다","obs":"이분은 주장을 할 때 숫자나 사례 같은 근거를 하나 이상 붙인다","low":"확신이 강한 주장일수록 근거 없이 결론만 전하는 경향이 있을 수 있습니다. 근거가 없으면 상대는 주장보다 말하는 사람의 확신을 평가하게 될 수 있습니다.","practice":"이번 주에 할 주장 하나 아래에 반론·숫자(출처 포함)·사례 세 칸을 그리고 빈 칸 하나를 채워 보십시오.","coaching":"실제 제안서의 핵심 주장마다 근거 종류를 표시하고 한 종류로 쏠린 곳을 보완한다.","decks":[{"no":"11","title":"이기는 대신 얻습니다","lv":"Lv2.4"},{"no":"10","title":"딱 두 가지입니다","lv":"Lv2.2"}]},{"code":"4-09","name":"상대가 얻는 것으로 말하기","def":"제안을 내 입장이 아니라 상대의 욕구와 이익의 말로 옮겨 전한다.","self":"나는 제안할 때 상대에게 무엇이 좋아지는지를 먼저 말한다","obs":"이분은 제안할 때 상대에게 무엇이 좋아지는지를 먼저 말한다","low":"제안이 내가 필요한 이유 중심으로 전해지고 있을 수 있습니다. 상대의 요구 뒤에 있는 욕구를 짚지 않으면 좋은 제안도 남의 일로 들릴 수 있습니다.","practice":"이번 주 제안 하나를 두고 상대의 요구 한 줄, 그 뒤의 욕구 한 줄을 적은 뒤 제안의 첫 문장을 그 욕구의 말로 바꿔 보십시오.","coaching":"설득해야 할 이해관계자 한 명의 요구와 욕구를 나눠 적고 첫 문장을 롤플레이한다.","decks":[{"no":"11","title":"이기는 대신 얻습니다","lv":"Lv2.4"}]},{"code":"4-10","name":"거절을 쪼개 다시 제안하기","def":"거절의 말을 조건 단위로 쪼개 열리는 문을 찾아 다시 제안한다.","self":"나는 거절을 들으면 그 말의 조건을 바꿔 다른 제안을 해 본다","obs":"이분은 거절을 들으면 그 말의 조건을 바꿔 다른 제안을 해 본다","low":"거절을 들으면 그 문장 전체를 닫힌 결론으로 받아들이는 경향이 있을 수 있습니다. 거절의 말 안에 들어 있는 사람·대상·방식의 조건을 놓치면 열릴 수 있던 문도 닫힐 수 있습니다.","practice":"최근 들은 거절 문장 하나를 그대로 적고 단어 셋에 동그라미를 친 뒤, 단어마다 \"그럼 ○○라면 가능할까요?\" 질문을 하나씩 만들어 보십시오.","coaching":"현업에서 반복되는 거절 문장 세 개를 함께 분해하고 다시 제안할 문장을 만든다.","decks":[{"no":"11","title":"이기는 대신 얻습니다","lv":"Lv2.4"}]}]},{"no":5,"name":"협업","floor":false,"mark":"⑤","oneLine":"여럿이 같은 그림을 보는 일","situation":null,"altGuide":null,"items":[{"code":"5-01","name":"회의 목적·결론·담당 설계","def":"회의를 부르기 전에 목적·남길 결과·정하는 방법을 먼저 정해 알린다.","self":"나는 회의에 초대할 때 목적과 끝나면 남을 기대 결과를 함께 적어 보낸다","obs":"이분은 회의에 초대할 때 목적과 끝나면 남을 기대 결과를 함께 적어 보낸다","low":"회의 소집이 일시와 장소만 담긴 알림으로 나가고 있을 수 있습니다. 부르기 전에 정하지 않은 것은 회의 안에서 정하게 되어 시간이 길어질 수 있습니다.","practice":"다음에 회의를 부를 때 메시지에 다섯 줄을 붙여 보십시오. 왜 모이는지, 끝나면 무엇이 남는지, 꼭 필요한 사람, 안건별 시간, 어떻게 정하고 누가 기록하는지입니다.","coaching":"팀의 정기 회의 하나를 골라 소집 메시지 다섯 줄을 다시 쓰고 참석자 명단을 함께 줄여 본다.","decks":[{"no":"17","title":"부르기 전에 정하십시오","lv":"Lv3 5.1"}]},{"code":"5-02","name":"넓히는 자리와 고르는 자리 나누기","def":"아이디어를 내는 시간과 고르는 시간을 나눠 한 번에 하나만 한다.","self":"나는 아이디어를 모으는 동안에는 평가를 뒤로 미룬다","obs":"이분은 아이디어를 모으는 동안에는 평가를 뒤로 미룬다","low":"아이디어가 나오는 즉시 되는지 안 되는지를 함께 따지고 있을 수 있습니다. 내는 자리와 고르는 자리가 섞이면 양도 적게 나오고 고를 기준도 남지 않을 수 있습니다.","practice":"다음 회의에서 두 마디를 써 보십시오. 아이디어를 받기 전에 \"지금은 넓히는 중입니다\", 넘어갈 때 \"이제 좁히겠습니다, 기준부터 정하겠습니다\".","coaching":"팀의 최근 결정 회의를 네 걸음으로 복기하고 확산과 수렴이 섞인 지점을 찾는다.","decks":[{"no":"23","title":"지금은 넓히는 중입니다","lv":"Lv3 5.2"}]},{"code":"5-03","name":"듣고 있음을 드러내기","def":"동의하고 듣고 있다는 것을 끄덕임과 표정으로 드러낸다.","self":"나는 회의에서 동의할 때 끄덕임이나 미소로 듣고 있음을 표시한다","obs":"이분은 회의에서 동의할 때 끄덕임이나 미소로 듣고 있음을 표시한다","low":"조용히 듣는 것으로 참여를 대신하고 있을 수 있습니다. 드러내지 않은 동의는 말하는 사람에게 닿지 않아 회의 자리가 더 무겁게 느껴질 수 있습니다.","practice":"다음 회의에서 둘 중 하나만 해 보십시오. 동의할 때 끄덕임을 한 박자 크고 길게, 상대가 말을 마치면 눈을 맞추고 한 번 웃기입니다.","coaching":"녹화한 회의에서 반응이 보이지 않은 구간을 찾아 참가자·진행자 역할별로 드러내는 방법을 정한다.","decks":[{"no":"32","title":"티를 내야 전달됩니다","lv":"Lv3 5.3"},{"no":"13","title":"말은 셋, 듣기는 일곱","lv":"Lv2.6"}]},{"code":"5-04","name":"부탁할 때 무엇을·언제까지","def":"일을 부탁할 때 범위·기한·깊이를 받는 사람이 판단하지 않아도 되게 담는다.","self":"나는 일을 부탁할 때 어느 부분을 언제까지 원하는지 적어 준다","obs":"이분은 일을 부탁할 때 어느 부분을 언제까지 원하는지 적어 준다","low":"당연해서, 미안해서, 급해서 요청이 짧아지고 있을 수 있습니다. 쓰지 않은 만큼 받는 사람이 대신 짐작하게 되어 일이 두 번 될 수 있습니다.","practice":"요청 메시지를 보내기 전에 네 칸을 훑어보십시오. 지금 해야 하는 일인지, 무엇의 어느 부분인지, 날짜와 시각, 어느 깊이로입니다. 빠진 칸만 채웁니다.","coaching":"최근 되돌아온 요청 한 건을 받는 사람의 네 번 판단으로 따라가며 빠진 칸을 찾는다.","decks":[{"no":"43","title":"그 한 줄이 이틀을 만듭니다","lv":"Lv3 5.4"}]},{"code":"5-05","name":"팀 안에서 다른 의견 말하기","def":"다수와 생각이 달라도 회의가 끝나기 전에 그 자리에서 의견을 꺼낸다.","self":"나는 회의에서 다수와 생각이 다르면 그 자리에서 말한다","obs":"이분은 회의에서 다수와 생각이 다르면 그 자리에서 말한다","low":"분위기를 깨지 않으려고 다른 생각을 회의 뒤로 미루고 있을 수 있습니다. 조용한 회의는 합의가 된 것처럼 보여도 실행 단계에서 다시 흔들릴 수 있습니다.","practice":"이번 주 회의에서 셋 중 하나만 내놓아 보십시오. 사실 한 줄 뒤에 내 생각 한 줄, \"이 부분은 제가 모릅니다\", \"저는 조금 다르게 봅니다\" 중 하나입니다.","coaching":"말하지 못하고 나온 회의 장면을 떠올려 그때 꺼낼 수 있었던 첫 문장을 함께 만든다.","decks":[{"no":"39","title":"조용한 팀이 좋은 팀은 아닙니다","lv":"Lv3 5.5"}]},{"code":"5-06","name":"역할과 책임 분명히 하기","def":"일마다 담당을 부서나 여럿이 아니라 한 사람의 이름으로 정한다.","self":"나는 일을 나눌 때 담당을 한 사람의 이름으로 정한다","obs":"이분은 일을 나눌 때 담당을 한 사람의 이름으로 정한다","low":"담당이 \"같이\", \"○○팀\"처럼 느슨하게 정해지고 있을 수 있습니다. 담당이 둘이면 서로 상대가 할 것이라 여겨 일이 샐 수 있습니다.","practice":"지금 팀의 일 다섯 줄을 펴 놓고 담당 칸만 보십시오. 둘이면 하나로, 부서면 사람 이름으로, 비어 있으면 가장 가까운 사람에게 내립니다.","coaching":"팀 업무 목록에서 담당이 없거나 둘이거나 부서로 적힌 일을 찾아 이름 하나로 줄이는 기준을 정한다.","decks":[{"no":"48","title":"일마다 이름이 하나입니다","lv":"Lv3 5.6"}]},{"code":"5-07","name":"갈등을 대화로 다루기","def":"불만을 평가의 말이 아니라 본 장면과 부탁의 말로 전한다.","self":"나는 불만을 말할 때 '항상, 늘'이라 하지 않고 실제 있었던 일을 짚어 말한다","obs":"이분은 불만을 말할 때 '항상, 늘'이라 하지 않고 실제 있었던 일을 짚어 말한다","low":"답답함이 쌓이면 \"늘\", \"매번\" 같은 평가의 말로 불만이 나올 수 있습니다. 평가의 말은 맞는 지적이어도 상대에게 방어부터 부를 수 있습니다.","practice":"메시지를 보내기 전에 두 번 걸러 보십시오. 이 문장이 카메라에 찍히는 장면인지, 그리고 상대가 \"그건 어렵고 대신 이건 가능합니다\"라고 답할 수 있는 부탁인지입니다.","coaching":"부딪히는 동료에게 할 말 하나를 관찰·느낌·욕구·부탁 네 마디로 다시 쓰고 롤플레이한다.","decks":[{"no":"29","title":"'항상'은 사실이 아닙니다","lv":"Lv3 5.7"}]},{"code":"5-08","name":"끝에 합의를 \"맞나요?\"로 확인","def":"대화와 회의의 끝에서 받은 그림을 한 줄로 되돌려 같은 그림인지 확인한다.","self":"나는 회의 끝에 정한 내용을 한 줄로 되짚어 확인받는다","obs":"이분은 회의 끝에 정한 내용을 한 줄로 되짚어 확인받는다","low":"회의가 끝나면 각자 이해한 대로 흩어지고 있을 수 있습니다. 그림이 달랐다는 것을 그날 아는 팀과 며칠 뒤에 아는 팀은 다시 하는 일의 양이 다를 수 있습니다.","practice":"다음 회의 마지막 십 초에 결정·담당·기한을 말하고 \"맞나요?\"를 붙여 보십시오.","coaching":"최근 어긋난 합의 한 건을 되짚어 마지막 확인 문장이 있었는지, 누가 말했어야 했는지 정한다.","decks":[{"no":"12","title":"같은 그림을 보고 계십니까","lv":"Lv2.5"}]},{"code":"5-09","name":"알게 된 것을 필요한 사람에게 먼저 알리기","def":"끝낸 일과 바뀐 사실을 상대가 묻기 전에 필요한 사람에게 알린다.","self":"나는 일이 끝나거나 바뀌면 관련된 사람에게 묻기 전에 알린다","obs":"이분은 일이 끝나거나 바뀌면 관련된 사람에게 묻기 전에 알린다","low":"일을 끝낸 것으로 할 일을 다했다고 여기고 있을 수 있습니다. 알리지 않은 완료와 변경은 다른 사람의 대기 시간이나 중복 작업으로 이어질 수 있습니다.","practice":"오늘 끝냈는데 아직 말하지 않은 일 하나를 \"[전달] ○○ 끝냈습니다\" 한 줄로 관련된 사람에게 남겨 보십시오.","coaching":"팀 안에서 정보가 늦게 도착한 사례를 모아 누가 누구에게 언제 알렸어야 했는지 흐름을 그린다.","decks":[{"no":"12","title":"같은 그림을 보고 계십니까","lv":"Lv2.5"}]},{"code":"5-10","name":"다른 팀의 목표를 이해하고 조율하기","def":"다른 팀과 부딪힐 때 그 팀이 책임지는 목표를 먼저 확인하고 조율한다.","self":"나는 다른 팀과 부딪히면 그 팀이 맡은 목표부터 확인한다","obs":"이분은 다른 팀과 부딪히면 그 팀이 맡은 목표부터 확인한다","low":"다른 팀과의 충돌을 태도나 협조의 문제로 먼저 읽는 경향이 있을 수 있습니다. 서로 책임지는 목표가 다르다는 것을 모르면 같은 요청을 되풀이하게 될 수 있습니다.","practice":"요즘 부딪히는 다른 팀 하나를 떠올려 그 팀이 올해 책임지는 목표를 한 줄로 적어 보십시오. 적을 수 없으면 다음 대화에서 그것부터 물어봅니다.","coaching":"협업이 막힌 두 팀의 목표를 나란히 적고 겹치는 지점에서 조율 문장을 만든다.","decks":[{"no":"12","title":"같은 그림을 보고 계십니까","lv":"Lv2.5"}]}]},{"no":6,"name":"리더십","floor":false,"mark":"⑥","oneLine":"남의 말을 끌어내는 일 — 코칭과 피드백","situation":null,"altGuide":"여기서 '동료'는 함께 일하는 동료와 후배를 모두 말합니다. 직책이 없어도 누군가를 돕고 이끄는 장면을 떠올려 답해 주십시오.","items":[{"code":"6-01","name":"직접 하기보다 맡기고 돕기","def":"답을 아는 일도 팀원이 해 보게 맡기고 옆에서 돕는다.","self":"나는 직접 하면 빠른 일도 팀원에게 맡겨 해 보게 한다","obs":"이분은 직접 하면 빠른 일도 팀원에게 맡겨 해 보게 한다","low":"실무자 시절의 실력이 여전히 \"제가 하는 게 빠릅니다\"로 쓰이고 있을 수 있습니다. 리더가 답을 계속 주면 팀원이 답을 꺼낼 기회가 줄어들 수 있습니다.","practice":"팀원 세 사람의 이름을 적고 이름 옆에 지금 쓰는 칸(지시·티칭·컨설팅·카운슬링·코칭)을 적어 보십시오. 한 사람만 골라 다음 요청이 오면 한 칸 옆의 방식으로 답해 봅니다.","coaching":"팀원별로 지금의 칸과 옮겨 갈 칸을 정하고, 맡길 일 하나와 도울 방식을 구체화한다.","decks":[{"no":"14","title":"제가 하는 게 빠릅니다","lv":"Lv3 6.1"}],"alt":{"self":"나는 직접 하면 빠른 일도 동료에게 맡겨 해 보게 한다","obs":"이분은 직접 하면 빠른 일도 동료에게 맡겨 해 보게 한다","low":"도움을 요청받으면 방법을 알려 주기보다 직접 처리해 주는 일이 잦을 수 있습니다. 그러면 같은 요청이 계속 나에게 돌아와 내 시간이 줄어들 수 있습니다.","practice":"이번 주에 동료가 도움을 청하면 바로 해 주지 말고 \"어디까지 해 보셨어요?\"를 먼저 물어보십시오. 막힌 한 곳만 함께 풉니다."}},{"code":"6-02","name":"코칭 대화","def":"답이 나오게 하는 대화의 순서를 지켜 목표와 현실을 먼저 묻는다.","self":"나는 팀원과 대안을 이야기하기 전에 목표와 현재 상황부터 묻는다","obs":"이분은 팀원과 대안을 이야기하기 전에 목표와 현재 상황부터 묻는다","low":"\"그래서 뭘 해 보겠어요?\"가 대화 초반에 먼저 나오고 있을 수 있습니다. 목표와 현실을 건너뛰고 대안을 물으면 질문이 추궁이나 막연한 다짐으로 끝날 수 있습니다.","practice":"떠오르는 팀원 한 사람과의 대화에서 늘 건너뛰는 칸 하나를 적어 보십시오. 라포·목표·현실·대안·의지·약속 중 하나입니다. 다음 대화에서 그 칸 하나만 넣고, 막히면 한 칸 뒤로 갑니다.","coaching":"실제 1on1 한 장면을 여섯 칸 워크시트로 재연하며 순서를 바꿔 다시 대화한다.","decks":[{"no":"20","title":"순서가 다릅니다","lv":"Lv3 6.2"}],"alt":{"self":"나는 동료의 고민을 들으면 대안보다 목표와 현재 상황부터 묻는다","obs":"이분은 동료의 고민을 들으면 대안보다 목표와 현재 상황부터 묻는다","low":"동료가 고민을 꺼내면 \"이렇게 해 봐\"가 먼저 나오고 있을 수 있습니다. 목표와 상황을 모른 채 건넨 답은 맞아도 쓰이지 않을 수 있습니다.","practice":"이번 주에 고민을 들으면 조언하기 전에 두 가지만 물어보십시오. \"어떻게 되면 좋겠어요?\"와 \"지금은 어디까지 와 있어요?\"입니다."}},{"code":"6-03","name":"질문의 종류 늘리기","def":"팀원의 생각을 끌어내기 위해 질문의 수보다 질문의 각도를 늘린다.","self":"나는 팀원의 답을 들으면 다른 각도의 질문을 하나 더 잇는다","obs":"이분은 팀원의 답을 들으면 다른 각도의 질문을 하나 더 잇는다","low":"질문이 \"진행 상황은요?\"처럼 한두 가지 종류에 머물러 있을 수 있습니다. 같은 종류의 질문은 같은 시점의 답만 불러와 생각이 넓어지기 어려울 수 있습니다.","practice":"요즘 가장 자주 하는 질문 한 줄을 그대로 적고, 그 답을 받았을 때 이어 물을 두 번째 질문을 다른 종류로 하나만 정해 두십시오. 예) 만약에·우선순위·미래·거꾸로 보기.","coaching":"녹음한 대화에서 질문을 모아 종류별로 나누고 비어 있는 종류로 두 번째 질문을 연습한다.","decks":[{"no":"22","title":"많이 묻지 마십시오","lv":"Lv3 6.3"}],"alt":{"self":"나는 동료의 답을 들으면 다른 각도의 질문을 하나 더 잇는다","obs":"이분은 동료의 답을 들으면 다른 각도의 질문을 하나 더 잇는다","low":"대화에서 묻는 질문이 사실 확인 한두 가지에 머물러 있을 수 있습니다. 같은 종류의 질문만 이어지면 상대의 생각이 더 나오기 어려울 수 있습니다.","practice":"자주 쓰는 질문 한 줄을 적고, 그 답 뒤에 이어 물을 질문을 다른 종류로 하나 정해 두십시오. 예) 만약에·우선순위·미래·거꾸로 보기."}},{"code":"6-04","name":"리더가 먼저 피드백 요청하기","def":"피드백이 오가는 환경을 만들기 위해 리더가 먼저 자신에 대한 의견을 청한다.","self":"나는 팀원에게 리더로서 바꿨으면 하는 점을 먼저 묻는다","obs":"이분은 팀원에게 리더로서 바꿨으면 하는 점을 먼저 묻는다","low":"피드백이 주로 리더에게서 팀원 쪽으로만 흐르고 있을 수 있습니다. 리더가 먼저 청하지 않으면 팀원은 말해도 괜찮은 자리인지 확신하기 어려울 수 있습니다.","practice":"내일 팀원 한 사람에게 \"저에 대해 하나만 말해 주시겠어요?\"라고 물어보십시오. 답을 들으면 설명 없이 \"고맙습니다\"로만 받습니다.","coaching":"우리 팀의 피드백 단계를 다섯 단 사다리에 놓아 보고 한 단 올릴 한 가지를 정한다.","decks":[{"no":"15","title":"말해 주지 않으면 모릅니다","lv":"Lv3 6.4"}],"alt":{"self":"나는 일을 마치면 함께한 동료에게 개선할 점을 먼저 청한다","obs":"이분은 일을 마치면 함께한 동료에게 개선할 점을 먼저 청한다","low":"피드백을 주로 기다리는 쪽에 서 있을 수 있습니다. 먼저 청하지 않으면 동료는 불편한 말을 아껴 두게 되고, 고칠 기회도 늦게 올 수 있습니다.","practice":"이번 주에 일을 하나 마치면 함께한 동료에게 \"다음에 제가 하나만 바꾼다면 뭘까요?\"라고 물어보십시오. 답은 설명 없이 \"고맙습니다\"로 받습니다."}},{"code":"6-05","name":"피드백의 크기 고르기","def":"피드백을 면담에 몰지 않고 리액션·스팟처럼 작은 크기부터 그때그때 한다.","self":"나는 고칠 점이 보이면 면담 때로 미루지 않고 그날 짧게 말한다","obs":"이분은 고칠 점이 보이면 면담 때로 미루지 않고 그날 짧게 말한다","low":"피드백이 정기 면담이나 평가 시기에 한꺼번에 몰리고 있을 수 있습니다. 몇 달 전 장면을 한 번에 들으면 받는 사람은 고칠 점보다 쌓인 평가로 받아들일 수 있습니다.","practice":"오늘 한 사람에게 한 줄만 남겨 보십시오. \"봤습니다, 그 부분이 좋았습니다\" 또는 \"다음에는 이 부분만 먼저 보여 주세요\". 자리를 따로 만들지 않습니다.","coaching":"리액션·스팟·상시 1on1·주기 1on1 네 칸 중 비어 있는 칸을 찾고 그보다 작은 칸의 실행 계획을 세운다.","decks":[{"no":"28","title":"작은 것이 먼저 옵니다","lv":"Lv3 6.5"}],"alt":{"self":"나는 동료의 일에서 고칠 점이 보이면 미루지 않고 그날 짧게 말한다","obs":"이분은 동료의 일에서 고칠 점이 보이면 미루지 않고 그날 짧게 말한다","low":"고칠 점이 보여도 말할 때를 기다리다 넘기고 있을 수 있습니다. 한참 뒤에 한꺼번에 전하면 작은 조언도 무거운 지적으로 들릴 수 있습니다.","practice":"오늘 동료 한 사람에게 한 줄만 전해 보십시오. \"그 부분 좋았어요\" 또는 \"다음엔 이 부분만 먼저 보여 주세요\". 자리를 따로 만들지 않습니다."}},{"code":"6-06","name":"상황별 피드백","def":"같은 말도 사람과 상황에 따라 다르게 도착하므로 첫마디를 달리한다.","self":"나는 사람과 상황에 따라 피드백의 첫마디를 다르게 꺼낸다","obs":"이분은 사람과 상황에 따라 피드백의 첫마디를 다르게 꺼낸다","low":"좋은 뜻의 피드백을 누구에게나 같은 문장으로 전하고 있을 수 있습니다. 내용이 맞아도 도착한 자리가 맞지 않으면 열심히 할수록 오해가 쌓일 수 있습니다.","practice":"오늘 하려던 피드백을 한 문장으로 적고 이름 자리에 내 이름을 넣어 소리 내어 읽어 보십시오. 불편하면 문장 전체가 아니라 첫 문장만 바꿉니다.","coaching":"'또 그럴 때 · 일이 다를 때 · 내가 먼저 접을 때 · 내가 모를 때' 중 요즘 막힌 상황의 첫 문장을 롤플레이한다.","decks":[{"no":"35","title":"열심히 할수록 멀어질 때가 있습니다","lv":"Lv3 6.6"}],"alt":{"self":"나는 사람과 상황에 따라 피드백의 첫마디를 다르게 꺼낸다","obs":"이분은 사람과 상황에 따라 피드백의 첫마디를 다르게 꺼낸다","low":"의견을 누구에게나 같은 문장으로 전하고 있을 수 있습니다. 내용이 맞아도 받는 사람과 때가 맞지 않으면 뜻과 다르게 도착할 수 있습니다.","practice":"오늘 동료에게 전하려던 의견을 한 문장으로 적고, 이름 자리에 내 이름을 넣어 소리 내어 읽어 보십시오. 불편하면 첫 문장만 바꿉니다."}},{"code":"6-07","name":"감정과 가치 다루기","def":"팀원의 저항을 성격으로 보지 않고 지키려던 가치의 신호로 읽는다.","self":"나는 팀원이 크게 저항하는 느낌이 있으면 그가 지키려던 가치가 무엇인지 묻는다","obs":"이분은 팀원이 크게 저항하는 느낌이 있으면 그가 지키려던 가치가 무엇인지 묻는다","low":"팀원의 저항을 예민함이나 태도의 문제로 먼저 읽을 수 있습니다. 반응 뒤에 있는 가치를 묻지 않으면 같은 자리에서 같은 충돌이 반복될 수 있습니다.","practice":"요즘 자꾸 걸리는 팀원 한 사람과의 자리를 떠올려, 내가 지키려던 것과 그 사람이 지키려던 것을 한 단어씩 적어 보십시오. 두 단어가 다르면 그것이 그 자리의 이유입니다.","coaching":"업무 가치 열 개 중 나와 팀원이 먼저 두는 두 개를 줄 세워 보고 부딪히는 자리를 찾는다.","decks":[{"no":"36","title":"다르다고 틀린 것은 아닙니다","lv":"Lv3 6.7"}],"alt":{"self":"나는 동료가 크게 저항하는 느낌이 있으면 그가 지키려던 가치가 무엇인지 묻는다","obs":"이분은 동료가 크게 저항하는 느낌이 있으면 그가 지키려던 가치가 무엇인지 묻는다","low":"동료의 저항을 예민함이나 태도의 문제로 먼저 읽을 수 있습니다. 반응 뒤의 가치를 묻지 않으면 같은 자리에서 같은 충돌이 되풀이될 수 있습니다.","practice":"요즘 자꾸 걸리는 동료 한 사람을 떠올려, 내가 지키려던 것과 그 사람이 지키려던 것을 한 단어씩 적어 보십시오. 두 단어가 다르면 그것이 부딪히는 이유입니다."}},{"code":"6-08","name":"왜 하는지 방향 말하기","def":"일을 맡기거나 바꿀 때 무엇보다 먼저 왜 하는지를 설명한다.","self":"나는 일을 맡길 때 이 일이 왜 필요한지 먼저 설명한다","obs":"이분은 일을 맡길 때 이 일이 왜 필요한지 먼저 설명한다","low":"바쁠수록 무엇을 언제까지만 전하고 이유는 생략하고 있을 수 있습니다. 방향을 모르는 팀원은 예외 상황에서 스스로 판단하기 어려워 다시 묻게 될 수 있습니다.","practice":"이번 주에 일을 맡길 때 첫 문장을 \"이 일은 ○○ 때문에 지금 필요합니다\"로 시작해 보십시오. 한 줄이면 됩니다.","coaching":"팀의 핵심 과제 세 개에 대해 리더가 말하는 '왜'를 한 문장씩 쓰고 팀원이 이해한 문장과 비교한다.","decks":[{"no":"13","title":"말은 셋, 듣기는 일곱","lv":"Lv2.6"},{"no":"14","title":"제가 하는 게 빠릅니다","lv":"Lv3 6.1"}],"alt":{"self":"나는 동료에게 일을 부탁할 때 이 일이 왜 필요한지 먼저 설명한다","obs":"이분은 동료에게 일을 부탁할 때 이 일이 왜 필요한지 먼저 설명한다","low":"바쁠수록 무엇을 언제까지만 전하고 이유는 생략하고 있을 수 있습니다. 이유를 모르는 동료는 예외 상황에서 판단하기 어려워 다시 묻게 될 수 있습니다.","practice":"이번 주에 일을 부탁할 때 첫 문장을 \"이 일은 ○○ 때문에 지금 필요합니다\"로 시작해 보십시오. 한 줄이면 됩니다."}},{"code":"6-09","name":"행동과 영향을 짚어 인정하기","def":"칭찬을 막연한 격려가 아니라 구체적 행동과 그 영향으로 전한다.","self":"나는 칭찬할 때 구체적 행동과 그 영향을 함께 말한다","obs":"이분은 칭찬할 때 구체적 행동과 그 영향을 함께 말한다","low":"칭찬이 \"수고했어요\", \"잘했어요\" 같은 인사말에 머물러 있을 수 있습니다. 무엇이 좋았는지 모르면 팀원은 그 행동을 다시 하기 어려울 수 있습니다.","practice":"팀원 한 사람의 이름 아래 네 줄을 적어 보십시오. 최근 한 행동, 그걸 보고 내가 느낀 것, 그 행동이 말해 주는 그 사람, 팀과 일에 생긴 변화입니다. 내일 오전에 그대로 말합니다.","coaching":"최근 한 칭찬 세 개를 행동·감정·존재·영향 네 칸으로 다시 쓰고 빠진 칸을 채운다.","decks":[{"no":"13","title":"말은 셋, 듣기는 일곱","lv":"Lv2.6"}],"alt":{"self":"나는 칭찬할 때 구체적 행동과 그 영향을 함께 말한다","obs":"이분은 칭찬할 때 구체적 행동과 그 영향을 함께 말한다","low":"칭찬이 \"수고했어요\", \"잘했어요\" 같은 인사말에 머물러 있을 수 있습니다. 무엇이 좋았는지 모르면 상대는 그 행동을 다시 하기 어려울 수 있습니다.","practice":"동료 한 사람의 최근 행동 하나를 떠올려 \"○○ 해 주신 덕분에 ○○이 됐어요\"로 한 줄을 만들어 두십시오. 내일 그대로 말합니다."}},{"code":"6-10","name":"반대 의견·나쁜 소식을 환영하기","def":"문제를 먼저 꺼낸 사람이 손해 보지 않도록 반대와 나쁜 소식을 반긴다.","self":"나는 나쁜 소식을 가져온 팀원에게 먼저 알려 줘서 고맙다고 말한다","obs":"이분은 나쁜 소식을 가져온 팀원에게 먼저 알려 줘서 고맙다고 말한다","low":"나쁜 소식을 들으면 원인과 책임을 묻는 말이 먼저 나올 수 있습니다. 그 반응이 쌓이면 팀은 문제를 늦게, 작게 포장해서 가져올 수 있습니다.","practice":"이번 주에 문제나 반대 의견을 들으면 첫마디를 \"먼저 말해 줘서 고맙습니다\"로 정해 두고, 원인 질문은 그다음에 하십시오.","coaching":"팀원이 나쁜 소식을 늦게 가져온 사례를 되짚어 그 전에 리더가 · 75 · 100","items":[{"code":"D1","domainNo":1,"label":"① 위닝마인드셋"},{"code":"D2","domainNo":2,"label":"② 비즈니스 커뮤니케이션"},{"code":"D3","domainNo":3,"label":"③ 프레젠테이션"},{"code":"D4","domainNo":4,"label":"④ 설득"},{"code":"D5","domainNo":5,"label":"⑤ 협업"},{"code":"D6","domainNo":6,"label":"⑥ 리더십"}]},"open":{"관찰자1":"이분이 앞으로도 계속했으면 하는 행동 한 가지를 적어 주십시오. 떠오르는 장면이 있으면 함께 적어 주셔도 좋습니다.","관찰자2":"이분이 새로 해 봤으면 하는 행동 한 가지를 적어 주십시오.","팀1":"우리 팀의 소통에서 지금 가장 시급한 한 가지는 무엇입니까?","팀2":"리더에게 바라는 한 가지를 적어 주십시오.","팀2-리더":"팀원들이 리더인 나에게 가장 바랄 것 같은 한 가지를 적어 주십시오.","팀3":"함께 일하는 동료들에게 바라는 한 가지를 적어 주십시오.","안내":"특정인의 이름이나 누구인지 드러나는 사건은 빼고 적어 주십시오. 원문은 코치만 읽고, 리더에게는 주제별로 묶은 요약만 전합니다."},"phrases":{"caution":{"1":"나에게 거는 말과 몸의 상태를 다루는 칸에 아직 손이 덜 갔을 수 있어, 다른 칸이 흔들릴 때 여기부터 살펴보시면 좋습니다.","2":"일의 말을 키워드와 구조로 세우는 칸에 아직 손이 덜 갔을 수 있으며, 원인이 한 칸 왼쪽의 위닝마인드셋에 있을 수도 있습니다.","3":"청중 앞에서 자료와 말을 하나로 모으는 칸에 아직 손이 덜 갔을 수 있으며, 원인이 한 칸 왼쪽의 비즈니스 커뮤니케이션에 있을 수도 있습니다.","4":"반대하는 사람을 움직이는 칸에 아직 손이 덜 갔을 수 있으며, 원인이 한 칸 왼쪽의 프레젠테이션에 있을 수도 있습니다.","5":"여럿이 같은 그림을 보게 하는 칸에 아직 손이 덜 갔을 수 있으며, 원인이 한 칸 왼쪽의 설득에 있을 수도 있습니다.","6":"팀원의 말과 생각을 끌어내는 칸에 아직 손이 덜 갔을 수 있으며, 원인이 한 칸 왼쪽의 협업에 있을 수도 있습니다."},"유의":"이 결과는 코칭의 출발점을 정하기 위한 자기 점검 자료입니다. 점수는 능력의 크기가 아니라 지금 자주 하고 있는 행동의 빈도입니다. 표준화된 검사가 아니며 인사평가에 쓰지 않습니다.","개인정보":"응답은 코칭 목적으로만 쓰며, 개인 응답은 코치만 봅니다. 리더와 담당자에게는 3명 이상 모인 집계값만 제공하고, 서술형은 주제별로 묶은 요약만 전합니다. 원자료는 과정 종료 6개월 뒤 삭제합니다.","CTA":"이 결과를 코치와 함께 읽고 이번 주에 해 볼 한 가지를 정하고 싶으시면 카카오톡 채널로 말씀해 주십시오. http://pf.kakao.com/_wftPX","CTA-개인무료":"팀 진단과 1:1 · 팀 코칭 문의는 카카오톡 채널에서 받습니다. http://pf.kakao.com/_wftPX","바닥판":"여섯 칸이 서 있는 기반입니다.","상사표기":"상사 1인의 응답입니다.","비공개":"응답한 사람이 3명 미만이라 이 값은 보여 드리지 않습니다."},"app":{"제목":"1+6 커뮤니케이션 진단","부제":"여섯 칸 가운데 지금 어디에 서 있는지 봅니다","시작-본인":"잘하는지를 묻지 않습니다. 지금 얼마나 자주 하고 있는지만 고르시면 됩니다. 한 화면에 한 문항씩 나오고, 고르면 다음으로 넘어갑니다.","시작-관찰자":"이분이 평소 어떻게 소통하는지 보신 대로 골라 주십시오. 누가 어떻게 답했는지는 본인에게도 회사에도 전해지지 않습니다. 볼 기회가 없었던 행동은 '모르겠다'를 고르시면 점수에서 빠집니다.","시작-무료":"응답은 이 기기 밖으로 나가지 않습니다. 결과는 브라우저 안에서 바로 계산해 보여 드리고, 어디에도 저장하지 않습니다.","소요-본인":"70문항 · 약 10분","소요-관찰자":"72문항 · 약 11분","유의-시작":"정답이 없습니다. 오래 고민하지 마시고 최근 석 달의 모습을 떠올려 고르십시오. 중간에 닫아도 이어서 하실 수 있습니다.","이름-제목":"이름을 알려 주시겠어요?","이름-안내":"리포트 제목에만 씁니다. 관찰자에게는 보이지 않습니다.","이름-건너뛰기":"건너뛰기","이끄는-제목":"지금 사람을 이끄는 자리입니까?","이끄는-안내":"팀이나 파트, 후배를 이끄는 자리에 계신지에 따라 마지막 영역의 문항이 달라집니다. 어느 쪽을 고르셔도 여섯 칸이 온전하게 나옵니다.","이끄는-예":"예, 이끄는 자리입니다","이끄는-아니요":"아니요, 지금은 아닙니다","쉼-제목":"잠시 쉬어도 됩니다","쉼-안내":"다음은 아래 영역입니다. 준비되시면 이어서 하십시오.","서술형-제목":"마지막으로 두 가지만 여쭙겠습니다","서술형-안내":"한 줄이어도 좋습니다. 비워 두고 넘기셔도 됩니다.","시작-버튼":"시작하기","이어서-버튼":"이어서 하기","처음부터-버튼":"처음부터","다음-버튼":"다음","이전-버튼":"이전","제출-버튼":"응답 보내기","제출중":"응답을 보내고 있습니다…","제출완료-본인":"응답을 보냈습니다. 아래에서 결과를 바로 확인하십시오.","제출완료-관찰자":"응답을 보냈습니다. 도와주셔서 고맙습니다. 이 창은 닫으셔도 됩니다.","제출완료-관찰자안내":"개별 응답은 코치만 보고, 본인에게는 여러 사람의 평균만 전해집니다.","제출실패":"응답을 저장하지 못했습니다","제출실패-안내":"인터넷 연결이 끊겼거나 저장 서버가 잠시 응답하지 않았습니다. 응답은 이 기기에 보관해 두었으니 아래 버튼으로 다시 보내 주십시오.","재시도-버튼":"다시 보내기","보관안내":"보관해 둔 응답이 있습니다. 다시 보내시겠습니까?","서버없음":"저장 서버가 아직 연결되지 않았습니다. 지금은 저장 없이 혼자 해 보는 모드로만 동작합니다.","링크오류":"링크가 올바르지 않습니다. 받으신 주소를 다시 확인해 주십시오.","권한오류":"이 주소로는 결과를 볼 수 없습니다. 코치에게 받은 링크가 맞는지 확인해 주십시오.","불러오는중":"결과를 불러오고 있습니다…","리포트-다시열기":"이 결과를 다시 열 수 있는 링크입니다. 잃어버리면 코치에게 요청하십시오.","리포트-링크복사":"결과 링크 복사","리포트-인쇄":"PDF로 저장","리포트-다시하기":"다시 하기","무료-CTA제목":"팀 진단과 코칭 문의","모르겠다":"모르겠다","시작-팀원":"세 가지를 여쭙습니다. 먼저 나의 행동, 다음으로 우리 팀, 마지막으로 우리 리더입니다. 누가 어떻게 답했는지는 리더에게도 회사에도 전해지지 않고, 세 명 이상 모인 평균만 리포트에 들어갑니다.","시작-리더":"세 가지를 여쭙습니다. 나의 행동, 우리 팀, 그리고 팀원들이 우리 팀에 몇 점을 줬을지에 대한 예측입니다. 예측은 맞히는 시험이 아니라 첫 회기의 대화 재료입니다.","소요-팀원":"103문항 · 약 16분","소요-리더":"99문항 · 약 15분","파트A-제목":"A · 나","파트A-안내":"먼저 나의 행동을 봅니다. 잘하는지가 아니라 얼마나 자주 하는지를 고르십시오.","파트B-제목":"B · 우리 팀","파트B-안내":"이번에는 주어가 '우리 팀'입니다. 나 한 사람이 아니라 팀이 평소 어떻게 하는지로 고르십시오.","파트C-제목":"C · 우리 리더","파트C-안내":"앞에서 나에게 물었던 것과 같은 행동을, 이번에는 우리 리더에 대해 여쭙습니다. 개별 응답은 리더에게 전해지지 않습니다.","파트D-제목":"D · 리더 예측","파트D-안내":"팀원들이 '우리 팀' 질문에서 각 영역에 평균 몇 점을 줬을지 예측해 주십시오. 0점에서 100점 사이이고, 50점이 '절반쯤 한다'입니다.","파트E-제목":"E · 서술형","리더C안내":"우리 리더 문항은 리더에게 따로 묻지 않습니다. 앞에서 답한 나의 응답을 그대로 씁니다.","예측-단위":"점","제출완료-팀원":"응답을 보냈습니다. 도와주셔서 고맙습니다.","제출완료-팀원안내":"아래 링크로 나의 개인 리포트를 다시 열 수 있습니다. 팀 리포트는 팀원이 세 명 이상 모이면 열립니다.","개인키-안내":"이 링크는 나의 결과만 엽니다. 다른 사람의 응답은 보이지 않고, 링크를 잃어버리면 코치에게 요청하십시오.","비공개-제목":"아직 열 수 없습니다","코치-제목":"코치 입력 모드","코치-안내":"종이 질문지를 옮겨 적는 화면입니다. 한 화면에 한 영역씩 나오고, 숫자키 1~5로 바로 입력할 수 있습니다.","코치-역할선택":"이 질문지는 누구의 것입니까?","코치-이름":"이름 (본인용만, 비워 두셔도 됩니다)","코치-빈칸경고":"아직 비어 있는 칸이 있습니다. 종이에 답이 없으면 그대로 두고 넘어가셔도 됩니다.","코치-다음장":"다음 장 입력","코치-완료":"한 장을 저장했습니다.","코치-종료":"입력을 마칩니다","요약-제목":"서술형 코치 요약","요약-안내":"원문은 코치만 읽습니다. 주제별로 묶은 문장을 한 줄에 하나씩 적으십시오. 여기에 적은 것만 리더와 담당자에게 보입니다.","요약-저장":"요약 저장","요약-저장완료":"요약을 저장했습니다.","콘솔-제목":"코치 콘솔","콘솔-안내":"회사와 부서를 등록하고 진단 건을 만듭니다. 링크는 건마다 자동으로 발급됩니다.","콘솔-키경고":"이 주소에는 마스터 키가 들어 있습니다. 남에게 보내지 마십시오.","콘솔-빈트리":"아직 등록한 회사가 없습니다. 아래에서 회사를 먼저 만드십시오.","콘솔-미분류":"미분류 — 회사·부서 없이 만든 건","콘솔-새로고침":"새로 읽기","콘솔-회사추가":"회사 추가","콘솔-부서추가":"부서 추가","콘솔-건추가":"진단 건 만들기","콘솔-회사ID":"회사 ID (영문 대문자 2~6자)","콘솔-회사이름":"회사 이름","콘솔-부서ID":"부서 ID (영문 대문자·숫자)","콘솔-부서이름":"부서 이름","콘솔-유형":"유형","콘솔-대상":"대상 (누구의 진단인지)","콘솔-회차":"회차","콘솔-마감일":"마감일","콘솔-이끄는자리":"대상이 사람을 이끄는 자리입니까?","콘솔-만들기":"만들기","콘솔-닫기":"닫기","콘솔-링크":"링크","콘솔-리포트":"리포트 열기","콘솔-마감":"마감","콘솔-마감확인":"마감하면 새 응답을 받지 않습니다. 리포트는 계속 열립니다. 마감할까요?","콘솔-삭제":"원자료 삭제","콘솔-삭제확인1":"이 건의 응답·요약·링크·개인 키를 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?","콘솔-삭제확인2":"정말 지웁니다. 한 번 더 확인해 주십시오.","콘솔-복사완료":"링크를 복사했습니다.","콘솔-저장중":"저장하고 있습니다…","콘솔-저장실패":"저장하지 못했습니다. 잠시 뒤 다시 해 주십시오.","콘솔-응답없음":"아직 응답이 없습니다","콘솔-명단":"명단 등록","콘솔-명단준비중":"명단 등록은 다음 단계에서 열립니다.","시작-수강생":"강의에 앞서 지금의 나를 한 번 봅니다. 잘하는지를 묻지 않고, 얼마나 자주 하고 있는지만 고르시면 됩니다. 결과는 끝나자마자 이 화면에서 바로 보여 드립니다.","소요-수강생":"70문항 · 약 10분","이름-제목-수강생":"이름을 알려 주시겠어요?","이름-안내-수강생":"이름은 본인 리포트 제목과 코치의 준비에만 쓰며, 담당자에게는 개인 결과를 드리지 않습니다. 비워 두셔도 진단은 그대로 진행됩니다.","과정-마감":"이 과정의 응답은 마감되었습니다. 담당자에게 문의해 주십시오.","제출완료-수강생":"응답을 보냈습니다. 아래가 지금의 나입니다.","개인키-안내-수강생":"이 링크는 나의 결과만 엽니다. 담당자와 동료에게는 보이지 않고, 강의장에서는 사람 수만큼 모인 평균만 함께 봅니다.","시작-명단":"두 가지를 여쭙습니다. 먼저 나와 우리 팀, 그다음 같은 팀 사람들의 공통 역량입니다. 누가 어떻게 답했는지는 본인에게도 리더에게도 전해지지 않고, 세 명 이상 모인 평균만 리포트에 들어갑니다.","소요-명단원":"113문항 · 약 18분","소요-명단리더":"109문항 · 약 17분","파트F-제목":"F · 같은 팀 사람들","파트F-안내":"한 사람씩 공통 역량 열 가지를 여쭙습니다. 잘하는 정도가 아니라 평소 얼마나 자주 그렇게 하는지로 골라 주십시오. 본 적이 없는 행동은 '모르겠다'를, 그 사람을 볼 기회가 거의 없었으면 '잘 모릅니다'를 고르시면 됩니다.","동료-안내":"이분이 평소 어떻게 하는지 보신 대로 골라 주십시오. 개별 응답은 본인에게 전해지지 않습니다.","동료-건너뛰기":"이분은 잘 모릅니다 — 건너뛰기","동료-다음":"다음 사람","동료-남음":"명 남았습니다","관계-리더":"우리 리더","관계-동료":"같은 팀 동료","관계-팀원":"우리 팀원","제출완료-명단":"응답을 보냈습니다. 도와주셔서 고맙습니다.","제출완료-명단안내":"아래 링크로 나의 개인 리포트를 다시 열 수 있습니다. 같은 팀 사람들이 본 값은 평가자가 세 명 이상 모이면 함께 보입니다.","이미제출":"이 링크로는 이미 응답을 보내셨습니다. 다시 보내실 수는 없습니다. 고치실 것이 있으면 코치에게 말씀해 주십시오.","콘솔-명단제목":"명단 등록","콘솔-명단안내":"한 줄에 한 명. 리더 한 명을 고릅니다. 저장하면 사람마다 개인 링크가 생기고, 응답이 있는 사람은 지울 수 없습니다.","콘솔-명단이름":"이름 (한 줄에 한 명)","콘솔-명단리더":"리더","콘솔-명단저장":"명단 저장","콘솔-명단링크":"개인 링크","콘솔-명단진행":"진행","콘솔-명단완료":"이미 응답한 사람은 명단에서 지울 수 없습니다.","콘솔-명단없음":"아직 명단이 없습니다.","콘솔-유형설명":"무엇을 진단하는지에 따라 링크와 리포트가 달라집니다.","콘솔-유형-일대일":"1:1 — 본인 + 관찰자 360","콘솔-유형-팀":"팀 — 팀원·팀 리더 + 팀 리포트·리더 대시보드","콘솔-유형-과정":"과정 — 기업 강의: 수강생 개인 리포트 + 과정 집계","콘솔-대상-일대일":"코칭 받는 사람","콘솔-대상예시-일대일":"예) 김OO 팀장","콘솔-대상설명-일대일":"리포트 제목과 링크 발급에 씁니다. 관찰자(상사·동료·부하 직원) 링크는 만든 뒤 '링크'에서 복사합니다.","콘솔-대상-팀":"팀 이름","콘솔-대상예시-팀":"예) 마케팅팀","콘솔-대상설명-팀":"팀원 이름은 여기 넣지 않습니다. 만든 뒤 이 건의 '명단 등록'에서 한 줄에 한 명씩 넣고 리더를 지정하면 개인별 링크가 나옵니다. 명단 없이 공용 링크로 돌릴 수도 있습니다.","콘솔-대상-과정":"과정명 · 기수","콘솔-대상예시-과정":"예) 신임팀장 과정 3기","콘솔-대상설명-과정":"수강생은 공용 링크 하나로 답합니다. 이름은 각자 시작 화면에서 선택 입력합니다.","콘솔-회차설명":"1차 진단은 1, 같은 대상의 재진단은 2. 전후 비교에 씁니다.","콘솔-마감일설명":"기록용입니다. 지나도 링크는 닫히지 않으며, 닫으려면 '마감' 버튼을 씁니다.","콘솔-이끄는설명-일대일":"대상이 팀·파트·후배를 이끄는 자리면 '예'. ⑥ 리더십 문항의 판이 달라집니다.","콘솔-이끄는설명-응답자":"리더 여부는 응답자가 시작 질문에서 각자 답합니다.","콘솔-회사ID설명":"영문 대문자 2~6자. 진단 코드의 앞자리가 됩니다(예 KKO-MKT-01). 개인 고객은 PERSON 처럼 한 묶음으로 두셔도 됩니다.","콘솔-회사이름설명":"리포트 머리에 보이는 이름입니다.","콘솔-부서ID설명":"영문 대문자·숫자. 회사 ID 뒤에 붙습니다(예 KKO-MKT). 과정은 과정 이름으로 묶음을 만드십시오 — 수강생 시작 화면의 '회사 · 과정'에 이 이름이 보입니다.","콘솔-부서이름설명":"부서 이름 또는 과정 이름입니다."},"ui":{"sample":"샘플 · 가상 데이터","product":"1+6 커뮤니케이션 진단","six":"여섯 영역","floorAvg":"공통 평균","fail":"보완","caution":"주의","strength":"강점","self":"본인","obs":"관찰자","leader":"리더","members":"팀원 평균","failKey":"보완 문항","rankKey":"시급 순위","lowWhen":"낮을 때","practice":"이번 주 연습","coaching":"코칭에서 다룰 것","deck":"연결 덱","kakao":"카카오톡 채널로 문의하기","cohort":"과정 리포트","cohortN":"명","cohortAvg":"수강생 평균","cohortLead":"이번 과정의 수강생들이 지금 어디에 서 있는지입니다. 개인 결과는 각자 본인만 보고, 여기에는 모인 평균만 들어갑니다.","cohortFloor":"공통 역량 기반","cohortFail":"과정 보완","cohortSummary":"한눈에 보기","cohortDist":"영역별 응답 분포","cohortDistDesc":"수강생 한 사람의 영역 평균을 점수 칸에 넣어 몇 명인지 셌습니다.","cohortDot":"점 = 그 점수를 준 수강생 수","cohortFailDesc":"평균 2.5 이하이거나 수강생 과반이 2점 이하인 행동입니다. 강의에서 먼저 다룰 후보입니다.","cohortPlan":"강의 설계 제안","cohortPlanDesc":"보완 문항이 몰린 영역입니다. 이 순서로 시간을 나누면 체감이 큽니다.","cohortPlanNone":"특별히 몰린 영역이 없습니다. 여섯 칸을 고르게 훑는 구성이 맞습니다.","peerSec":"기반 역량 — 나와 동료가 본 것","peerDesc":"같은 팀 사람들이 공통 역량 열 가지를 보고 답한 값입니다. 누가 어떻게 답했는지는 나오지 않고, 모인 평균만 보입니다.","peerMine":"본인","peerPeers":"동료 평균","peerLeader":"리더","peerReports":"팀원 평균","peerAll":"평가자 전체 평균","peerOne":"1인 응답","peerN":"명","peerMerged":"동료가 세 명이 되지 않아 리더를 포함한 평가자 전체 평균 한 줄로 보여 드립니다.","peerFew":"서로 본 값은 평가자가 3명 이상 모이면 열립니다.","peerScale":"숫자는 본인 점수와 같은 0~100 환산값입니다. 칸에 마우스를 올리면 1~5 평균이 보입니다.","peerPanel":"기반 역량 — 팀원이 서로를 본 평균","peerPanelDesc":"팀원들이 서로의 공통 역량을 보고 답한 값을 문항마다 모았습니다. 누가 누구를 봤는지는 남지 않습니다."}};

<script>
(function(){
'use strict';
var L = window.CoachLogic, RP = window.CoachReport;
var M = window.__MODEL__, CFG = window.__CONFIG__;
var APP = M.app, PH = M.phrases;
var KAKAO = 'http://pf.kakao.com/_wftPX';
var OBS_ROLES = ['leader','peer','report'];   /* 360 관찰자 — leader 는 '상사' (2026-09-18 확정) */
var ROLE_LABEL = {self:'본인', leader:'상사', peer:'동료', report:'부하 직원', member:'팀원', teamlead:'팀 리더', learner:'수강생'};
var LS_PREFIX = 'coach_v1_', LS_PENDING = 'coach_pending_v1';

var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls;
  if(txt!==undefined && txt!==null) e.textContent=txt; return e; }
function txt(id, s){ var e=$(id); if(e) e.textContent = s===undefined||s===null ? '' : s; }
function ls(fn, dflt){ try{ return fn(); }catch(e){ return dflt; } }
function reduced(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function toast(msg){
  var t = $('a-toast'); t.textContent = msg; t.classList.add('a-on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('a-on'); }, 2800);
}
function copyText(text, msg){
  var done = function(){ toast(msg || '복사했습니다.'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 되지 않았습니다. 주소창을 길게 눌러 복사해 주세요.'); }
  document.body.removeChild(ta);
}

/* ── 상태 ─────────────────────────────────────────────── */
var S = { mode:'free', p:'', role:'self', key:'', view:'', round:1,
          leads:null, name:'', ans:{}, B:{}, C:{}, D:{}, open:{}, idx:0, screen:'', locked:false,
          myKey:'', coach:false, meta:null,
          token:'', tok:null, peer:{}, peerAt:0 };
var STEPS = [];
function isObs(){ return OBS_ROLES.indexOf(S.role) >= 0; }
function isLearner(){ return S.role === 'learner'; }
/* 개인 링크(명단)로 들어온 사람 — 동료 평가 단계가 붙는다 (설계 5장) */
function isToken(){ return !!S.token; }
function mates(){ return (S.tok && S.tok.peers) || []; }
function relLabel(rel){
  return rel === 'leader' ? APP['관계-리더'] : rel === 'report' ? APP['관계-팀원'] : APP['관계-동료'];
}
function floorItems(){
  for(var i=0;i<M.domains.length;i++) if(M.domains[i].floor) return M.domains[i].items;
  return [];
}
/* 이름을 받는 역할 — 본인과 수강생뿐이다 (설계 4장) */
function asksName(){ return S.role === 'self' || S.role === 'learner'; }
function isTeam(){ return S.role === 'member' || S.role === 'teamlead'; }
function domains(){ return M.domains; }
function bItems(){ return (M.teamB && M.teamB.items) || []; }
function cItems(){ return (M.teamC && M.teamC.items) || []; }
function dItems(){ return (M.teamD && M.teamD.items) || []; }

/* 서술형 — 역할마다 묻는 것이 다르다 (원고 '## 서술형') */
function openKeys(){
  if(isObs()) return ['관찰자1','관찰자2'];
  if(S.role === 'member') return ['팀1','팀2','팀3'];
  if(S.role === 'teamlead') return ['팀1','팀2-리더','팀3'];
  return [];
}

/* A(70) → B(20) → C(10, 팀원만) → D(6, 리더만) → 서술형.
   리더는 C 를 묻지 않고 A 응답을 재사용한다 (PRD 확정 3차 8번). */
function buildSteps(){
  STEPS = [];
  domains().forEach(function(d){
    STEPS.push({ t:'sect', no:d.no, part:'A' });
    d.items.forEach(function(it){ STEPS.push({ t:'item', part:'A', code:it.code, no:d.no }); });
  });
  if(!isTeam()) return;
  STEPS.push({ t:'part', part:'B' });
  bItems().forEach(function(x){ STEPS.push({ t:'item', part:'B', code:x.code, no:x.domainNo }); });
  if(S.role === 'member'){
    STEPS.push({ t:'part', part:'C' });
    cItems().forEach(function(x){ STEPS.push({ t:'item', part:'C', code:x.code }); });
  } else {
    STEPS.push({ t:'part', part:'D' });
    dItems().forEach(function(x){ STEPS.push({ t:'slider', part:'D', code:x.code, no:x.domainNo }); });
  }
  /* 같은 팀 사람들 — 한 사람에 한 화면 (설계 5장) */
  if(isToken() && mates().length){
    STEPS.push({ t:'part', part:'F' });
    mates().forEach(function(x, i){ STEPS.push({ t:'peer', part:'F', pid:x.pid, name:x.name, rel:x.relation, at:i }); });
  }
}
function domainOf(no){
  for(var i=0;i<M.domains.length;i++) if(M.domains[i].no===no) return M.domains[i];
  return null;
}
function itemOf(code){ return L.itemByCode(M, code); }
function bOf(code){ var a=bItems(); for(var i=0;i<a.length;i++) if(a[i].code===code) return a[i]; return null; }
function cOf(code){ var a=cItems(); for(var i=0;i<a.length;i++) if(a[i].code===code) return a[i]; return null; }
function dOf(code){ var a=dItems(); for(var i=0;i<a.length;i++) if(a[i].code===code) return a[i]; return null; }
function bag(part){ return part === 'B' ? S.B : part === 'C' ? S.C : part === 'D' ? S.D : S.ans; }
function itemCount(){
  var n = 0;
  domains().forEach(function(d){ n += d.items.length; });
  if(isTeam()) n += bItems().length + (S.role === 'member' ? cItems().length : dItems().length);
  if(isToken()) n += mates().length * floorItems().length;
  return n;
}
function answeredCount(){
  var n = Object.keys(S.ans).length + Object.keys(S.B).length + Object.keys(S.C).length + Object.keys(S.D).length;
  Object.keys(S.peer).forEach(function(pid){ n += Object.keys(S.peer[pid] || {}).length; });
  return n;
}
/* 파트 화면의 문구 */
var PART_TITLE = { A:'파트A-제목', B:'파트B-제목', C:'파트C-제목', D:'파트D-제목', E:'파트E-제목', F:'파트F-제목' };
var PART_NOTE = { A:'파트A-안내', B:'파트B-안내', C:'파트C-안내', D:'파트D-안내', F:'파트F-안내' };
function partCount(part){
  if(part === 'B') return bItems().length;
  if(part === 'C') return cItems().length;
  if(part === 'D') return dItems().length;
  if(part === 'F') return mates().length * floorItems().length;
  return 0;
}

/* ── 저장 ─────────────────────────────────────────────── */
function lsKey(){ return LS_PREFIX + (S.p || 'free') + '_' + (S.token ? 't' + S.token.substring(0, 8) : S.role); }
function saveProgress(){
  ls(function(){ localStorage.setItem(lsKey(), JSON.stringify({
    v:1, ans:S.ans, B:S.B, C:S.C, D:S.D, open:S.open, peer:S.peer,
    idx:S.idx, name:S.name, leads:S.leads, t:Date.now() })); });
}
function clearProgress(){ ls(function(){ localStorage.removeItem(lsKey()); }); }
function loadProgress(){
  return ls(function(){
    var raw = localStorage.getItem(lsKey()); if(!raw) return null;
    var p = JSON.parse(raw);
    if(!p || p.v!==1 || !p.ans) return null;
    if(Date.now() - (p.t||0) > 1000*60*60*24*30) return null;
    if(!Object.keys(p.ans).length) return null;
    return p;
  }, null);
}
function pending(){ return ls(function(){ return JSON.parse(localStorage.getItem(LS_PENDING) || '[]'); }, []); }
function pendingPush(payload){
  ls(function(){
    var q = pending();
    q = q.filter(function(x){ return !(x.p===payload.p && x.r===payload.r); });
    q.push(payload);
    localStorage.setItem(LS_PENDING, JSON.stringify(q.slice(-5)));
  });
}
function pendingDrop(payload){
  ls(function(){
    var q = pending().filter(function(x){ return !(x.p===payload.p && x.r===payload.r); });
    localStorage.setItem(LS_PENDING, JSON.stringify(q));
  });
}

var SCREENS = ['a-start','a-name','a-leads','a-quiz','a-peer','a-open','a-send','a-done','a-coach','a-admin'];
function show(id){

/* ── 서버 ─────────────────────────────────────────────── */
function hasServer(){ return !!(CFG && CFG.url); }
function qs(o){
  return Object.keys(o).filter(function(k){ return o[k]!==undefined && o[k]!==null && o[k]!==''; })
    .map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(o[k]); }).join('&');
}
function post(payload){
  if(!hasServer()) return Promise.reject(new Error('no-server'));
  return fetch(CFG.url, { method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(payload) })
    .then(function(res){ return res.text(); })
    .then(function(t){
      var j; try{ j = JSON.parse(t); }catch(e){ throw new Error('bad-response'); }
      if(!j.ok) throw new Error(j.error || 'server');
      return j;
    });
}
var jsonpSeq = 0;
function jsonp(params){
  return new Promise(function(res, rej){
    var cb = '__coachcb' + (++jsonpSeq);
    var s = document.createElement('script');
    var timer = setTimeout(function(){ cleanup(); rej(new Error('timeout')); }, 20000);
    function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function(data){ cleanup(); res(data); };
    var o = {}; Object.keys(params).forEach(function(k){ o[k]=params[k]; }); o.callback = cb;
    s.src = CFG.url + '?' + qs(o);
    s.onerror = function(){ cleanup(); rej(new Error('jsonp')); };
    document.head.appendChild(s);
  });
}
function get(params){
  if(!hasServer()) return Promise.reject(new Error('no-server'));
  return fetch(CFG.url + '?' + qs(params), { method:'GET', redirect:'follow' })
    .then(function(r){ return r.text(); })
    .then(function(t){ return JSON.parse(t); })
    .catch(function(){ return jsonp(params); });
}

function guideKey(){
  if(S.mode === 'free') return '시작-무료';

  if(isLearner()) return '시작-수강생';
  return isObs() ? '시작-관찰자' : '시작-본인';

function timeLabel(){
  if(isToken()) return S.role === 'teamlead' ? APP['소요-명단리더'] : APP['소요-명단원'];
  if(S.role === 'member') return APP['소요-팀원'];
  if(S.role === 'teamlead') return APP['소요-리더'];

function metaLabel(){

  return a.join(' · ');
}

/* 개인 링크 `?t=토큰` — 내 이름·역할과 평가할 사람 목록을 받아 화면을 짠다 (설계 5장) */

     70문항을 빠르게 넘기면 화면이 굼떠진다. 뒤로가기 한 칸만 미리 깔아 둔다. */

function stepText(step){
  if(step.part === 'B'){ var b = bOf(step.code); return b ? b.text : ''; }
  if(step.part === 'C'){ var c = cOf(step.code); return c ? c.member : ''; }
  var it = itemOf(step.code), tx = L.textFor(it, S.leads);
  return isObs() ? tx.obs : tx.self;
}
function stepTag(step){
  if(step.part === 'B'){
    var b = bOf(step.code), dd = domainOf(b.domainNo);
    return APP['파트B-제목'] + ' · ' + (bItems().map(function(x){return x.code;}).indexOf(step.code)+1) + '/' + bItems().length +
           (dd ? ' · ' + (dd.floor ? '1 ' + dd.name : (dd.mark||'') + ' ' + dd.name) : '');
  }
  if(step.part === 'C'){
    return APP['파트C-제목'] + ' · ' + (cItems().map(function(x){return x.code;}).indexOf(step.code)+1) + '/' + cItems().length;
  }
  var d = domainOf(step.no);
  var n = d.items.map(function(x){ return x.code; }).indexOf(step.code) + 1;
  return (d.floor ? '1 · ' : (d.mark||'') + ' ') + d.name + ' · ' + n + '/' + d.items.length;

$('a-pe-skip').onclick = function(){

document.addEventListener('keydown', function(e){
  if(S.screen !== 'a-peer') return;
  var grid = $('a-pe-grid');
  var row = grid.children[S.peerAt];
  if(!row) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); peerFocus(S.peerAt + 1); return; }
  if(e.key === 'ArrowUp'){ e.preventDefault(); peerFocus(S.peerAt - 1); return; }
  var pick = row.querySelector('.a-cpick');
  if(!pick) return;
  if(e.key >= '1' && e.key <= '5'){
    var b = pick.children[parseInt(e.key,10)-1];
    if(b){ e.preventDefault(); b.click(); }
  } else if(e.key === 'n' || e.key === 'N'){
    var nb2 = pick.children[M.scale.length];
    if(nb2){ e.preventDefault(); nb2.click(); }
  }
});

function setSlider(v){
  var o = $('a-sl-val');
  o.textContent = v;
  o.setAttribute('data-unit', APP['예측-단위'] || '');
}
$('a-sl-input').addEventListener('input', function(){ setSlider(this.value); });
$('a-sl-go').onclick = function(){
  var step = STEPS[S.idx];
  if(step && step.t === 'slider'){ S.D[step.code] = parseInt($('a-sl-input').value, 10); saveProgress(); }
  if(advance()) renderStep(1);
};
$('a-sect-go').onclick = function(){ if(advance()) renderStep(1); };

/* 고른 뒤 0.15초 두었다가 다음 문항으로 넘어간다. 고른 것이 잠깐 보이게 하려는 시간이다.
   그 사이에 또 누르면 기다리지 않고 바로 넘긴다 — 빨리 넘기는 사람도 있고,
   기기가 느려 타이머가 늦게 깨는 일도 있어서 넘어가는 길을 타이머 하나에만 맡기지 않는다. */
var PENDING = null;
function choose(v, btn){
  var step = STEPS[S.idx];
  bag(step.part)[step.code] = v;            /* 누른 답은 넘어가는 중에도 놓치지 않는다 */
  Array.prototype.forEach.call($('a-opts').children, function(c){
    c.setAttribute('aria-pressed', c===btn ? 'true' : 'false');
  });
  saveProgress();
  if(PENDING){ PENDING(); return; }         /* 이미 예약된 전환이 있으면 지금 실행한다 */
  var go = function(){
    if(PENDING !== go) return;              /* 이미 넘어갔다 */
    PENDING = null; S.locked = false;
    if(advance()) renderStep(1);
  };
  PENDING = go;
  S.locked = true;
  setTimeout(go, reduced() ? 10 : 150);
}

function advance(){
  if(S.idx + 1 < STEPS.length){ S.idx += 1; saveProgress(); return true; }
  finishQuiz();
  return false;
}
function goPrev(){
  if(S.idx <= 0) return false;
  PENDING = null; S.locked = false;        /* 예약된 전환이 있으면 버린다 */
  S.idx -= 1; saveProgress(); renderStep(-1); return true;
}
$('a-prev').onclick = function(){ goPrev(); };
/* 휴대폰의 뒤로가기(제스처·버튼)도 한 문항 뒤로 간다. 되돌린 뒤 기록을 한 칸 다시 깔아
   다음 뒤로가기도 받게 한다. 첫 문항에서 뒤로가면 시작 화면으로 나간다. */
window.addEventListener('popstate', function(){
  if(S.screen !== 'a-quiz' && S.screen !== 'a-peer') return;
  if(goPrev()) armBack();
  else { show('a-start'); buildStart(); }
});
document.addEventListener('keydown', function(e){
  if(S.screen !== 'a-quiz') return;
  if(!$('a-itembox').hidden){
    if(e.key >= '1' && e.key <= '5'){
      var b = $('a-opts').children[parseInt(e.key,10)-1];
      if(b){ e.preventDefault(); b.click(); }
    } else if((e.key === 'n' || e.key === 'N') && isObs()){
      var nb = $('a-opts').children[M.scale.length];
      if(nb){ e.preventDefault(); nb.click(); }
    }
  } else if(!$('a-sliderbox').hidden){
    if(e.key === 'Enter'){ e.preventDefault(); $('a-sl-go').click(); }
  } else if(e.key === 'Enter' || e.key === ' '){
    if(document.activeElement === document.body){ e.preventDefault(); $('a-sect-go').click(); }
  }
  if(e.key === 'ArrowLeft' && S.idx > 0){ e.preventDefault(); $('a-prev').click(); }
});

/* ── 제출 ─────────────────────────────────────────────── */
function payload(){
  var pay = { p:S.p, r:S.role, l:S.leads ? 1 : 0, round:S.round,
              ch: S.mode === 'coach' ? 'paper' : 'app',
              name: asksName() ? S.name : '', answers:{}, open:S.open };
  if(S.mode === 'coach') pay.k = S.key;   // 코치 키로 넣는 종이 응답
  if(S.token){
    /* 개인 링크 — 코드·역할·이름은 서버가 명단에서 읽는다 */
    pay.t = S.token;
    pay.name = '';
    pay.peer = {};
    Object.keys(S.peer).forEach(function(pid){
      if(Object.keys(S.peer[pid] || {}).length) pay.peer[pid] = S.peer[pid];
    });
  }
  Object.keys(S.ans).forEach(function(k){ pay.answers[k] = S.ans[k]; });
  if(isTeam()){
    pay.B = {}; Object.keys(S.B).forEach(function(k){ pay.B[k] = S.B[k]; });
    if(S.role === 'member'){ pay.C = {}; Object.keys(S.C).forEach(function(k){ pay.C[k] = S.C[k]; }); }
    else { pay.D = {}; Object.keys(S.D).forEach(function(k){ pay.D[k] = S.D[k]; }); }
  }
  return pay;
}
function submit(){
  if(S.mode === 'free'){ clearProgress(); localReport(); return; }
  var pay = payload();
  txt('a-send-msg', APP['제출중']);
  $('a-sending').hidden = false; $('a-sendfail').hidden = true;
  show('a-send');
  post(pay).then(function(j){
    if(j && j.key) S.myKey = j.key;              // 이 응답 한 줄만 여는 개인 키
    pendingDrop(pay); clearProgress(); afterSubmit();
  }).catch(function(err){
    if(String(err && err.message) === 'done'){    // 같은 링크로 두 번 보낼 수 없다
      clearProgress();
      $('a-sending').hidden = true; $('a-sendfail').hidden = false;
      txt('a-fail-title', APP['비공개-제목']);
      txt('a-fail-hint', APP['이미제출']);
      $('a-retry').hidden = true;
      return;
    }
    pendingPush(pay);
    $('a-sending').hidden = true; $('a-sendfail').hidden = false;
    txt('a-fail-title', APP['제출실패']);
    txt('a-fail-hint', APP['제출실패-안내']);
    txt('a-retry', APP['재시도-버튼']);
  });
}
$('a-retry').onclick = function(){
  var pay = payload();
  $('a-sending').hidden = false; $('a-sendfail').hidden = true;
  txt('a-send-msg', APP['제출중']);
  post(pay).then(function(j){ if(j && j.key) S.myKey = j.key; pendingDrop(pay); clearProgress(); afterSubmit(); })
    .catch(function(){ $('a-sending').hidden = true; $('a-sendfail').hidden = false; });
};
function resendPending(){
  var q = pending();
  if(!q.length) return;
  toast(APP['제출중']);
  var left = q.length, okN = 0;
  q.forEach(function(pay){
    post(pay).then(function(){ pendingDrop(pay); okN++; }).catch(function(){})
      .then(function(){ if(--left === 0){ toast(okN ? '보관해 둔 응답 ' + okN + '건을 보냈습니다.' : APP['제출실패']); buildStart(); } });
  });
}

function afterSubmit(){

/* ── 리포트 ───────────────────────────────────────────── */

/* 코치 요약 — 코치 키로 열었을 때만 보인다. 여기 적은 것만 리더·담당자에게 나간다. */
function summaryKeysFor(kind){
  if(kind === '360') return ['관찰자1','관찰자2'];

function summaryForm(pl){

  card.appendChild(el('h3', null, APP['요약-제목']));
  card.appendChild(el('p','a-hint', APP['요약-안내']));
  var areas = {};
  keys.forEach(function(k){
    card.appendChild(el('p','a-sq', (M.open[k] || k) + '  (' + k + ')'));
    var ta = el('textarea','a-carea');

  btn.style.marginTop = '14px';
  btn.onclick = function(){
    var payloads = keys.map(function(k){
      return { kind:'summary', p:S.p, k:S.key, question:k,
               lines: areas[k].value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean) };
    });
    btn.disabled = true;
    var left = payloads.length, bad = 0;
    payloads.forEach(function(pay){
      post(pay).catch(function(){ bad++; }).then(function(){
        if(--left === 0){ btn.disabled = false; toast(bad ? APP['제출실패'] : APP['요약-저장완료']); }

/* 리포트 보기 모드 — 서버가 계산한 집계만 받는다 */
function viewReport(){
  if(!hasServer()){ show('a-send'); viewFail(APP['서버없음']); return; }
  show('a-send');
  $('a-sending').hidden = false; $('a-sendfail').hidden = true;
  txt('a-send-msg', APP['불러오는중']);
  get({ p:S.p, k:S.key, v:S.view, round:S.round > 1 ? S.round : '' }).then(function(j){
    if(!j || !j.ok){
      if(j && (j.error === 'few' || j.error === 'empty' || j.error === 'no-observer' || j.error === 'no-leader')){
        viewFew(j.error); return;
      }
      viewFail(j && j.error === 'denied' ? APP['권한오류'] : APP['링크오류']); return;
    }
    S.coach = !!j.coach;
    var pl = { kind:j.kind, model:M, logo:window.__LOGO__, meta:j.meta || {}, result:j.result };
    pl.meta.sample = false;
    if(j.summaries) pl.summaries = j.summaries;
    if(j.team) pl.team = j.team;
    if(j.individual) pl.individual = j.individual;
    if(j.peer) pl.peer = j.peer;               // 기반 역량 세 줄 비교 (설계 5장)
    if(j.peerTeam) pl.peerTeam = j.peerTeam;   // 대시보드의 '서로를 본 평균' 패널
    S.name = (pl.meta && pl.meta.name) || '';
    paintReport(pl);
  }).catch(function(){ viewFail(APP['링크오류']); });
}
/* 아직 열 수 없는 경우 — 3명 미만이거나 응답이 없다 (PRD 2.2) */

/* ── 코치 입력 모드 — 종이 질문지를 옮겨 적는다 ────────── */
var CP = { pages:[], i:0, row:0, meta:null };

function coachPages(){
  var pages = [];
  domains().forEach(function(d){ pages.push({ kind:'A', no:d.no }); });
  if(isTeam()) pages.push({ kind:'B' });
  if(S.role === 'member') pages.push({ kind:'C' });
  if(S.role === 'teamlead') pages.push({ kind:'D' });
  if(openKeys().length) pages.push({ kind:'E' });
  return pages;
}
function coachRows(page){
  if(page.kind === 'A'){
    return domainOf(page.no).items.map(function(it){
      var tx = L.textFor(it, S.leads);
      return { code:it.code, part:'A', name:it.name, text:isObs() ? tx.obs : tx.self };
    });
  }
  if(page.kind === 'B') return bItems().map(function(x){ return { code:x.code, part:'B', name:x.name, text:x.text }; });
  if(page.kind === 'C') return cItems().map(function(x){ return { code:x.code, part:'C', name:x.name, text:x.member }; });
  if(page.kind === 'D') return dItems().map(function(x){ return { code:x.code, part:'D', name:x.label, text:x.label, num:true }; });
  return openKeys().map(function(k, i){ return { code:'open' + (i+1), part:'E', name:k, text:M.open[k] || k, open:true }; });
}
function coachPageTitle(page){
  if(page.kind === 'A'){ var d = domainOf(page.no); return (d.floor ? '1 · ' : (d.mark||'') + ' ') + d.name; }

function c_focus(ri){

document.addEventListener('keydown', function(e){
  if(S.screen !== 'a-coach' || $('a-c-page').hidden) return;
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName)) return;
  var grid = $('a-c-grid');
  var row = grid.children[CP.row];
  if(!row) return;
  var pick = row.querySelector('.a-cpick');
  if(e.key === 'ArrowDown'){ e.preventDefault(); c_focus(CP.row + 1); return; }
  if(e.key === 'ArrowUp'){ e.preventDefault(); c_focus(CP.row - 1); return; }
  if(!pick) return;
  if(e.key >= '1' && e.key <= '5'){
    var b = pick.children[parseInt(e.key,10)-1];
    if(b){ e.preventDefault(); b.click(); }
  } else if((e.key === 'n' || e.key === 'N') && isObs()){
    var nb = pick.children[M.scale.length];
    if(nb){ e.preventDefault(); nb.click(); }
  }
});

   f.when 을 주면 그 칸은 지금 고른 값에 따라 보였다 숨었다 한다. */
function adForm(title, fields, onSubmit, opts){
  opts = opts || {};
  var box = $('a-ad-form');
  box.innerHTML = '';
  var card = el('div','a-adform');
  card.appendChild(el('h3', null, title));
  if(opts.note) card.appendChild(el('p','a-formnote', opts.note));
  var inputs = {}, wraps = {}, descs = {};
  fields.forEach(function(f){
    var wrap = el('div');
    var lab = el('label', null, f.label); lab.setAttribute('for', 'ad-' + f.name);
    lab.id = 'ad-lab-' + f.name;
    wrap.appendChild(lab);
    var inp;
    if(f.options){
      inp = document.createElement('select');
      f.options.forEach(function(o){
        var op = document.createElement('option');
        op.value = o.v; op.textContent = o.t;
        inp.appendChild(op);
      });
    } else {
      inp = document.createElement('input');
      inp.type = f.type || 'text';
      if(f.placeholder) inp.placeholder = f.placeholder;
    }
    inp.id = 'ad-' + f.name;
    if(f.value !== undefined) inp.value = f.value;
    wrap.appendChild(inp);
    var d = el('p','a-fd', f.desc || '');
    d.id = 'ad-desc-' + f.name;
    if(!f.desc) d.hidden = true;
    wrap.appendChild(d);
    card.appendChild(wrap);
    inputs[f.name] = inp;
    wraps[f.name] = wrap;
    descs[f.name] = d;
    if(f.onChange) inp.onchange = function(){ f.onChange(inp.value, { inputs:inputs, wraps:wraps, descs:descs, labels:card }); };
  });
  if(opts.ready) opts.ready({ inputs:inputs, wraps:wraps, descs:descs, labels:card });
  var row = el('div','a-rowbtn');
  var ok = el('button','a-btn a-primary', opts.submit || APP['콘솔-만들기']); ok.type='button';
  ok.onclick = function(){
    var v = {};
    Object.keys(inputs).forEach(function(k){ v[k] = inputs[k].value; });
    onSubmit(v);
  };
  var no = el('button','a-btn a-line', APP['콘솔-닫기']); no.type='button';
  no.onclick = function(){ box.innerHTML = ''; };
  row.appendChild(ok); row.appendChild(no);
  card.appendChild(row);
  box.appendChild(card);
  box.scrollIntoView({ block:'nearest' });
}

        { name:'name', label:APP['콘솔-부서이름'], desc:APP['콘솔-부서이름설명'] }
      ], function(v){
        adminPost({ action:'createGroup', clientId:c.clientId, groupId:v.groupId, name:v.name },
          function(){ $('a-ad-form').innerHTML = ''; });
      });
    };
    h.appendChild(add);
    card.appendChild(h);
    if(!c.groups.length) card.appendChild(el('p','a-empty', APP['콘솔-부서추가'] + ' →'));
    c.groups.forEach(function(g){
      var gd = el('div','a-gr');
      var gh = el('div','a-gr-h');
      var gt = el('h4');
      gt.appendChild(el('span','a-idchip', g.groupId));
      gt.appendChild(document.createTextNode(g.name));
      gh.appendChild(gt);
      var nb = el('button','a-btn a-line', APP['콘솔-건추가']);
      nb.type='button'; nb.style.cssText = 'min-height:34px;padding:.15rem .8rem;font-size:12.5px';
      nb.onclick = function(){ newProjectForm(g.groupId); };
      gh.appendChild(nb);
      gd.appendChild(gh);
      g.projects.forEach(function(p){ gd.appendChild(projectCard(p)); });
      card.appendChild(gd);
    });
    box.appendChild(card);
  });
  if(t.loose.length){
    var lc = el('div','a-cl');
    var lh = el('div','a-cl-h');
    lh.appendChild(el('h3', null, APP['콘솔-미분류']));
    lc.appendChild(lh);
    t.loose.forEach(function(p){ lc.appendChild(projectCard(p)); });
    box.appendChild(lc);
  }
}
$('a-ad-reload').onclick = function(){ loadAdmin(); };
$('a-ad-newclient').onclick = function(){
  adForm(APP['콘솔-회사추가'], [
    { name:'clientId', label:APP['콘솔-회사ID'], placeholder:'KKO', desc:APP['콘솔-회사ID설명'] },
    { name:'name', label:APP['콘솔-회사이름'], desc:APP['콘솔-회사이름설명'] }
  ], function(v){
    adminPost({ action:'createClient', clientId:v.clientId, name:v.name },
      function(){ $('a-ad-form').innerHTML = ''; });
  });
};
function bootAdmin(){
  if(!hasServer()){ show('a-send'); viewFail(APP['서버없음']); return; }
  show('a-send');
  $('a-sending').hidden = false; $('a-sendfail').hidden = true;
  txt('a-send-msg', APP['불러오는중']);
  loadAdmin();
}

/* ── 부팅 ─────────────────────────────────────────────── */
(function boot(){
  var q = new URLSearchParams(location.search);
  var p = (q.get('p')||'').trim(), r = (q.get('r')||'').trim(), k = (q.get('k')||'').trim();
  var v = (q.get('v')||'').trim(), l = q.get('l');
  var mode = (q.get('mode')||'').trim();
  var round = parseInt(q.get('round')||'1', 10);
  S.round = isFinite(round) && round > 0 ? round : 1;
  if(l === '1' || l === 'y') S.leads = true;
  else if(l === '0' || l === 'n') S.leads = false;

  buildSteps();
  buildName(); buildLeads();

  var tkn = (q.get('t')||'').trim();
  if(tkn){                            /* 개인 링크 — 코드·역할은 서버가 명단에서 읽는다 */
    S.mode = 'respond'; S.token = tkn;
    loadToken();
    return;
  }
  if(k && mode === 'admin'){          /* 코치 콘솔 — 진단 코드가 없다 */
    S.mode = 'admin'; S.key = k;
    bootAdmin();
    return;
  }
  if(p && k && mode === 'coach'){
    S.p = p; S.key = k;
    bootCoach();
    return;
  }
  var validRole = ['self','leader','peer','report','member','teamlead','learner'].indexOf(r) >= 0;
  if(p && r && validRole){
    // 응답 링크(r=)가 우선이다. 본인 링크에는 다시 열기용 키(k=)가 함께 붙어 오는데,
    // 키만 보고 리포트 화면으로 가면 "아직 응답이 없습니다"가 뜬다 (2026-09-17 피터 파일럿에서 발견).
    S.mode = 'respond'; S.p = p; S.role = r; if(k) S.key = k;
  } else if(p && k){
    S.mode = 'view'; S.p = p; S.key = k; S.view = v || 'self';
    viewReport();
    return;
  } else {
    S.mode = 'free'; S.role = 'self';
  }
  if(S.role === 'teamlead') S.leads = true;
  buildSteps();                 // 역할이 정해진 뒤에 단계를 다시 짠다 (팀은 B·C·D 가 붙는다)
  buildStart();
  show('a-start');
  if(S.mode === 'respond') loadMeta();
})();
})();
</script>
